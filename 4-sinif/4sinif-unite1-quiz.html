<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farklıyız, Arkadaşız | 4. Sınıf Keşif Quizi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:#eaf3ff;color:#1e293b;padding:14px;display:flex;justify-content:center}
.box{width:100%;max-width:820px;background:#fff;border:3px solid #bcd6f7;border-radius:22px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#f4f9ff;border-bottom:3px solid #bcd6f7;font-weight:800}
.sc{background:#fff3c4;color:#a16207;border-radius:99px;padding:4px 14px}
.rail{height:9px;background:#dbe8f8}#pf{height:100%;width:0;background:#7c5cff;transition:width .3s}
#app{padding:20px 18px}h2{font-size:1.45rem;margin-bottom:4px}.d{color:#475569;margin-bottom:14px}
.pool,.bank{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#f7fbff;border:2px solid #bcd6f7;border-radius:14px;margin-bottom:14px;min-height:56px}
.pill,.w{background:#fff;border:2.5px solid #bcd6f7;border-radius:99px;padding:9px 18px;font-weight:800;cursor:pointer}
.on{background:#7c5cff;color:#fff;border-color:#7c5cff}.w.pl{opacity:.35;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bk{border:3px dashed #a9c4ea;border-radius:14px;padding:14px;min-height:150px;cursor:pointer;background:#f4f9ff}.bk h3{font-size:1.05rem;margin-bottom:10px}
.chip{display:inline-block;background:#fff;border:2px solid #bcd6f7;border-radius:99px;padding:4px 12px;margin:3px;font-weight:800;font-size:.92rem}.chip b{color:#dc2626;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f7fbff;border:2px solid #bcd6f7;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.b2{border:2.5px solid #bcd6f7;background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;min-height:44px}
.t{background:#d1fae5;border-color:#059669;color:#047857}.f{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.slot{display:inline-block;min-width:110px;border-bottom:3px dashed #7c5cff;background:#efeaff;border-radius:6px;padding:1px 8px;margin:0 3px;text-align:center;font-weight:800;color:#5b3fd6;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2.5px solid #bcd6f7;border-radius:14px;padding:13px 15px;margin-bottom:10px;font:inherit;font-weight:700;cursor:pointer}
.opt.on{background:#efeaff;border-color:#7c5cff;color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:2px solid #bcd6f7}
.nx{background:#7c5cff;color:#fff;border:0;border-radius:14px;padding:14px 26px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #5b3fd6}.nx:disabled{opacity:.4;cursor:not-allowed}
.rv{border:2px solid;border-radius:14px;padding:10px 14px;margin-bottom:10px}.ok{background:#d1fae5;border-color:#059669}.bad{background:#fee2e2;border-color:#dc2626}
.note{font-size:.93rem;color:#475569;margin-top:4px}
input{width:100%;padding:12px;border:2.5px solid #bcd6f7;border-radius:12px;font:inherit;margin-bottom:10px}
.big{font-size:2.3rem;font-weight:800;color:#5b3fd6}
@media(max-width:600px){.g2{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.bar{flex-direction:column;align-items:stretch}}
</style></head><body>
<div class="box"><div class="hd"><span>📚 4. Sınıf Sosyal Bilgiler • Farklıyız, Arkadaşız</span><span><span id="st">Giriş</span> &nbsp;<span class="sc">★ <span id="sc">0</span></span></span></div>
<div class="rail"><div id="pf"></div></div><div id="app"></div></div>
<script>
const SCRIPT_URL=""; // Google Apps Script adresini buraya yapıştır

// URL'den kodu yakala (?tasokul veya ?kod=tasokul)
const URL_KOD=(function(){const p=new URLSearchParams(location.search);let k=(p.get('kod')||'').trim();if(!k){for(const key of p.keys()){if(key!=='kod'){k=key.trim();break}}}return k})();

const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const SORT=[["Uzun boylu","f"],["Mavi gözlü","f"],["Kıvırcık saçlı","f"],["Saç rengi","f"],["Açık sözlü","k"],["Konuşkan","k"],["Sakin","k"],["Neşeli","k"]];

const TF=[["Türkiye Cumhuriyeti kimlik kartı, anne veya babası vatandaş olan çocuğa doğumdan sonra verilir.",true,"Her çocuğa doğumdan sonra kimlik kartı verilir."],["Kütüphane kartı resmî bir kimlik belgesidir.",false,"Kütüphane kartı özel kimlik belgesidir. Kimlik kartı, ehliyet ve pasaport resmîdir."],["T.C. kimlik numarası 11 rakamdan oluşur.",true,"Her kişinin 11 haneli kendine özel bir numarası vardır."],["Herkesin kimlik numarası aynıdır.",false,"Kimlik numarası parmak izi gibi kişiye özeldir."],["Olayları oluş sırasına göre sıralamaya kronolojik sıralama denir.",true,"Önce olan başa, sonra olan sona yazılır."],["Herkesin ilgi ve yetenekleri aynıdır.",false,"İlgi ve yeteneklerimiz birbirinden farklı olabilir."],["Fiziksel özelliklerimiz büyüdükçe değişebilir.",true,"Büyüdükçe boyumuz uzayabilir."],["Farklı özelliklere sahip olmak arkadaş olmaya engeldir.",false,"Farklılıklarımız arkadaş olmamıza engel değildir."],["Yaşlı ve engelli bireylere destek olmak toplumun görevidir.",true,"Hepimiz dezavantajlı bireylere yardımcı olmalıyız."],["Demokraside farklı fikirler özgürce söylenebilir.",true,"Demokraside herkesin fikrine saygı gösterilir."]];

const FILL=[["Türkiye Cumhuriyeti vatandaşı olduğumuzu gösteren en önemli belge {} kartımızdır.","kimlik"],["Ehliyet ve pasaport {} kimlik belgesidir.","resmî"],["Olayları oluş sırasına göre sıralamaya {} sıralama denir.","kronolojik"],["Boş zamanlarımızda keyifle yaptığımız uğraşlara {} denir.","hobi"],["Kendimizi karşımızdakinin yerine koymaya {} denir.","empati"],["Boy, saç rengi ve göz rengi {} özelliklerimizdir.","fiziksel"],["Farklı fikirlerin özgürce söylenebildiği yönetim biçimine {} denir.","demokrasi"],["Kütüphane kartı gibi belgeler {} kimlik belgesidir.","özel"],["Okula girerken göstererek öğrenci olduğumuzu kanıtladığımız belge {} kimlik kartıdır.","Öğrenci"],["Farklı düşünen arkadaşlarımıza {} göstermeliyiz.","saygı"]];
const BANK=["kimlik","resmî","kronolojik","hobi","empati","fiziksel","demokrasi","özel","Öğrenci","saygı","kişilik","yetenek","ihtiyaç"];

const MCQ=[["Aşağıdakilerden hangisi kimlik kartımızda yazmaz?","Kardeş sayımız",["Adımız","Doğum tarihimiz","Annemizin adı"],"Kimlik kartında kardeş sayısı yazmaz."],
["Okula kayıt olurken hangisini yanımıza almalıyız?","Kimlik kartımızı",["Oyuncağımızı","Alışveriş fişini","Defterimizi"],"Okul kaydında kimlik bilgilerimiz istenir."],
["Sürücü belgesi kimlere verilir?","Araç kullanabilen insanlara",["Okula giden çocuklara","Kitap okuyanlara","Alışveriş yapanlara"],"Araç kullananlar sürücü belgesini yanında taşımalıdır."],
["Yasemin 2012'de doğdu, 2013'te yürümeye başladı, 2018'de okula başladı. En son hangisini yaşamıştır?","Okula başlamayı",["Doğmayı","Yürümeye başlamayı"],"Kronolojik sıraya göre en son olay 2018'deki okul başlangıcıdır."],
["Resim yapmakta çok başarılı olan Zeynep'in bu durumu neyi gösterir?","Yeteneğini",["Kimlik numarasını","Boyunu","Doğum gününü"],"Resim yapmak bir yetenektir."],
["Boş zamanlarda yapılan uğraşlara ne denir?","Hobi",["Rol","Kimlik","Ödev"],"Halk oyunu, satranç, yüzme birer hobi olabilir."],
["Ali futbolu, Elif resim yapmayı sever. Bu neyi gösterir?","İlgilerin farklı olabileceğini",["Herkesin aynı olduğunu","Elif'in yanlış yaptığını","Futbolun kötü olduğunu"],"Her insanın ilgi alanı farklı olabilir."],
["Gözleri görmeyen birine yolda karşıya geçerken yardım etmek neyi gösterir?","Empati kurmayı ve yardımseverliği",["Yarışmayı","Alışveriş yapmayı","Oyun oynamayı"],"Kendimizi onun yerine koyarak yardım ederiz."],
["Bizden farklı özelliklere sahip bir arkadaşımıza nasıl davranmalıyız?","Saygıyla",["Alay ederek","Görmezden gelerek","Onu değiştirmeye çalışarak"],"Farklılıklar bir zenginliktir; saygı göstermeliyiz."],
["Elif büyüyünce veteriner olmak istiyor çünkü hayvanları çok seviyor. Mesleğini neye göre seçmiştir?","İlgisine göre",["Boyuna göre","Saç rengine göre","Kimlik numarasına göre"],"İnsanlar mesleklerini ilgi ve yeteneklerine göre seçer."]];

const ORD=[["Elif'in yaşam öyküsü",["Elif doğdu","Elif yürümeye başladı","Elif okula başladı"]],["Türkiye'de kimlik belgesinin değişimi",["Nüfus cüzdanı (defter şeklinde)","Nüfus cüzdanı (kart şeklinde)","T.C. elektronik kimlik kartı"]],["Bir hobi edinme",["Satranca ilgi duyarım","Satranç kursuna giderim","Okulumda satranç turnuvasına katılırım"]]];

const MAX=[16,20,20,20,24],NM=["Fiziksel mi, Kişilik mi?","Doğru / Yanlış","Kelime Sandığı","Çoktan Seçmeli","Sıralama"];
let sec=-1,score=0,me={},sc=[],W=[],rev=null,sent=0;

const S={p:{},s:null,items:sh(SORT.map((x,i)=>({i,t:x[0],c:x[1]})))};
const T={a:{},items:sh(TF.map((x,i)=>({i,t:x[0],v:x[1],e:x[2]})))};
const F={p:{},s:null,items:sh(FILL.map((x,i)=>({i,t:x[0],r:x[1]}))),bank:sh(BANK)};
const M={i:0,a:{},rows:[],qs:MCQ.map(q=>({q:q[0],r:q[1],o:sh([q[1],...q[2]]),e:q[3]}))};
const O={i:0,rows:[],e:0,st:ORD.map(s=>{let o=sh(s[1].map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();return{t:s[0],it:s[1],o}})};
const bar=(m,on,fn,l="Bölümü Tamamla →")=>`<div class="bar"><b>${m}</b><button class="nx" ${on?"":"disabled"} onclick="${fn}">${l}</button></div>`;
const esc=s=>String(s).replace(/</g,"&lt;");

function R(top){
  const y=scrollY;
  $("#sc").textContent=score;
  $("#st").textContent=sec<0?"Giriş":sec<5?`Bölüm ${sec+1} / 5`:"Sonuç";
  $("#pf").style.width=Math.max(0,sec)*20+"%";
  $("#app").innerHTML=rev?revH():[startH,sortH,tfH,fillH,mcqH,ordH,endH][sec+1]();
  scrollTo(0,top?0:y);
  if(sec==5&&!rev&&!sent){sent=1;send()}
}
function fin(rows,e){score+=e;sc[sec]=e;rows.forEach(r=>{if(!r.ok)W.push(r)});rev={rows,e};R(1)}
function go(){rev=null;sec++;R(1)}
function revH(){
  return `<h2>Bölüm ${sec+1} sonucu: +${rev.e} / ${MAX[sec]} puan</h2><p class="d">Yanlışlarını incele, doğrusunu öğren.</p>
  ${rev.rows.map(r=>`<div class="rv ${r.ok?"ok":"bad"}">${r.ok?"✓":"✗"} ${r.t}${r.ok?"":`<div class="note">${r.n}</div>`}</div>`).join("")}
  ${bar("",1,"go()",sec==4?"Sonucu Gör 🏁":"Sonraki Bölüm →")}`;
}
function startH(){
  return `<h2>🧒 Farklıyız, Arkadaşız Quizi</h2>
  <p class="d">Kimlik, yaşam öyküsü, ilgi ve yetenekler, farklılıklara saygı… Hazır mısın? Toplam 100 puan!</p>
  <input id="ia" placeholder="Ad Soyad"><input id="is" placeholder="Sınıf (örn. 4-A)"><input id="in" placeholder="Okul numarası (bilmiyorsan boş bırak)">
  ${bar("",1,"st0()","Başla →")}`;
}
function st0(){
  const a=$("#ia").value.trim(),s=$("#is").value.trim();
  if(!a||!s){alert("Ad soyad ve sınıfı yaz.");return}
  me={a,s,n:$("#in").value.trim()||"-",k:URL_KOD};sec=0;R(1);
}
function sortH(){
  const un=S.items.filter(x=>!S.p[x.i]),
  bk=c=>S.items.filter(x=>S.p[x.i]==c).map(x=>`<span class="chip">${x.t} <b onclick="event.stopPropagation();delete S.p[${x.i}];R()">×</b></span>`).join("")||"<small>Buraya dokun</small>";
  return `<h2>Bölüm 1: Fiziksel mi, Kişilik mi?</h2>
  <p class="d">Bir özellik seç, sonra doğru sepete dokun.</p>
  <div class="pool">${un.map(x=>`<div class="pill ${S.s===x.i?"on":""}" onclick="S.s=${x.i};R()">${x.t}</div>`).join("")||"✓ Hepsi yerleşti"}</div>
  <div class="g2">
    <div class="bk" onclick="drop('f')"><h3>🧍 Fiziksel Özellik</h3>${bk("f")}</div>
    <div class="bk" onclick="drop('k')"><h3>💛 Kişilik Özelliği</h3>${bk("k")}</div>
  </div>
  ${bar(`Kalan: ${un.length}`,!un.length,"doneS()")}`;
}
function drop(c){if(S.s==null)return;S.p[S.s]=c;S.s=null;R()}
function doneS(){
  const rows=S.items.map(x=>({ok:S.p[x.i]==x.c,t:x.t,n:`Doğrusu: ${x.c=="f"?"Fiziksel özellik":"Kişilik özelliği"}`}));
  fin(rows,rows.filter(r=>r.ok).length*2);
}
function tfH(){
  const n=Object.keys(T.a).length;
  return `<h2>Bölüm 2: Doğru mu, Yanlış mı?</h2><p class="d">10 cümleyi işaretle.</p>
  ${T.items.map(x=>`<div class="row"><span>${x.t}</span><span style="display:flex;gap:8px"><button class="b2 ${T.a[x.i]===true?"t":""}" onclick="T.a[${x.i}]=true;R()">✓ DOĞRU</button><button class="b2 ${T.a[x.i]===false?"f":""}" onclick="T.a[${x.i}]=false;R()">✕ YANLIŞ</button></span></div>`).join("")}
  ${bar(`Cevaplanan: ${n} / 10`,n==10,"doneT()")}`;
}
function doneT(){
  const rows=T.items.map(x=>({ok:T.a[x.i]===x.v,t:x.t,n:`Senin cevabın: ${T.a[x.i]?"Doğru":"Yanlış"}. Doğrusu: <b>${x.v?"Doğru":"Yanlış"}</b>. ${x.e}`}));
  fin(rows,rows.filter(r=>r.ok).length*2);
}
function fillH(){
  const u=Object.values(F.p),n=u.length;
  return `<h2>Bölüm 3: Kelime Sandığı</h2>
  <p class="d">Bir kelime seç, sonra boşluğa dokun. Dolu boşluğa dokunursan kelime geri alınır.</p>
  ${F.items.map(x=>`<div class="row" style="display:block;line-height:2.1">${x.t.replace("{}",`<span class="slot" onclick="setSlot(${x.i})">${F.p[x.i]||"dokun"}</span>`)}</div>`).join("")}
  <div class="bank">${F.bank.map((w,k)=>`<div class="w ${F.s===w?"on":""} ${u.includes(w)?"pl":""}" onclick="pickW(${k})">${w}</div>`).join("")}</div>
  ${bar(`Doldurulan: ${n} / 10`,n==10,"doneF()")}`;
}
function pickW(k){const w=F.bank[k];F.s=(F.s===w)?null:w;R()}
function setSlot(i){if(F.s){F.p[i]=F.s;F.s=null}else delete F.p[i];R()}
function doneF(){
  const rows=F.items.map(x=>({ok:F.p[x.i]==x.r,t:x.t.replace("{}",`<u>${F.p[x.i]}</u>`),n:`Doğrusu: <b>${x.r}</b>`}));
  fin(rows,rows.filter(r=>r.ok).length*2);
}
function mcqH(){
  const q=M.qs[M.i],a=M.a[M.i],l=M.i==M.qs.length-1;
  return `<h2>Bölüm 4: Çoktan Seçmeli</h2><p class="d">Soru ${M.i+1} / ${M.qs.length}</p>
  <p style="font-weight:800;margin-bottom:12px">${q.q}</p>
  ${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" onclick="M.a[M.i]=${i};R()">${"ABCD"[i]}) ${o}</button>`).join("")}
  ${bar(a===undefined?"Bir seçenek işaretle":"Seçim yapıldı",a!==undefined,"nextM()",l?"Bölümü Bitir →":"Sonraki Soru →")}`;
}
function nextM(){
  const q=M.qs[M.i],y=q.o[M.a[M.i]];
  M.rows.push({ok:y==q.r,t:q.q,n:`Senin cevabın: ${y}<br>Doğru cevap: <b>${q.r}</b><br>${q.e}`});
  if(M.i<M.qs.length-1){M.i++;R(1)}else fin(M.rows,M.rows.filter(r=>r.ok).length*2);
}
function ordH(){
  const s=O.st[O.i];
  return `<h2>Bölüm 5: Sıralama</h2>
  <p class="d"><b>${s.t}</b> (${O.i+1} / 3) — okları kullanarak doğru sıraya diz.</p>
  ${s.o.map((v,k)=>`<div class="row"><span>${s.it[v]}</span><span style="display:flex;gap:6px"><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button><button class="b2" ${k<2?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")}
  ${bar("",1,"okO()",O.i<2?"Sırayı Onayla →":"Quizi Bitir 🏁")}`;
}
function mv(k,d){const o=O.st[O.i].o;[o[k],o[k+d]]=[o[k+d],o[k]];R()}
function okO(){
  const s=O.st[O.i],ok=s.o.every((v,k)=>v==k);
  O.rows.push({ok,t:s.t,n:"Doğru sıra: "+s.it.map((x,k)=>`${k+1}) ${x}`).join(" → ")});
  if(ok)O.e+=8;
  if(O.i<2){O.i++;R(1)}else fin(O.rows,O.e);
}
function endH(){
  const t=score>=85?["🏅","Farklıyız Arkadaşız Şampiyonu"]:score>=65?["🌟","Harika Arkadaş"]:["🌱","Meraklı Kaşif"];
  return `<div style="text-align:center"><div style="font-size:3.5rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${esc(me.a)} • ${esc(me.s)}</p><div class="big">${score} / 100</div></div>
  <h3 style="margin:14px 0 8px">Bölüm puanların</h3>${NM.map((n,i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${sc[i]} / ${MAX[i]}</b></div>`).join("")}
  <h3 style="margin:14px 0 8px">Tekrar etmen gerekenler (${W.length})</h3>${W.length?W.map(r=>`<div class="rv bad">${r.t}<div class="note">${r.n}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
  <p id="msg" class="note" style="margin:12px 0;display:none;font-weight:700"></p>${bar("",1,"location.reload()","Yeniden Başla")}`;
}
async function send(){
  if(!me.k||!SCRIPT_URL)return;
  const m=$("#msg");
  if(m){m.style.display="block";m.style.color="#64748b";m.textContent="⏳ Sonuçların öğretmenine gönderiliyor…"}
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({kod:me.k,okulKodu:me.k,oyun:"4. Sınıf 1. Ünite Quizi",ad:me.a,sinif:me.s,no:me.n,puan:score,b:sc,yanlis:W.length,liste:W.map(r=>r.t.replace(/<[^>]+>/g,"")).join(" | ").slice(0,1500)})});
    if(m){m.style.color="#059669";m.textContent="✓ Sonucun öğretmenine gönderildi!"}
  }catch(e){
    if(m){m.style.color="#dc2626";m.textContent="⚠️ Sonuç gönderilemedi. İnternet bağlantını kontrol et."}
  }
}
R();
</script></body></html>
