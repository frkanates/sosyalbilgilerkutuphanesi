<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dünya Ailesi | 4. Sınıf 7. Ünite Quizi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f2ea;color:#1e293b;padding:16px;display:flex;justify-content:center}
.box{width:100%;max-width:880px;background:#fff;border:2px solid #e4dcce;border-radius:18px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;background:#faf7f2;border-bottom:2px solid #e4dcce;font-weight:700}
.sc{background:#fef3c7;color:#b45309;border-radius:99px;padding:4px 14px}
.rail{height:7px;background:#e7dfd2}#pf{height:100%;width:0;background:#d97706;transition:width .3s}
#app{padding:22px 20px}h2{font-size:1.4rem;margin-bottom:4px}.d{color:#64748b;margin-bottom:14px}
.pool,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fdfbf7;border:1.5px solid #e4dcce;border-radius:12px;margin-bottom:14px;min-height:54px}
.pill,.w{background:#fff;border:2px solid #e4dcce;border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.on{background:#d97706;color:#fff;border-color:#d97706}.w.pl{opacity:.35;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bk{border:2px dashed #cfc2ae;border-radius:12px;padding:14px;min-height:150px;cursor:pointer;background:#faf7f2}.bk h3{font-size:1rem;margin-bottom:10px}
.chip{display:inline-block;background:#fff;border:1px solid #d4c8b6;border-radius:99px;padding:4px 12px;margin:3px;font-weight:700;font-size:.88rem}.chip b{color:#dc2626;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fdfbf7;border:1.5px solid #e4dcce;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.b2{border:2px solid #e4dcce;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}
.t{background:#d1fae5;border-color:#059669;color:#059669}.f{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.slot{display:inline-block;min-width:110px;border-bottom:2.5px dashed #d97706;background:#fcf4e8;border-radius:6px;padding:1px 8px;margin:0 3px;text-align:center;font-weight:800;color:#b45309;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e4dcce;border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.opt.on{background:#fef3c7;border-color:#d97706;color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1.5px solid #e4dcce}
.nx{background:#d97706;color:#fff;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer}.nx:disabled{opacity:.4;cursor:not-allowed}
.rv{border:1.5px solid;border-radius:12px;padding:10px 14px;margin-bottom:8px}.ok{background:#d1fae5;border-color:#059669}.bad{background:#fee2e2;border-color:#dc2626}
.note{font-size:.9rem;color:#475569;margin-top:4px}
input{width:100%;padding:10px;border:2px solid #e4dcce;border-radius:10px;font:inherit;margin-bottom:10px}
.big{font-size:2.2rem;font-weight:800;color:#b45309}
@media(max-width:600px){.g2{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.bar{flex-direction:column;align-items:stretch}}
</style></head><body>
<div class="box"><div class="hd"><span>📚 4. Sınıf Sosyal Bilgiler • Dünya Ailesi</span><span><span id="st">Giriş</span> &nbsp;<span class="sc">★ <span id="sc">0</span></span></span></div>
<div class="rail"><div id="pf"></div></div><div id="app"></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyCJVu7_rkU4BY1WOj2i2WWhWpDQhw22CqDR1prGPAg0gNyZd3lfw5kagA-3qQinoBZbA/exec";

// URL'den kodu yakala (?tasokul veya ?kod=tasokul). Kod yoksa quiz genel modda çalışır, sonuç kaydedilmez.
const URL_KOD=(function(){
  const p=new URLSearchParams(location.search);
  let k=(p.get('kod')||'').trim();
  if(!k){for(const key of p.keys()){if(key!=='kod'){k=key.trim();break}}}
  return k;
})();
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SORT=[["Mısır","a"],["Hindistan","s"],["Polonya","e"],["Peru","m"],["Güney Afrika","a"],["Japonya","s"],["İtalya","e"],["Meksika","m"]];
const SB=[["a","🌍 Afrika"],["s","🌏 Asya"],["e","🏰 Avrupa"],["m","🌎 Amerika"]];
const TF=[
["Mısır, Asya kıtasında yer alan bir ülkedir.",false,"Mısır Afrika kıtasındadır."],
["Dünyada 7 kıta vardır.",true,"Asya, Afrika, Avrupa, Kuzey Amerika, Güney Amerika, Avustralya ve Antarktika."],
["Farklı kültürleri Türk kültürüne benzetmek için çalışmalıyız.",false,"Farklılıklara saygı duymalı, onları olduğu gibi kabul etmeliyiz."],
["Türkiye ve Azerbaycan birbirlerini kardeş ülke olarak tanımlar.",true,"“Bir millet, iki devlet” anlayışı vardır."],
["Türkiye’nin Avrupa’daki topraklarına Trakya denir.",true,"Asya’daki topraklarımıza Anadolu denir."],
["Almanya, Türkiye’nin kara sınır komşusudur.",false,"Almanya ile kara sınırımız yoktur."],
["Suriye, en uzun kara sınırına sahip olduğumuz komşudur.",true,"En kısa kara sınırı Nahçıvan iledir."],
["Farklı ülkelerdeki insanların yaşam biçimleri aynıdır.",false,"İklim, inanç ve coğrafyaya göre yaşam biçimleri farklılaşır."],
["Tac Mahal, Hindistan’da bulunur.",true,"Dünyaca ünlü bir anıt mezardır."],
["Avustralya’nın Türkiye ile kara sınırı vardır.",false,"Avustralya’nın hiçbir ülkeyle kara sınırı yoktur."]];
const FILL=[
["Türkiye’nin Asya’daki topraklarına {} denir.","Anadolu"],
["Türkiye’nin Avrupa’daki topraklarına {} adı verilir.","Trakya"],
["Yeryüzünü oluşturan büyük kara parçalarına {} denir.","Kıta"],
["Ulaşım ve iletişimle toplumların birbirine yakınlaşmasına {} denir.","Küreselleşme"],
["Mısır’ın başkenti {} şehridir.","Kahire"],
["Kore mutfağında pirinç ve {} önemli yer tutar.","deniz ürünleri"],
["Türkiye komşularıyla ilişkilerini öncelikle {} temeline dayandırır.","barış"],
["Azerbaycan’ın başkenti {} şehridir.","Bakü"],
["Japonya’nın geleneksel boydan ipek giysisine {} denir.","Kimono"],
["Keloğlan, Kazakistan’da {} adıyla yaşatılır.","Taşza Bala"]];
const BANK=["Anadolu", "Trakya", "Kıta", "Küreselleşme", "Kahire", "deniz ürünleri", "barış", "Bakü", "Kimono", "Taşza Bala", "Hanbok", "Astana", "Keçel Memed"];
const MCQ=[
["Aşağıdaki ülkelerden hangisi Türkiye’nin kara sınır komşusudur?","İran",["Almanya", "Mısır", "Avustralya"],"İran doğu komşumuzdur."],
["Dünyanın küçülmesini, bilgi ve kültürün hızla yayılmasını ifade eden kavram hangisidir?","Küreselleşme",["Kentleşme", "Göç", "Erozyon"],"Ulaşım ve iletişim teknolojileri toplumları yakınlaştırır."],
["Aşağıdakilerden hangisi Türkiye’nin batı komşularından biridir?","Bulgaristan",["Gürcistan", "İran", "Irak"],"Bulgaristan ve Yunanistan batı komşularımızdır."],
["Tac Mahal ve Ganj Nehri hangi ülkededir?","Hindistan",["Mısır", "Peru", "Meksika"],"Hindistan, Güney Asya’dadır."],
["Ülkesine hayat veren Nil Nehri ve piramitleriyle ünlü ülke hangisidir?","Mısır",["Peru", "Polonya", "Avustralya"],"Mısır Afrika’dadır."],
["Türkiye’nin en uzun kara sınırına sahip olduğu komşusu hangisidir?","Suriye",["Bulgaristan", "Gürcistan", "Ermenistan"],"En kısa sınır Nahçıvan iledir."],
["“Bir millet, iki devlet” anlayışıyla en yakın ilişkiye sahip olduğumuz ülke hangisidir?","Azerbaycan",["Gürcistan", "Polonya", "Peru"],"Ortak dil, tarih ve kültür bağımız vardır."],
["Güney Afrika’ya “Gökkuşağı Ulusu” denmesinin nedeni nedir?","Farklı toplulukların barış içinde yaşaması",["Çok yağmur yağması", "Çok göl bulunması", "Nüfusunun az olması"],"Farklılıklar bir arada yaşar."],
["Bosna Ahitnamesi neyin tarihî kanıtıdır?","Türk milletinin farklı inanç ve kültürlere saygısının",["Ticaret anlaşmasının", "Sınır antlaşmasının", "Vergi düzeninin"],"Fatih Sultan Mehmet 1463’te ibadet özgürlüğü tanımıştır."],
["Farklı kültürlere karşı en doğru tutum hangisidir?","Farklılıklara saygı duyup olduğu gibi kabul etmek",["Kendi kültürüne benzetmeye çalışmak", "Alay etmek", "Görmezden gelmek"],"Kültürel çeşitlilik zenginliktir."]];
const ORD=[
["Kuzeyden güneye",["Polonya", "Mısır", "Avustralya"]],
["Türkiye’nin komşuları (batıdan doğuya)",["Bulgaristan", "Gürcistan", "İran"]],
["Küreselleşme süreci",["Ulaşım ve iletişim teknolojileri gelişir", "Ülkeler birbirine yakınlaşır", "Bilgi ve kültür dünyaya hızla yayılır"]]];
const MAX=[16,20,20,20,24],NM=["Kıtalar ve Ülkeler","Doğru / Yanlış","Kelime Sandığı","Çoktan Seçmeli","Sıralama"];
let sec=-1,score=0,me={},sc=[],W=[],rev=null,sent=0;
const S={p:{},s:null,items:sh(SORT.map((x,i)=>({i,t:x[0],c:x[1]})))};
const T={a:{},items:sh(TF.map((x,i)=>({i,t:x[0],v:x[1],e:x[2]})))};
const F={p:{},s:null,items:sh(FILL.map((x,i)=>({i,t:x[0],r:x[1]}))),bank:sh(BANK)};
const M={i:0,a:{},rows:[],qs:MCQ.map(q=>({q:q[0],r:q[1],o:sh([q[1],...q[2]]),e:q[3]}))};
const O={i:0,rows:[],e:0,st:ORD.map(s=>{let o=sh(s[1].map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();return{t:s[0],it:s[1],o}})};
const bar=(m,on,fn,l="Bölümü Tamamla →")=>`<div class="bar"><b>${m}</b><button class="nx" ${on?"":"disabled"} onclick="${fn}">${l}</button></div>`;
const esc=s=>String(s).replace(/</g,"&lt;");

function R(top){const y=scrollY;$("#sc").textContent=score;$("#st").textContent=sec<0?"Giriş":sec<5?`Bölüm ${sec+1} / 5`:"Sonuç";$("#pf").style.width=Math.max(0,sec)*20+"%";
$("#app").innerHTML=rev?revH():[startH,sortH,tfH,fillH,mcqH,ordH,endH][sec+1]();scrollTo(0,top?0:y);if(sec==5&&!rev&&!sent){sent=1;send()}}
function fin(rows,e){score+=e;sc[sec]=e;rows.forEach(r=>{if(!r.ok)W.push(r)});rev={rows,e};R(1)}
function go(){rev=null;sec++;R(1)}
function revH(){return `<h2>Bölüm ${sec+1} sonucu: +${rev.e} / ${MAX[sec]} puan</h2><p class="d">Yanlışlarını incele, doğrusunu öğren.</p>${rev.rows.map(r=>`<div class="rv ${r.ok?"ok":"bad"}">${r.ok?"✓":"✗"} ${r.t}${r.ok?"":`<div class="note">${r.n}</div>`}</div>`).join("")}${bar("",1,"go()",sec==4?"Sonucu Gör 🏁":"Sonraki Bölüm →")}`}

function startH(){return `<h2>Dünya Ailesi Keşif Quizi</h2><p class="d">Önce 7. ünite konularını tekrar et, sonra quizi çöz. Toplam 100 puan.</p><input id="ia" placeholder="Ad Soyad"><input id="is" placeholder="Sınıf (örn. 4/A)"><input id="in" placeholder="Okul numarası (bilmiyorsan boş bırak)">${bar("",1,"st0()","Başla →")}`}
function st0(){const a=$("#ia").value.trim(),s=$("#is").value.trim();if(!a||!s){alert("Ad soyad ve sınıfı yaz.");return}me={a,s,n:$("#in").value.trim()||"-",k:URL_KOD};sec=0;R(1)}

function sortH(){const un=S.items.filter(x=>!S.p[x.i]),bk=c=>S.items.filter(x=>S.p[x.i]==c).map(x=>`<span class="chip">${x.t} <b onclick="event.stopPropagation();delete S.p[${x.i}];R()">×</b></span>`).join("")||"<small>Buraya dokun</small>";
return `<h2>Bölüm 1: Ülke Hangi Kıtada?</h2><p class="d">Bir ülke seç, sonra doğru sepete dokun.</p><div class="pool">${un.map(x=>`<div class="pill ${S.s===x.i?"on":""}" onclick="S.s=${x.i};R()">${x.t}</div>`).join("")||"✓ Hepsi yerleşti"}</div><div class="g2">${SB.map(b=>`<div class="bk" onclick="drop('${b[0]}')"><h3>${b[1]}</h3>${bk(b[0])}</div>`).join("")}</div>${bar(`Kalan: ${un.length}`,!un.length,"doneS()")}`}
function drop(c){if(S.s==null)return;S.p[S.s]=c;S.s=null;R()}
function doneS(){const rows=S.items.map(x=>({ok:S.p[x.i]==x.c,t:x.t,n:`Doğrusu: ${SB.find(b=>b[0]==x.c)[1]}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function tfH(){const n=Object.keys(T.a).length;return `<h2>Bölüm 2: Doğru mu, Yanlış mı?</h2><p class="d">10 önermeyi işaretle.</p>${T.items.map(x=>`<div class="row"><span>${x.t}</span><span style="display:flex;gap:8px"><button class="b2 ${T.a[x.i]===true?"t":""}" onclick="T.a[${x.i}]=true;R()">✓ DOĞRU</button><button class="b2 ${T.a[x.i]===false?"f":""}" onclick="T.a[${x.i}]=false;R()">✕ YANLIŞ</button></span></div>`).join("")}${bar(`Cevaplanan: ${n} / 10`,n==10,"doneT()")}`}
function doneT(){const rows=T.items.map(x=>({ok:T.a[x.i]===x.v,t:x.t,n:`Senin cevabın: ${T.a[x.i]?"Doğru":"Yanlış"}. Doğrusu: <b>${x.v?"Doğru":"Yanlış"}</b>. ${x.e}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function fillH(){const u=Object.values(F.p),n=u.length;return `<h2>Bölüm 3: Kelime Sandığı</h2><p class="d">Bir kelime seç, sonra boşluğa dokun. Dolu boşluğa dokunursan kelime geri alınır.</p>${F.items.map(x=>`<div class="row" style="display:block;line-height:2.1">${x.t.replace("{}",`<span class="slot" onclick="setSlot(${x.i})">${F.p[x.i]||"dokun"}</span>`)}</div>`).join("")}<div class="bank">${F.bank.map(w=>`<div class="w ${F.s===w?"on":""} ${u.includes(w)?"pl":""}" onclick="pickW(${F.bank.indexOf(w)})">${w}</div>`).join("")}</div>${bar(`Doldurulan: ${n} / 10`,n==10,"doneF()")}`}
function pickW(k){const w=F.bank[k];F.s=F.s===w?null:w;R()}
function setSlot(i){if(F.s){F.p[i]=F.s;F.s=null}else delete F.p[i];R()}
function doneF(){const rows=F.items.map(x=>({ok:F.p[x.i]==x.r,t:x.t.replace("{}",`<u>${F.p[x.i]}</u>`),n:`Doğrusu: <b>${x.r}</b>`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function mcqH(){const q=M.qs[M.i],a=M.a[M.i],l=M.i==M.qs.length-1;return `<h2>Bölüm 4: Çoktan Seçmeli</h2><p class="d">Soru ${M.i+1} / ${M.qs.length}</p><p style="font-weight:700;margin-bottom:12px">${q.q}</p>${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" onclick="M.a[M.i]=${i};R()">${"ABCD"[i]}) ${o}</button>`).join("")}${bar(a===undefined?"Bir seçenek işaretle":"Seçim yapıldı",a!==undefined,"nextM()",l?"Bölümü Bitir →":"Sonraki Soru →")}`}
function nextM(){const q=M.qs[M.i],y=q.o[M.a[M.i]];M.rows.push({ok:y==q.r,t:q.q,n:`Senin cevabın: ${y}<br>Doğru cevap: <b>${q.r}</b><br>${q.e}`});if(M.i<M.qs.length-1){M.i++;R(1)}else fin(M.rows,M.rows.filter(r=>r.ok).length*2)}

function ordH(){const s=O.st[O.i];return `<h2>Bölüm 5: Sıralama</h2><p class="d">${s.t} (${O.i+1} / 3) — okları kullanarak doğru sıraya diz.</p>${s.o.map((v,k)=>`<div class="row"><span>${s.it[v]}</span><span style="display:flex;gap:6px"><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button><button class="b2" ${k<2?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")}${bar("",1,"okO()",O.i<2?"Sırayı Onayla →":"Quizi Bitir 🏁")}`}
function mv(k,d){const o=O.st[O.i].o;[o[k],o[k+d]]=[o[k+d],o[k]];R()}
function okO(){const s=O.st[O.i],ok=s.o.every((v,k)=>v==k);O.rows.push({ok,t:s.t,n:"Doğru sıra: "+s.it.map((x,k)=>`${k+1}) ${x}`).join(" → ")});if(ok)O.e+=8;if(O.i<2){O.i++;R(1)}else fin(O.rows,O.e)}

function endH(){const t=score>=85?["🎖️","Altın Rozetli Dünya Vatandaşı"]:score>=65?["🧭","Dünya Gezgini"]:["🌱","Genç Kâşif"];
return `<div style="text-align:center"><div style="font-size:3.5rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${esc(me.a)} • ${esc(me.s)}</p><div class="big">${score} / 100</div></div>
<h3 style="margin:14px 0 8px">Bölüm puanların</h3>${NM.map((n,i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${sc[i]} / ${MAX[i]}</b></div>`).join("")}
<h3 style="margin:14px 0 8px">Tekrar etmen gerekenler (${W.length})</h3>${W.length?W.map(r=>`<div class="rv bad">${r.t}<div class="note">${r.n}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
<p id="msg" class="note" style="margin:12px 0;display:none;font-weight:700"></p>${bar("",1,"location.reload()","Yeniden Başla")}`}
async function send(){
  if(!me.k||!SCRIPT_URL)return;
  const m=$("#msg");
  if(m){m.style.display="block";m.style.color="#64748b";m.textContent="⏳ Sonuçların öğretmenine gönderiliyor…"}
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({kod:me.k,okulKodu:me.k,oyun:"4. Sınıf 7. Ünite Quizi",ad:me.a,sinif:me.s,no:me.n,puan:score,b:sc,yanlis:W.length,liste:W.map(r=>r.t.replace(/<[^>]+>/g,"")).join(" | ").slice(0,1500)})});
    if(m){m.style.color="#059669";m.textContent="✓ Sonucun öğretmenine gönderildi!"}
  }catch(e){
    if(m){m.style.color="#dc2626";m.textContent="⚠️ Sonuç gönderilemedi. İnternet bağlantını kontrol et."}
  }
}
R();
</script></body></html>
