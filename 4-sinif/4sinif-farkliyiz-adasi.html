<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farklıyız Adası | 4. Sınıf Sosyal Bilgiler Oyunu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>:root{--bg:#d9f1fb;--panel:#fff;--soft:#f1f9fe;--line:#a9d6ea;--ink:#16303d;--a:#f08a1c;--b:#2f9e57;--c:#6a5cf0;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Nunito',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--c);outline-offset:2px}
h1,h2,h3,.brand{font-family:'Fredoka','Nunito',sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:600;font-size:1.15rem}.hud{display:flex;gap:10px;align-items:center;font-weight:800}
.bar{width:90px;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--b);transition:width .5s}
main{max-width:980px;margin:0 auto;padding:14px}
.hero h1{margin:6px 0 0;font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.1}.hero p{max-width:60ch;margin:8px 0 14px}
.mapbox{position:relative;aspect-ratio:5/3;border-radius:24px;overflow:hidden;background:#bfe6f5;border:4px solid var(--line);box-shadow:0 8px 0 var(--line)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:var(--a);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .2s;padding:0}
.pin span{font-size:26px;line-height:1}.pin:hover{transform:translate(-50%,-50%) scale(1.12)}
.pin.done{background:var(--b)}.pin.next{animation:pulse 1.7s infinite}
.pin small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font-weight:800;font-size:12px;background:var(--panel);padding:1px 9px;border-radius:10px;border:2px solid var(--line)}
@keyframes pulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 0 12px rgba(255,255,255,.5)}}
@media(max-width:620px){.pin{width:42px;height:42px}.pin span{font-size:20px}.pin small{display:none}.bar{width:60px}}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:18px}
.lg{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel);border:2px solid var(--line);width:100%}
.lg .e{font-size:28px}.lg small{display:block;opacity:.75}.lg .stars{margin-left:auto;color:var(--a);font-size:1rem}.lg.done{border-color:var(--b)}
.finale{margin:20px 0;padding:22px;border-radius:24px;background:var(--panel);border:3px solid var(--b);text-align:center}
.finale input{width:100%;max-width:340px;padding:11px;margin:4px;border:2.5px solid var(--line);border-radius:12px;font:inherit}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.62);display:grid;place-items:end center;z-index:20}.modal[hidden]{display:none}
.sheet{background:var(--panel);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px 28px}
@media(min-width:780px){.modal{place-items:center;padding:20px}.sheet{border-radius:26px}}
.head{display:flex;gap:12px;align-items:center}.head .e{font-size:42px}.head h2{margin:0;font-size:1.5rem;line-height:1.1}.head small{opacity:.75}
.x{margin-left:auto;background:none;border:0;font-size:1.5rem;padding:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.card{background:var(--soft);border:2.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:96px}
.card .e{font-size:30px;display:block}.card b{display:block}.card p{display:none;margin:6px 0 0;font-size:.95rem}
.card.on p{display:block}.card.on{border-color:var(--b);background:var(--panel)}
.card:not(.on)::after{content:'Dokun ve öğren 👆';display:block;font-size:.8rem;opacity:.65;margin-top:4px}
.btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:13px 24px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3);margin-top:8px}.btn:disabled{opacity:.45}
.q{font-weight:800;font-size:1.1rem;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ch{background:var(--soft);border:2.5px solid var(--line);border-radius:99px;padding:9px 16px;font-weight:800}.ch.on{background:var(--c);color:#fff;border-color:var(--c)}.ch.ok{background:#d1fae5;border-color:var(--b);opacity:.7;pointer-events:none}.ch.no{background:#fee2e2;border-color:var(--bad)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.bin{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;background:var(--soft);text-align:left}.bin h3{margin:0 0 6px;font-size:1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols .ch{border-radius:14px;width:100%;margin-bottom:8px;text-align:left}
.fb{min-height:28px;font-weight:800;margin:8px 0}.fb.g{color:var(--b)}.fb.r{color:var(--bad)}
.stars{font-size:2rem;color:var(--a)}
.res{text-align:center}.res .e{font-size:4rem}
</style></head><body>
<div class="top"><div class="brand">🏝️ Farklıyız Adası</div><div class="hud"><div class="bar"><i id="pb"></i></div><span>⭐ <span id="ts">0</span> / 15</span></div></div>
<main>
<div class="hero"><h1>Farklıyız Adası'nı keşfet!</h1><p>Adadaki 5 durağı gez, bilgileri öğren ve görevleri tamamla. Her görevde yıldız kazan. Hadi başlayalım! 🚀</p></div>
<div class="mapbox"><svg viewBox="0 0 100 60" aria-hidden="true"><ellipse cx="50" cy="31" rx="46" ry="25" fill="#bfe58f" stroke="#8cc65e" stroke-width="1.2"/><polyline id="path" fill="none" stroke="#fff" stroke-width="1.3" stroke-dasharray="2.5 2.5" stroke-linecap="round"/></svg><div id="pins"></div></div>
<div class="legend" id="legend"></div><div id="fin"></div>
</main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz5UFkeyHjo5BSG8fJBQK1QxEADZQFx1kH6YmovVp15cb8zfE6SKhxCYC8Rs6xIJsk6/exec"; // Google Apps Script adresini buraya yapıştır
const KEY="sbk4-oyun-1",OYUN="4. Sınıf 1. Ünite Oyunu";
const LINK_KOD=(function(){const p=new URLSearchParams(location.search);let k=(p.get('kod')||'').trim();if(!k){for(const x of p.keys()){if(x!=='kod'){k=x.trim();break}}}return k})();
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const ST=[
{n:"Kimlik Ofisi",e:"🪪",x:12,y:68,sub:"Kimliğim",intro:"Kimlik Ofisi'ne hoş geldin! Burada kimlik belgelerini tanıyacağız.",
c:[["🇹🇷","Resmî kimlik","Kimlik kartı, ehliyet ve pasaport resmî kimlik belgeleridir. En önemlisi T.C. kimlik kartımızdır."],["📚","Özel kimlik","Kütüphane kartı ve spor kulübü kartı gibi belgeler özel kimlik belgeleridir."],["🔢","Kimlik kartında ne var?","11 haneli kimlik numarası, ad, soyad, doğum tarihi ve fotoğraf. Numara herkese özeldir."],["🎒","Öğrenci kimliği","Adımız, sınıfımız ve okul numaramız yazar. Okulun öğrencisi olduğumuzu gösterir."]],
t:[{k:"sort",q:"Resmî mi, özel mi?",bins:[["Resmî","🇹🇷"],["Özel","📚"]],items:[["T.C. kimlik kartı",0],["Ehliyet",0],["Pasaport",0],["Kütüphane kartı",1],["Spor kulübü kartı",1]]},
{k:"match",q:"Belgeyi kullanıldığı yerle eşleştir.",pairs:[["Öğrenci kimliği","Okula girerken"],["Sürücü belgesi","Araç kullanırken"],["Meslek kartı","İş yerine girerken"],["Üye kartı","Kulüp etkinliğinde"]]}],
r:["Kimlik Ustası","Kimlik belgelerimiz bizi tanıtır. Okula kayıtta kimliğini yanına almayı unutma!"]},

{n:"Anı Albümü",e:"📸",x:31,y:26,sub:"Yaşam öykümüz",intro:"Her insanın bir yaşam öyküsü vardır. Albümü açalım!",
c:[["👶","Önemli olaylar","Doğum, ilk söz söyleme, yürümeye başlama ve okula başlama yaşam öyküsünün önemli olaylarıdır."],["🎂","Başka önemli günler","İlk arkadaşlık, ilk gezi, ilk karne, ilk evcil hayvan, ilk diş…"],["⏳","Kronolojik sıralama","Olayları oluş sırasına göre sıralamaya kronolojik sıralama denir."],["🌱","Büyüdükçe","Büyüdükçe daha bağımsız oluruz, kendimizi daha iyi ifade ederiz ve sorumluluk alırız."]],
t:[{k:"order",q:"Yasemin'in yaşam öyküsünü sırayla dokun: önce olan olay en başta.",items:["2012: Doğdu","2013: Yürümeye başladı","2018: Okula başladı"]},
{k:"order",q:"Kimlik belgesi zaman çizelgesi: eskiden yeniye dokun.",items:["1926: Nüfus cüzdanı (defter)","1976: Nüfus cüzdanı (kart)","2016: Elektronik kimlik kartı"]},
{k:"mcq",q:"Olayları oluş sırasına göre dizmeye ne denir?",a:"Kronolojik sıralama",w:["Rastgele sıralama","Boyuna göre sıralama"]}],
r:["Zaman Yolcusu","Kronolojik sıralama olayları daha iyi anlamamıza yardım eder."]},

{n:"Yetenek Sahnesi",e:"🎭",x:52,y:62,sub:"İlgi, ihtiyaç ve yetenek",intro:"Sahnede herkesin bir ilgisi, bir yeteneği var. Seninki ne?",
c:[["🍞","İhtiyaçlar","Barınma, beslenme ve giyinme herkesin temel ihtiyacıdır. Bunlar benzerdir."],["🎨","İlgi ve yetenek","Kimimiz müzikte, kimimiz resimde, kimimiz sporda yeteneklidir. Bunlar farklı olabilir."],["♟️","Hobi","Boş zamanda keyifle yaptığımız uğraşlara hobi denir: halk oyunu, satranç, yüzme…"],["🏅","Etkinlikler","İlgimize uygun etkinliklere katılınca yeteneğimizi geliştirir, yeni arkadaşlar ediniriz."]],
t:[{k:"sort",q:"Temel ihtiyaç mı, ilgi mi?",bins:[["Temel ihtiyaç","🍞"],["İlgi / hobi","🎮"]],items:[["Barınma",0],["Beslenme",0],["Giyinme",0],["Satranç oynamak",1],["Macera filmi izlemek",1],["Resim yapmak",1]]},
{k:"match",q:"Yeteneği etkinlikle eşleştir.",pairs:[["Müzik","Gitar çalmak"],["Spor","Basketbol oynamak"],["Resim","Tablo yapmak"],["Dans","Halk oyunu oynamak"]]},
{k:"mcq",q:"Elif veteriner olmak istiyor çünkü hayvanları çok seviyor. Mesleğini neye göre seçti?",a:"İlgisine göre",w:["Boyuna göre","Saç rengine göre"]}],
r:["Yetenek Yıldızı","İnsanlar mesleklerini ilgi ve yeteneklerine göre seçer."]},

{n:"Farklılıklar Bahçesi",e:"🌷",x:71,y:24,sub:"Bireyler arası farklılıklar",intro:"Bahçedeki çiçekler gibi biz de birbirimizden farklıyız. Bu çok güzel!",
c:[["👀","Fiziksel özellikler","Boy, saç rengi, göz rengi gibi özellikler ilk bakışta görünür. Büyüdükçe değişebilir."],["💬","Kişilik özellikleri","Emre konuşkandır, Cenk dinlemeyi sever. Herkesin kişiliği farklıdır."],["🤝","Empati","Kendimizi karşımızdakinin yerine koymaya empati denir."],["💛","Destek olalım","Yaşlılara, engellilere, yoksullara ve hastalara destek oluruz. Onları güçlendiren destekler önemlidir."]],
t:[{k:"sort",q:"Fiziksel özellik mi, kişilik özelliği mi?",bins:[["Fiziksel","👀"],["Kişilik","💛"]],items:[["Boy uzunluğu",0],["Göz rengi",0],["Parmak izi",0],["Sakin olmak",1],["Konuşkan olmak",1],["Paylaşımcı olmak",1]]},
{k:"match",q:"Kime nasıl destek olabiliriz?",pairs:[["Görme engelli kişi","Karşıdan karşıya geçirmek"],["Yaşlı komşu","Alışveriş çantasını taşımak"],["Yoksul aile","Kaynaklarımızı paylaşmak"],["Ağır hasta komşu","Yemek götürmek"]]},
{k:"mcq",q:"Yaşlı komşusunun alışveriş çantasını taşıyan çocuk neyi yapmıştır?",a:"Empati kurup yardım etmiştir",w:["Yarışmıştır","Oyun oynamıştır"]}],
r:["Empati Kahramanı","Farklılıklarımız bir zenginliktir; empati kurarak birbirimizi anlarız."]},

{n:"Saygı Köprüsü",e:"🌉",x:88,y:62,sub:"Saygılıyız",intro:"Köprüden geçmek için saygıyı iyi bilmen gerek!",
c:[["🙏","Saygı","Farklılıklarımız arkadaş olmamıza engel değildir. Birbirimize saygı duyarsak iletişimimiz güzelleşir."],["🐆","Leopar Lily","Lily'nin benekleri pembeydi. Diğer leoparlar ona güldü, Lily üzüldü. Sonunda onu kabul eden arkadaşlar buldu."],["🗳️","Demokratik Yaşam","Farklı fikirler özgürce söylenir ve saygı görür. Sınıf başkanı seçimi demokratik yaşama güzel bir örnektir."],["👂","Doğru iletişim","Karşımızdakini anlamaya çalışır ve saygıyla dinleriz."]],
t:[{k:"sort",q:"Saygılı davranış mı, saygısız davranış mı?",bins:[["Saygılı","🙏"],["Saygısız","🚫"]],items:[["Arkadaşını dinlemek",0],["Farklı fikre saygı duymak",0],["Dışlanan arkadaşa el uzatmak",0],["Birinin görünüşüyle alay etmek",1],["Arkadaşını yok saymak",1],["Söz kesmek",1]]},
{k:"mcq",q:"Sınıf başkanı seçiminde herkesin oyunu özgürce kullanması ve fikrini söylemesi neyin göstergesidir?",a:"Demokratik yaşam kültürünün",w:["Sadece bir yarışmanın","Sıradan bir oyunun"]},
{k:"mcq",q:"Lily'ye diğer leoparlar güldüğünde Lily ne hissetti?",a:"Üzüldü",w:["Çok sevindi","Hiçbir şey hissetmedi"]}],
r:["Saygı Elçisi","Farklı da olsak hepimiz arkadaşız. Saygı en güzel köprüdür!"]}
];

let S={done:[],miss:0,me:null,sent:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const total=()=>ST.reduce((a,_,i)=>a+(S.done[i]||0),0);
let cur,Tk,sendState=0; // 0 bekliyor, 1 gönderiliyor, 2 başarısız

function render(){
  const nx=ST.findIndex((_,i)=>!S.done[i]);
  $('#path').setAttribute('points',ST.map(s=>s.x+','+(s.y*.6)).join(' '));
  $('#pins').innerHTML=ST.map((s,i)=>`<button class="pin ${S.done[i]?'done':i==nx?'next':''}" style="left:${s.x}%;top:${s.y}%" onclick="openS(${i})" aria-label="${s.n}"><span>${S.done[i]?'✅':s.e}</span><small>${s.n}</small></button>`).join('');
  $('#legend').innerHTML=ST.map((s,i)=>`<button class="lg ${S.done[i]?'done':''}" onclick="openS(${i})"><span class="e">${s.e}</span><span><b>${s.n}</b><small>${s.sub}</small></span><span class="stars">${S.done[i]?'★'.repeat(S.done[i]):''}</span></button>`).join('');
  $('#ts').textContent=total();$('#pb').style.width=total()/15*100+'%';
  const all=ST.every((_,i)=>S.done[i]);
  $('#fin').innerHTML=all?finH():'';
  if(all){finBind();if(LINK_KOD&&SCRIPT_URL&&S.me&&!S.sent&&sendState==0){sendState=1;autoSend()}}
}
function finH(){
  const t=total(),p=Math.round(t/15*100),b=p>=85?['🏆','Farklıyız Adası Kahramanı']:p>=60?['🌟','Ada Kâşifi']:['🌱','Genç Kâşif'];
  return `<div class="finale"><div style="font-size:3.5rem">${b[0]}</div><h2>${b[1]}</h2><p><b>${t} / 15 yıldız</b> topladın. Farklıyız ama hepimiz arkadaşız! 💛</p>
  ${LINK_KOD&&SCRIPT_URL&&!S.sent&&(sendState==2||!S.me)?`<p>Sonucun öğretmenine gitsin:</p><input id="na" placeholder="Ad Soyad" value="${S.me?S.me.a:''}"><br><input id="ns" placeholder="Sınıf (örn. 4-A)" value="${S.me?S.me.s:''}"><br><input id="nn" placeholder="Okul no (boş bırakabilirsin)" value="${S.me&&S.me.n!='-'?S.me.n:''}"><br><button class="btn" id="snd">Sonucu Gönder 📨</button>`:''}
  <p id="msg" class="fb">${S.sent?'✓ Sonuçların öğretmenine gönderildi.':''}</p><button class="btn" onclick="resetG()">Baştan Oyna 🔄</button></div>`;
}
function finBind(){const b=$('#snd');if(b)b.onclick=sendRes}
function resetG(){S={done:[],miss:0,me:S.me,sent:0};sendState=0;save();render();scrollTo(0,0)}
function payload(){const st=ST.map((_,i)=>S.done[i]||0);return JSON.stringify({kod:LINK_KOD,okulKodu:LINK_KOD,oyun:OYUN,ad:S.me.a,sinif:S.me.s,no:S.me.n,puan:Math.round(total()/15*100),b:st,yanlis:S.miss,liste:ST.map((s,i)=>s.n+': '+st[i]+'★').join(' | ')})}
async function post(){await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload()});S.sent=1;sendState=0;save()}
async function autoSend(){
  const m=$('#msg');if(m){m.className='fb';m.textContent='⏳ Sonuç öğretmenine gönderiliyor…'}
  try{await post();const k=$('#msg');if(k){k.className='fb g';k.textContent='✓ Sonuçların öğretmenine gönderildi.'}}
  catch(e){sendState=2;render();const k=$('#msg');if(k){k.className='fb r';k.textContent='⚠️ Gönderilemedi. İnternetini kontrol edip tekrar dene.'}}
}
async function sendRes(){
  const a=$('#na').value.trim(),s=$('#ns').value.trim(),m=$('#msg');
  if(!a||!s){m.className='fb r';m.textContent='Ad soyad ve sınıfı yaz.';return}
  S.me={a,s,n:$('#nn').value.trim()||'-'};
  m.className='fb';m.textContent='⏳ Gönderiliyor…';sendState=1;
  try{await post();m.className='fb g';m.textContent='✓ Sonuçların öğretmenine gönderildi.'}
  catch(e){sendState=2;m.className='fb r';m.textContent='⚠️ Gönderilemedi. İnternetini kontrol edip tekrar dene.'}
}
function askName(){
  if(!(LINK_KOD&&SCRIPT_URL)||S.me)return;
  const st='width:100%;max-width:340px;padding:11px;margin:4px;border:2.5px solid var(--line);border-radius:12px;font:inherit';
  const d=document.createElement('div');d.className='modal';d.id='nm';
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" style="text-align:center"><h2>Hoş geldin! 🏝️</h2><p>Sonucun öğretmenine gidecek. Adını ve sınıfını yaz.</p><input id="ma" placeholder="Ad Soyad" style="${st}"><br><input id="ms" placeholder="Sınıf (örn. 4-A)" style="${st}"><br><input id="mn" placeholder="Okul no (boş bırakabilirsin)" style="${st}"><br><button class="btn" id="mgo">Başla 🚀</button><p id="mm" class="fb"></p></div>`;
  document.body.appendChild(d);
  $('#mgo').onclick=()=>{const a=$('#ma').value.trim(),c=$('#ms').value.trim(),m=$('#mm');if(!a||!c){m.className='fb r';m.textContent='Ad soyad ve sınıfı yaz.';return}S.me={a,s:c,n:$('#mn').value.trim()||'-'};save();d.remove();render()};
}
function openS(i){cur={i,p:0,m:0,o:{}};$('#modal').hidden=false;view()}
function closeM(){$('#modal').hidden=true;render()}
function initT(){
  const t=ST[cur.i].t[cur.p-1];
  Tk={fb:'',ok:'',sel:null,pl:{},dn:{},seq:[],bad:{},items:sh((t.items||t.pairs||[]).map((_,i)=>i))};
  if(t.k=='mcq')Tk.opts=sh([t.a,...t.w]);
}
function chk(){if(Object.keys(cur.o).length==ST[cur.i].c.length)$('#go').disabled=false}
function wrong(m){cur.m++;Tk.fb=m;Tk.ok='r'}
function right(m){Tk.fb=m;Tk.ok='g'}
function view(){
  const s=ST[cur.i];let h=`<div class="head"><span class="e">${s.e}</span><div><h2>${s.n}</h2><small>${s.sub}</small></div><button class="x" onclick="closeM()" aria-label="Kapat">✕</button></div>`;
  if(cur.p==0){
    h+=`<p>${s.intro}</p><div class="cards">${s.c.map((c,k)=>`<button class="card" onclick="this.classList.add('on');cur.o[${k}]=1;chk()"><span class="e">${c[0]}</span><b>${c[1]}</b><p>${c[2]}</p></button>`).join('')}</div><button class="btn" id="go" disabled onclick="cur.p=1;initT();view()">Göreve geç →</button>`;
  }else if(cur.p<=s.t.length){
    const t=s.t[cur.p-1];let done=false;
    h+=`<p class="q">Görev ${cur.p} / ${s.t.length}: ${t.q}</p>`;
    if(t.k=='sort'){
      const un=Tk.items.filter(i=>Tk.pl[i]===undefined);done=!un.length;
      h+=`<div class="chips">${un.map(i=>`<button class="ch ${Tk.sel===i?'on':''}" onclick="Tk.sel=${i};view()">${t.items[i][0]}</button>`).join('')||'✓ Hepsi yerleşti'}</div><div class="bins">${t.bins.map((b,k)=>`<div class="bin" onclick="sortDrop(${k})"><h3>${b[1]} ${b[0]}</h3>${Object.keys(Tk.pl).filter(i=>Tk.pl[i]==k).map(i=>`<span class="ch ok" style="display:inline-block;margin:2px">${t.items[i][0]}</span>`).join('')||'<small>Buraya dokun</small>'}</div>`).join('')}</div>`;
    }else if(t.k=='match'){
      done=Object.keys(Tk.dn).length==t.pairs.length;
      h+=`<div class="cols"><div>${t.pairs.map((p,i)=>`<button class="ch ${Tk.dn[i]?'ok':Tk.sel===i?'on':''}" onclick="Tk.sel=${i};view()">${p[0]}</button>`).join('')}</div><div>${Tk.items.map(j=>`<button class="ch ${Tk.dn[j]?'ok':''}" onclick="matchR(${j})">${t.pairs[j][1]}</button>`).join('')}</div></div>`;
    }else if(t.k=='mcq'){
      done=!!Tk.good;
      h+=Tk.opts.map((o,k)=>`<button class="ch ${Tk.bad[k]?'no':''} ${Tk.good&&o==t.a?'ok':''}" style="display:block;width:100%;margin-bottom:8px;text-align:left" onclick="mcqPick(${k})">${'ABC'[k]}) ${o}</button>`).join('');
    }else{
      done=Tk.seq.length==t.items.length;
      h+=`<div class="chips" style="flex-direction:column">${Tk.items.map(i=>`<button class="ch ${Tk.seq.includes(i)?'ok':''}" onclick="ordPick(${i})">${Tk.seq.includes(i)?(Tk.seq.indexOf(i)+1)+'. ':''}${t.items[i]}</button>`).join('')}</div>`;
    }
    h+=`<div class="fb ${Tk.ok}">${Tk.fb}</div><button class="btn" ${done?'':'disabled'} onclick="cur.p++;if(cur.p<=${s.t.length})initT();else fin();view()">${cur.p<s.t.length?'Sonraki görev →':'Bitir 🏁'}</button>`;
  }else{
    const st=cur.m==0?3:cur.m<=2?2:1;
    h+=`<div class="res"><div class="e">${s.e}</div><h2>${s.r[0]}</h2><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>${s.r[1]}</p><button class="btn" onclick="closeM()">Haritaya dön 🗺️</button></div>`;
  }
  $('#sheet').innerHTML=h;
}
function fin(){const st=cur.m==0?3:cur.m<=2?2:1,pv=S.done[cur.i]||0;S.done[cur.i]=Math.max(pv,st);S.miss+=cur.m;if(st>pv)S.sent=0;save()}
function sortDrop(b){
  if(Tk.sel==null)return;const t=ST[cur.i].t[cur.p-1];
  if(t.items[Tk.sel][1]==b){Tk.pl[Tk.sel]=b;right('✅ Doğru!')}else wrong('❌ Bu sepet değil, tekrar düşün!');
  Tk.sel=null;view();
}
function matchR(j){
  if(Tk.sel==null){Tk.fb='Önce soldan birini seç 👈';Tk.ok='';view();return}
  if(Tk.sel==j){Tk.dn[j]=1;right('✅ Eşleşti!')}else wrong('❌ Eşleşmedi, tekrar dene!');
  Tk.sel=null;view();
}
function mcqPick(k){
  const t=ST[cur.i].t[cur.p-1];if(Tk.good)return;
  if(Tk.opts[k]==t.a){Tk.good=1;right('✅ Süper!')}else{Tk.bad[k]=1;wrong('❌ Bir daha dene!')}
  view();
}
function ordPick(i){
  if(Tk.seq.includes(i))return;
  if(i==Tk.seq.length){Tk.seq.push(i);right('✅ Doğru sıra!')}else wrong('❌ Önce olan olay hangisi? Tekrar dene!');
  view();
}
render();askName();
</script></body></html>
