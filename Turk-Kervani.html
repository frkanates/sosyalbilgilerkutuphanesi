function fitView(full){if(full)TV={x:-110,y:-80,w:1100,h:480};else{const cs=P(ST[Math.min(S.st,ST.length-1)].n),nbp=NB[ST[Math.min(S.st,ST.length-1)].era].map(b=>Q([b[1],b[2]])).filter(q=>Math.hypot(q[0]-cs[0],q[1]-cs[1])<330),a=vis.map(i=>P(ST[i].n)).concat(S.caps.map(c=>Q(c.p)),nbp),xs=a.map(q=>q[0]),ys=a.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),A=400/260,w=Math.max(480,x1-x0+330,(y1-y0+220)*A),h=w/A;TV={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h}}
const s={...VB};let n=0;clearInterval(vt);vt=setInterval(()=>{n++;const t=Math.min(1,n/22),e=t*t*(3-2*t);for(const q in TV)VB[q]=s[q]+(TV[q]-s[q])*e;applyVB();if(t>=1)clearInterval(vt)},30)}
function drawMap(){const o=[],ce=ST[Math.min(S.st,ST.length-1)].era,fs=TV.w/36,sw=fs/3;
if(fog)o.push(`<mask id="fg"><rect x="-300" y="-300" width="1400" height="900" fill="#fff"/>${vis.map(i=>{const[x,y]=P(ST[i].n);return `<circle cx="${x}" cy="${y}" r="${ST[i].era===0?150:105}" fill="#000"/>`}).join("")}${NB[ce].map(b=>{const[x,y]=Q([b[1],b[2]]);return `<ellipse cx="${x}" cy="${y}" rx="${b[3]+10}" ry="${b[4]+10}" fill="#000"/>`}).join("")}</mask><rect x="-300" y="-300" width="1400" height="900" fill="#1e293b" fill-opacity=".62" mask="url(#fg)"/>`);
vis.forEach((i,j)=>{const s=ST[i],e=ERA[s.era],[x,y]=P(s.n),old=s.era<ce;o.push(`<circle class="${j>=vSeen?"pop":""}" cx="${x}" cy="${y}" r="${s.era===0?110:70}" fill="${e.c}" fill-opacity="${old?.1:.3}" stroke="${e.c}" stroke-opacity="${old?.3:.8}" stroke-width="2"/>`)});
vis.forEach(i=>{if(i>0){const a=P(ST[i-1].n),b=P(ST[i].n);o.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${ERA[ST[i].era].c}" stroke-width="${sw}" stroke-dasharray="${sw} ${sw*2.5}"/>`)}});
if(S.caps.length>1)o.push(`<polyline points="${S.caps.map(c=>Q(c.p).join(",")).join(" ")}" fill="none" stroke="#b91c1c" stroke-width="${sw*1.3}" stroke-linejoin="round" opacity=".85"/>`);
const T=(x,y,t,c)=>`<text x="${x}" y="${y}" font-size="${fs}" font-weight="800" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="${fs/4}" fill="${c||"#1e293b"}">${t}</text>`;
if(fog)vis.forEach(i=>{const n=ST[i].n,[x,y]=P(n),cp=S.caps.some(c=>c.n===n||(n==="Orhun Vadisi"&&c.n[0]==="Ö"));o.push(`<circle cx="${x}" cy="${y}" r="${fs/2}" fill="${ERA[ST[i].era].c}" stroke="#fff" stroke-width="${sw}"/>`+(cp?"":T(x,y-fs,n)))});
S.caps.forEach((c,j)=>{const[x,y]=Q(c.p),up=c.n==="İznik";o.push(`<g class="${j>=cSeen?"pop":""}"><text x="${x}" y="${y+fs*.5}" font-size="${fs*2}" text-anchor="middle">🏛️</text>${T(x,up?y-fs*1.5:y+fs*2.1,(j+1)+". "+c.n,"#7f1d1d")}</g>`)});
NB[ce].forEach(([n,la,lo,rx,ry])=>{const[x,y]=Q([la,lo]);o.push(`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#6b7280" fill-opacity=".12" stroke="#6b7280" stroke-opacity=".5" stroke-width="${sw*.6}" stroke-dasharray="${sw} ${sw}"/><text x="${x}" y="${y+fs*.3}" font-size="${fs*.7}" font-style="italic" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#f6ecd0" stroke-width="${fs/5}" fill="#4b5563">${n}</text>`)});
vSeen=vis.length;cSeen=S.caps.length;$("#lyr").innerHTML=o.join("")}
function moveCar(){const[x,y]=P(ST[Math.min(S.st,ST.length-1)].n);$("#car").style.transform=`translate(${x}px,${y}px) scale(${TV.w/400})`}
function mapUp(){fog=true;const g=S.st+"|"+S.caps.length;if(g!==sig){sig=g;if(!vis.includes(S.st))vis.push(S.st);fitView(false);drawMap()}moveCar()}
function endMap(){if(sig!=="end"){fog=false;sig="end";fitView(true);drawMap();moveCar()}}
// Bir durağın görevleri bitince o durakta başkent değiştiyse haritaya eklenir (cevabı önceden göstermemek için sonra).
function revealCaps(i){if(S.cd[i])return;S.cd[i]=1;const add=CAP.filter(c=>c.at===i);if(!add.length)return;S.caps.push(...add);
S.note="🏛️ Başkent yolu güncellendi: "+add.map(c=>c.n+" ("+c.d+")").join(" ve ")+". "+(i===0?"Türklerin başkenti Orta Asya'da, Orhun Vadisi'ndedir.":i<=4?"Başkentler artık Orta Asya'dan güneye ve batıya doğru kayıyor.":"Başkent Anadolu'ya ulaştı.")}
function R(top){const y=scrollY,inG=["stop","card","shop"].includes(S.ph),showMap=inG||S.ph==="end";$("#gd").textContent=S.gold;$("#hr").textContent="❤️".repeat(S.h)+"🖤".repeat(3-S.h);
$("#st").textContent=S.ph==="login"?"Giriş":S.ph==="end"?"Sonuç":"Durak "+Math.min(S.st+1,ST.length)+" / "+ST.length;
const ce=inG?ST[S.st].era:-1;$("#era").style.display=inG?"flex":"none";$("#era").innerHTML=ERA.map((e,i)=>`<span class="ec" style="${i===ce?"background:"+e.c+";color:#fff":""}">${i+1}. ${e.n}</span>`).join("");
$("#app").innerHTML={login:loginH,stop:stopH,card:cardH,shop:shopH,end:endH}[S.ph]();$("#mw").style.display=showMap?"block":"none";if(showMap){if(inG)mapUp();else endMap()}
if(S.ph==="stop"||S.ph==="shop")S.note="";
scrollTo(0,top?0:y);if(S.ph==="end"&&!S.sent){S.sent=1;stopT();send()}}
function loginH(){return `<h2>Türk Kervanı</h2><p class="d">Orta Asya'dan Anadolu'ya uzanan yolculukta kervanı sen yöneteceksin. Oyun haritasındaki sis, ilerledikçe açılacak ve Türklerin yayılışını göreceksin. 3 kalbin var; yanlış cevap ya da süre aşımı bir kalp götürür. Doğru cevap altın kazandırır, hızlı cevap ek altın verir. Pazarda altınla erzak (kalp) alabilirsin.</p><input id="ia" placeholder="Ad Soyad"><input id="in" placeholder="Okul numarası"><select id="is"><option>6-A</option><option>6-B</option><option>6-C</option></select><button class="nx" onclick="begin()">Yola Çık →</button>`}
function begin(){const a=$("#ia").value.trim();if(!a){alert("Adını ve soyadını yaz.");return}me.a=a;me.kod=me.kod||LINK_KOD;me.n=$("#in").value.trim()||"-";me.s=$("#is").value;S.t0=Date.now();S.ph="stop";R(1)}
function stopH(){const nt=S.note?`<div class="fb ok">${S.note}</div>`:"";const s=ST[S.st],e=ERA[s.era],first=S.st===0||ST[S.st-1].era!==s.era;return `${nt}${first?`<div class="fb nt"><b>${["①","②","③"][s.era]} ${e.n}</b><br>${e.t}</div>`:""}<span class="tag">Durak ${S.st+1} / ${ST.length}</span><h2>${s.n}</h2><p class="d">${s.s}</p><button class="nx" onclick="goStop()">Zorlukları Geç →</button>`}
function goStop(){S.ph="card";S.ci=0;enter()}
function enter(){const c=cur();S.res=null;if(c.y==="ord"){let o=sh(c.o.map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();S.ord=o}else S.opts=sh(c.o);startT(c.y?40:20);R(1)}
function cardH(){const c=cur(),s=ST[S.st];let h=`<span class="tag">Görev ${S.ci+1} / ${s.cs.length}${S.res?" • "+c.t:""}</span>`;
if(!S.res){h+=`<div class="tm"><div id="tb"></div></div><div class="sn">${c.s}</div>`;
if(c.y==="ord"){h+=S.ord.map((v,k)=>`<div class="row"><span>${c.o[v]}</span><span><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button> <button class="b2" ${k<c.o.length-1?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")+`<button class="nx" onclick="chk()">Sırayı Onayla</button>`}
else h+=S.opts.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join("");return h}
const r=S.res,right=c.y==="ord"?c.o.map((x,k)=>(k+1)+") "+x).join(" → "):c.o[0];
return h+`<div class="sn">${c.s}</div><div class="fb ${r.ok?"ok":"bad"}">${r.ok?"✓ Doğru! +"+(r.fast?2:1)+" 🪙"+(r.fast?" (hızlı cevap bonusu)":""):"✗ "+r.sel+". Doğrusu: <b>"+right+"</b>"}<br>${c.e}${r.ok?"":"<br>💔 Bir kalp kaybettin."}</div><button class="nx" onclick="nxt()">${S.over?"Sonucu Gör":"Devam →"}</button>`}
function pick(k){if(S.res)return;stopT();const c=cur();finish(S.opts[k]===c.o[0],S.opts[k])}
function mv(k,d){[S.ord[k],S.ord[k+d]]=[S.ord[k+d],S.ord[k]];R()}
function chk(){stopT();const c=cur();finish(S.ord.every((v,k)=>v==k),S.ord.map(v=>c.o[v]).join(" → "))}
function finish(ok,sel){if(S.res)return;const c=cur(),fast=ok&&Date.now()-S.tq<=8000;
if(ok){S.cor++;S.gold+=fast?2:1}else{S.h--;if(S.h<=0)S.over=1;S.wrong.push({k:ST[S.st].n+": "+c.t,sel,r:c.y==="ord"?c.o.join(" → "):c.o[0]})}S.res={ok,sel,fast};R()}
function nxt(){if(S.over){S.ph="end";R(1);return}S.ci++;if(S.ci>=ST[S.st].cs.length){revealCaps(S.st);if(ST[S.st].shop){S.ph="shop";R(1)}else adv()}else enter()}
function adv(){S.st++;if(S.st>=ST.length){S.ph="end"}else S.ph="stop";R(1)}
function shopH(){const can=S.gold>=3&&S.h<3;return `${S.note?`<div class="fb ok">${S.note}</div>`:""}<span class="tag">Pazar • ${ST[S.st].n}</span><h2>Erzak Pazarı</h2><p class="d">Elinde <b>${S.gold} 🪙</b> ve <b>${S.h} ❤️</b> var. 3 altına bir kalp (erzak) alabilirsin${S.h>=3?" ama kalpların zaten dolu":S.gold<3?" ama altının yetmiyor":""}.</p><button class="nx" ${can?"":"disabled"} onclick="buy()">Erzak Al (−3 🪙, +1 ❤️)</button><button class="nx g" onclick="adv()">Yola Devam →</button>`}
function buy(){if(S.gold>=3&&S.h<3){S.gold-=3;S.h++}adv()}
function endH(){const p=pt(),won=!S.over&&S.st>=ST.length,t=won?(p>=80?["🏅","Kervanbaşı"]:["🐎","Konya'ya Ulaşan Kervan"]):["🏜️","Kervan Yolda Kaldı"];
return `<div style="text-align:center"><div style="font-size:3.4rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${me.a.replace(/</g,"&lt;")} • ${me.s}${won?"":" • "+ST[Math.min(S.st,ST.length-1)].n+" durağında kaldı"}</p><div class="big">${p} / 100</div></div>
<div class="row"><span>Doğru cevap</span><b>${S.cor} / ${TOT}</b></div><div class="row"><span>Kalan ❤️ / Altın</span><b>${S.h} / ${S.gold} 🪙</b></div>
<h3 style="margin:12px 0 6px">Türklerin başkent yolu</h3><div class="fb nt">${S.caps.length?S.caps.map((c,i)=>(i+1)+". <b>"+c.n+"</b> ("+c.d+")").join(" → "):"Başkent yolu bu kez açılamadı."}</div>
<h3 style="margin:12px 0 6px">Tekrar etmen gerekenler (${S.wrong.length})</h3>${S.wrong.length?S.wrong.map(w=>`<div class="fb bad"><b>${w.k}</b><div class="note">Senin cevabın: ${w.sel}<br>Doğrusu: ${w.r}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
<p id="msg" class="note" style="margin:10px 0"></p><button class="nx" onclick="location.reload()">Yeniden Oyna</button>`}
function send(){const sn=Math.round((Date.now()-S.t0)/1000),won=!S.over&&S.st>=ST.length;S.pend={kayitId:Date.now().toString(36)+Math.random().toString(36).slice(2,8),adSoyad:me.a,okulNo:me.n,sube:me.s,oyun:"Türk Kervanı"+(won?" (Konya'ya ulaştı)":" (kalpler bitti: "+ST[Math.min(S.st,ST.length-1)].n+")"),seviye:"6. Sınıf Ortak Mirasımız",turSayisi:1,puan:pt(),dogruSayisi:S.cor,toplamSoru:TOT,gecenSure:Math.floor(sn/60)+" dk "+sn%60+" sn",gecenSureSn:sn,yanlisTiklama:S.wrong.length,hataliIller:S.wrong.map(w=>w.k).join(", "),yanlisDetay:S.wrong.map(w=>w.k+": "+w.sel+" → doğrusu "+w.r).join(" | "),ad:me.a,sinif:me.s,no:me.n,okulKodu:me.kod,sekme:"Türk Kervanı",b:[S.cor,S.wrong.length],yanlis:S.wrong.length,liste:"Süre "+Math.floor(sn/60)+" dk "+sn%60+" sn | Doğru "+S.cor+"/"+TOT+" | Yanlış: "+S.wrong.map(w=>w.k).join(", ")};post()}
async function post(){const m=$("#msg");if(!me.kod||!S.pend)return;if(!SCRIPT_URL){m.textContent="ℹ️ Kayıt bağlantısı henüz yapılmadı.";return}
m.style.color="#64748b";m.textContent="⏳ Sonuçların kaydediliyor...";
try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...S.pend,kod:me.kod})});m.style.color="#059669";m.textContent="✓ Sonuçların öğretmenine gönderildi."}
catch(e){m.style.color="#b45309";m.innerHTML='⚠️ Sonuç gönderilemedi. <button onclick="post()" style="padding:3px 10px;border-radius:8px;border:1px solid #b45309;background:#fff;font-weight:800;cursor:pointer">Tekrar dene</button>'}}
R();
</script></body></html>
