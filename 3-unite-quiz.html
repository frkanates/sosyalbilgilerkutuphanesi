<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ortak Mirasımız | Keşif Quizi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f2ea;color:#1e293b;padding:16px;display:flex;justify-content:center}
.box{width:100%;max-width:880px;background:#fff;border:2px solid #e4dcce;border-radius:18px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;background:#faf7f2;border-bottom:2px solid #e4dcce;font-weight:700}
.sc{background:#fef3c7;color:#b45309;border-radius:99px;padding:4px 14px}
.rail{height:7px;background:#e7dfd2}#pf{height:100%;width:0;background:#d97706;transition:width .3s}
#app{padding:22px 20px}h2{font-size:1.4rem;margin-bottom:4px}.d{color:#64748b;margin-bottom:14px}
.pool,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fdfbf7;border:1.5px solid #e4dcce;border-radius:12px;margin-bottom:14px;min-height:54px}
.pill,.w{background:#fff;border:2px solid #e4dcce;border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.on{background:#d97706;color:#fff;border-color:#d97706}.w.pl{opacity:.35;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bk{border:2px dashed #cfc2ae;border-radius:12px;padding:14px;min-height:150px;cursor:pointer;background:#faf7f2}.bk h3{font-size:1rem;margin-bottom:10px}
.chip{display:inline-block;background:#fff;border:1px solid #d4c8b6;border-radius:99px;padding:4px 12px;margin:3px;font-weight:700;font-size:.88rem}.chip b{color:#dc2626;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fdfbf7;border:1.5px solid #e4dcce;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.b2{border:2px solid #e4dcce;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}
.t{background:#d1fae5;border-color:#059669;color:#059669}.f{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.slot{display:inline-block;min-width:110px;border-bottom:2.5px dashed #d97706;background:#fcf4e8;border-radius:6px;padding:1px 8px;margin:0 3px;text-align:center;font-weight:800;color:#b45309;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e4dcce;border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.opt.on{background:#fef3c7;border-color:#d97706;color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1.5px solid #e4dcce}
.nx{background:#d97706;color:#fff;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer}.nx:disabled{opacity:.4;cursor:not-allowed}
.rv{border:1.5px solid;border-radius:12px;padding:10px 14px;margin-bottom:8px}.ok{background:#d1fae5;border-color:#059669}.bad{background:#fee2e2;border-color:#dc2626}
.note{font-size:.9rem;color:#475569;margin-top:4px}
input{width:100%;padding:10px;border:2px solid #e4dcce;border-radius:10px;font:inherit;margin-bottom:10px}
.big{font-size:2.2rem;font-weight:800;color:#b45309}
@media(max-width:600px){.g2{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.bar{flex-direction:column;align-items:stretch}}
</style></head><body>
<div class="box"><div class="hd"><span>📚 6. Sınıf Sosyal Bilgiler • Ortak Mirasımız</span><span><span id="st">Giriş</span> &nbsp;<span class="sc">★ <span id="sc">0</span></span></span></div>
<div class="rail"><div id="pf"></div></div><div id="app"></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz9spIheytnCvFO5_7eAi8dXPyzX_P8DR4xMBtGI4uxq6k8rjsY77U5S4-kseKPfnYGBg/exec";

// URL'den kodu yakala (?tasokul veya ?kod=tasokul)
const URL_KOD = (function () {
  const p = new URLSearchParams(location.search);
  let k = (p.get('kod') || '').trim();
  if (!k) { for (const key of p.keys()) { if (key !== 'kod') { k = key.trim(); break; } } }
  return k;
})();

const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const SORT=[["Kurgan", "d"], ["Balbal", "d"], ["Hayvan Üslubu", "d"], ["Orhun Kitabeleri", "d"], ["Türbe", "s"], ["Medrese", "s"], ["Kervansaray", "s"], ["Kutadgu Bilig", "s"]];

const TF=[["Asya Hun Devleti'nin kurucusu Teoman'dır; en parlak dönemini Mete Han zamanında yaşamıştır.", true, "Asya Hun Devleti Teoman tarafından kurulmuş, Mete Han döneminde onluk sistemle güçlenmiştir."], ["Tarihte Türk adını taşıyan ilk devlet Asya Hun Devleti'dir.", false, "Türk adını taşıyan ilk devlet, Bumin Kağan'ın kurduğu I. Göktürk Devleti'dir."], ["Orhun Kitabeleri Uygurlar tarafından yazılmıştır.", false, "Orhun Kitabeleri Göktürkler (II. Göktürk) dönemine aittir."], ["Kurultayda devlet işleri görüşülür, hatun da yönetimde aktif rol alırdı.", true, "Kurultay bir meclistir; hatun elçileri kabul eder, kağan seferdeyken devleti yönetirdi."], ["Uygurlar Maniheizm'i kabul ettikten sonra yerleşik hayata geçip ilk Türk şehirlerini kurmuştur.", true, "Çadırı bırakıp Ordubalık gibi şehirler kurdular; tarım, mimari ve matbaada gelişmişlerdir."], ["Türkler İslamiyet'i kabul ettikten sonra konargöçer yaşamı tamamen bırakmıştır.", false, "Şehirler kurulsa da halkın büyük bölümü boylar hâlinde konargöçer yaşamaya devam etmiştir."], ["Abbasiler döneminde Bağdat'ta kurulan Beytülhikme'de bilimsel eserler tercüme edilmiştir.", true, "Beytülhikme, Abbasiler döneminde tercüme ve bilimsel çalışmaların merkeziydi."], ["Sultan Alparslan, Malazgirt'te hilal (Turan) taktiğini kullanarak Bizans ordusunu yenmiştir.", true, "Hilal taktiği, düşmanı çember içine alma sanatıdır."], ["Türkiye Selçuklu Devleti'nin başkenti I. Haçlı Seferi sonrasında İznik'ten Konya'ya taşınmıştır.", true, "Haçlı ordusu İznik'e saldırınca güvenli merkez olan Konya başkent yapıldı."], ["Yağıbasan Medresesi, Anadolu'daki ilk Türk medresesidir ve Mengücekliler tarafından yaptırılmıştır.", false, "Tokat'taki Yağıbasan Medresesi Danişmentlilere aittir. Mengücekliler Divriği Ulu Camii'ni yaptırmıştır."]];

const FILL=[["Mete Han'ın orduyu 10, 100 ve 1000 kişilik gruplara ayırdığı sisteme {} sistem denir.", "Onluk"], ["Devlet işlerinin görüşüldüğü; hakan, hatun ve boy beylerinin katıldığı meclise {} denir.", "Kurultay"], ["Ölen kahramanlar adına mezarlara dikilen taşlara {} denir.", "Balbal"], ["Uygurların kurduğu ilk Türk şehrine {} denir.", "Ordubalık"], ["Yönetme yetkisinin Gök Tanrı tarafından verildiği inanışına {} denir.", "Kut"], ["Ticaret yollarının güvenliği için yapılan, ribat da denen yapılara {} denir.", "Kervansaray"], ["Medrese, şifahane ve aşevi gibi sosyal tesislerin masraflarını karşılayan sisteme {} denir.", "Vakıf"], ["Gazneli Mahmud, Abbasi Halifesi'nden {} unvanını alan ilk Türk hükümdarıdır.", "Sultan"], ["Kutalmışoğlu Süleyman Şah, Türkiye Selçuklu Devleti'ni 1077'de {} şehrinde kurmuştur.", "İznik"], ["Anadolu'nun Türk yurdu olduğunu kesinleştiren 1176 savaşı {} Savaşı'dır.", "Miryokefalon"]];

const BANK=["Onluk", "Kurultay", "Balbal", "Ordubalık", "Kut", "Kervansaray", "Vakıf", "Sultan", "İznik", "Miryokefalon", "Töre", "Maniheizm", "Dandanakan"];

const MCQ=[["Tarihte \"Türk\" adını taşıyan ilk devlet hangisidir?", "I. Göktürk Devleti", ["Asya Hun Devleti", "Uygur Devleti", "Karahanlılar"], "Bumin Kağan önderliğinde kurulan I. Göktürk Devleti, Türk adını taşıyan ilk devlettir."], ["Orhun Kitabeleri aşağıdakilerden hangileri adına dikilmiştir?", "Bilge Kağan, Kültigin ve Vezir Tonyukuk", ["Mete Han, Teoman ve Bumin Kağan", "Bögü Kağan, Satuk Buğra Han ve Alparslan", "Çağrı Bey, Tuğrul Bey ve Alparslan"], "Orhun Kitabeleri, Türk tarihinin ve edebiyatının ilk yazılı belgeleridir."], ["Uygurların yerleşik hayata geçmesinde en etkili gelişme hangisidir?", "Maniheizm'i benimsemeleri", ["Kut inancını kabul etmeleri", "Onluk sistemi benimsemeleri", "Orhun Kitabeleri'ni dikmeleri"], "Maniheizm savaşmayı yasakladı; Uygurlar çadırı bırakıp şehir kurdu ve tarım yaptı."], ["Bir kağan töreye uymazsa Kut'un geri alınacağına inanılması neyi gösterir?", "Kağanın yetkisinin töre ile sınırlı olduğunu", ["Kağanın sınırsız yetkiye sahip olduğunu", "Devleti yalnızca hatunun yönettiğini", "Halkın yönetimde hiç söz hakkı olmadığını"], "Töre her şeyin üstündedir; kağan dahil herkes ona uymak zorundadır."], ["751 Talas Savaşı'nın Türk tarihi açısından en önemli sonucu hangisidir?", "Türklerin İslamiyet'i kitleler hâlinde kabul etmesi hızlandı.", ["Türkler Anadolu'ya yerleşmeye başladı.", "Karahanlı Devleti yıkıldı.", "Türkiye Selçuklu Devleti kuruldu."], "Türk-Arap ittifakı Çinlilere karşı kazandı ve İslamiyet'in yayılması hızlandı."], ["Hindistan'a 17 sefer düzenleyen ve Abbasi Halifesi'nden Sultan unvanını alan ilk Türk hükümdarı kimdir?", "Gazneli Mahmud", ["Satuk Buğra Han", "Çağrı Bey", "II. Kılıç Arslan"], "Gazneli Mahmud, Sultan unvanını alan ilk Türk hükümdarıdır."], ["Aşağıdakilerden hangisi Miryokefalon Savaşı'nın (1176) sonucudur?", "Bizans'ın Türkleri Anadolu'dan atma umudu sona erdi.", ["Anadolu'nun kapıları Türklere açıldı.", "Büyük Selçuklu Devleti kuruldu.", "Türkiye Selçuklu başkenti Konya'dan İznik'e taşındı."], "Malazgirt kapıyı açtı, Miryokefalon ise Anadolu'nun Türk yurdu olduğunu kesinleştirdi."], ["Aşağıdaki beylik - eser eşleşmelerinden hangisi doğrudur?", "Mengücekliler - Divriği Ulu Camii ve Darüşşifası", ["Saltuklular - Malabadi Köprüsü", "Artuklular - Yağıbasan Medresesi", "Danişmentliler - Üç Kümbetler"], "Saltuklular: Üç Kümbetler, Danişmentliler: Yağıbasan, Artuklular: Malabadi Köprüsü."], ["Haçlı Seferleri sonucunda Avrupalıların öğrendiği kâğıt ve matbaa yapımı Avrupa'da öncelikle neyi etkilemiştir?", "Eğitim, bilim ve kültürel gelişimi", ["Askerî güç ve savaş taktiklerini", "Denizcilik ve keşifleri", "Tarım ve ekonomik üretimi"], "Kâğıt ve matbaa sayesinde eğitim, bilim ve okuma-yazma hızla arttı."], ["Türkiye Selçuklu Devleti'nin başkenti İznik'ten Konya'ya neden taşınmıştır?", "I. Haçlı Seferi ordusu İznik'e saldırınca güvenli bir merkez seçildiği için", ["Konya'nın Bizans'ın başkenti olması nedeniyle", "Malazgirt Zaferi sonrası yapılan anlaşma gereği", "Çaka Bey'in İzmir'de donanma kurması nedeniyle"], "Başkent değişimi devletin yıkılmadığını, daha güvenli merkezden direndiğini gösterir."]];

const ORD=[["Anadolu'nun Türk yurdu oluş süreci", ["1071 Malazgirt Zaferi ile Anadolu'nun kapılarının açılması", "İlk Türk beyliklerinin ve Türkiye Selçuklu Devleti'nin kurulması", "1176 Miryokefalon Savaşı ile Anadolu'nun Türk yurdu olmasının kesinleşmesi"]], ["İlk Türk devletlerinin kuruluş sırası", ["Asya Hun Devleti (Mete Han)", "I. Göktürk Devleti (Bumin Kağan)", "Uygur Devleti (Bögü Kağan)"]], ["Türk-İslam devletlerinin kuruluş sırası", ["Karahanlılar (Satuk Buğra Han ile İslamiyet'in kabulü)", "Gazneliler (963)", "Büyük Selçuklu Devleti (1040 Dandanakan Savaşı)"]]];

const MAX=[16,20,20,20,24],NM=["Dönem Sınıflandırma","Doğru / Yanlış","Kelime Sandığı","Çoktan Seçmeli","Sıralama"];
let sec=-1,score=0,me={},sc=[],W=[],rev=null,sent=0;

const S={p:{},s:null,items:sh(SORT.map((x,i)=>({i,t:x[0],c:x[1]})))};
const T={a:{},items:sh(TF.map((x,i)=>({i,t:x[0],v:x[1],e:x[2]})))};
const F={p:{},s:null,items:sh(FILL.map((x,i)=>({i,t:x[0],r:x[1]}))),bank:sh(BANK)};
const M={i:0,a:{},rows:[],qs:MCQ.map(q=>({q:q[0],r:q[1],o:sh([q[1],...q[2]]),e:q[3]}))};
const O={i:0,rows:[],e:0,st:ORD.map(s=>{let o=sh(s[1].map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();return{t:s[0],it:s[1],o}})};
const bar=(m,on,fn,l="Bölümü Tamamla →")=>`<div class="bar"><b>${m}</b><button class="nx" ${on?"":"disabled"} onclick="${fn}">${l}</button></div>`;
const esc=s=>String(s).replace(/</g,"&lt;");

function R(top){
  const y=scrollY;
  $("#sc").textContent=score;
  $("#st").textContent=sec<0?"Giriş":sec<5?`Bölüm ${sec+1} / 5`:"Sonuç";
  $("#pf").style.width=Math.max(0,sec)*20+"%";
  $("#app").innerHTML=rev?revH():[startH,sortH,tfH,fillH,mcqH,ordH,endH][sec+1]();
  scrollTo(0,top?0:y);
  if(sec==5&&!rev&&!sent){sent=1;send()}
}

function fin(rows,e){score+=e;sc[sec]=e;rows.forEach(r=>{if(!r.ok)W.push(r)});rev={rows,e};R(1)}
function go(){rev=null;sec++;R(1)}
function revH(){
  return `<h2>Bölüm ${sec+1} sonucu: +${rev.e} / ${MAX[sec]} puan</h2><p class="d">Yanlışlarını incele, doğrusunu öğren.</p>
  ${rev.rows.map(r=>`<div class="rv ${r.ok?"ok":"bad"}">${r.ok?"✓":"✗"} ${r.t}${r.ok?"":`<div class="note">${r.n}</div>`}</div>`).join("")}
  ${bar("",1,"go()",sec==4?"Sonucu Gör 🏁":"Sonraki Bölüm →")}`;
}

function startH(){
  return `<h2>Ortak Mirasımız Keşif Quizi</h2>
  <p class="d">Önce özet ve videolardan çalış, sonra quizi çöz. Toplam 100 puan.</p>
  <input id="ia" placeholder="Ad Soyad">
  <input id="is" placeholder="Sınıf (örn. 6-A)">
  <input id="in" placeholder="Okul numarası (bilmiyorsan boş bırak)">
  ${bar("",1,"st0()","Başla →")}`;
}

function st0(){
  const a=$("#ia").value.trim(),s=$("#is").value.trim();
  if(!a||!s){alert("Ad soyad ve sınıfı yaz.");return}
  me={a,s,n:$("#in").value.trim()||"-",k:URL_KOD};
  sec=0;
  R(1);
}

function sortH(){
  const un=S.items.filter(x=>!S.p[x.i]),
  bk=c=>S.items.filter(x=>S.p[x.i]==c).map(x=>`<span class="chip">${x.t} <b onclick="event.stopPropagation();delete S.p[${x.i}];R()">×</b></span>`).join("")||"<small>Buraya dokun</small>";
  return `<h2>Bölüm 1: Hangi Dönemin Mirası?</h2>
  <p class="d">Bir kavram seç, sonra doğru sepete dokun.</p>
  <div class="pool">${un.map(x=>`<div class="pill ${S.s===x.i?"on":""}" onclick="S.s=${x.i};R()">${x.t}</div>`).join("")||"✓ Hepsi yerleşti"}</div>
  <div class="g2">
    <div class="bk" onclick="drop('d')"><h3>🐎 İslamiyet Öncesi Türk Kültürü</h3>${bk("d")}</div>
    <div class="bk" onclick="drop('s')"><h3>🕌 Türk-İslam Kültürü</h3>${bk("s")}</div>
  </div>
  ${bar(`Kalan: ${un.length}`,!un.length,"doneS()")}`;
}
function drop(c){if(S.s==null)return;S.p[S.s]=c;S.s=null;R()}
function doneS(){
  const rows=S.items.map(x=>({ok:S.p[x.i]==x.c,t:x.t,n:`Doğrusu: ${x.c=="d"?"İslamiyet öncesi Türk kültürü":"Türk-İslam kültürü"}`}));
  fin(rows,rows.filter(r=>r.ok).length*2);
}

function tfH(){
  const n=Object.keys(T.a).length;
  return `<h2>Bölüm 2: Doğru mu, Yanlış mı?</h2>
  <p class="d">10 önermeyi işaretle.</p>
  ${T.items.map(x=>`<div class="row"><span>${x.t}</span><span style="display:flex;gap:8px"><button class="b2 ${T.a[x.i]===true?"t":""}" onclick="T.a[${x.i}]=true;R()">✓ DOĞRU</button><button class="b2 ${T.a[x.i]===false?"f":""}" onclick="T.a[${x.i}]=false;R()">✕ YANLIŞ</button></span></div>`).join("")}
  ${bar(`Cevaplanan: ${n} / 10`,n==10,"doneT()")}`;
}
function doneT(){
  const rows=T.items.map(x=>({ok:T.a[x.i]===x.v,t:x.t,n:`Senin cevabın: ${T.a[x.i]?"Doğru":"Yanlış"}. Doğrusu: <b>${x.v?"Doğru":"Yanlış"}</b>. ${x.e}`}));
  fin(rows,rows.filter(r=>r.ok).length*2);
}

function fillH(){
  const u=Object.values(F.p),n=u.length;
  return `<h2>Bölüm 3: Kelime Sandığı</h2>
  <p class="d">Bir kelime seç, sonra boşluğa dokun. Dolu boşluğa dokunursan kelime geri alınır.</p>
  ${F.items.map(x=>`<div class="row" style="display:block;line-height:2.1">${x.t.replace("{}",`<span class="slot" onclick="setSlot(${x.i})">${F.p[x.i]||"dokun"}</span>`)}</div>`).join("")}
  <div class="bank">${F.bank.map(w=>`<div class="w ${F.s===w?"on":""} ${u.includes(w)?"pl":""}" onclick="pickW(${F.bank.indexOf(w)})">${w}</div>`).join("")}</div>
  ${bar(`Doldurulan: ${n} / 10`,n==10,"doneF()")}`;
}
function pickW(k){
  const w=F.bank[k];
  F.s = (F.s === w) ? null : w;
  R();
}
function setSlot(i){
  if(F.s){ F.p[i]=F.s; F.s=null; }
  else { delete F.p[i]; }
  R();
}
function doneF(){
  const rows=F.items.map(x=>({ok:F.p[x.i]==x.r,t:x.t.replace("{}",`<u>${F.p[x.i]}</u>`),n:`Doğrusu: <b>${x.r}</b>`}));
  fin(rows,rows.filter(r=>r.ok).length*2);
}

function mcqH(){
  const q=M.qs[M.i],a=M.a[M.i],l=M.i==M.qs.length-1;
  return `<h2>Bölüm 4: Çoktan Seçmeli</h2>
  <p class="d">Soru ${M.i+1} / ${M.qs.length}</p>
  <p style="font-weight:700;margin-bottom:12px">${q.q}</p>
  ${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" onclick="M.a[M.i]=${i};R()">${"ABCD"[i]}) ${o}</button>`).join("")}
  ${bar(a===undefined?"Bir seçenek işaretle":"Seçim yapıldı",a!==undefined,"nextM()",l?"Bölümü Bitir →":"Sonraki Soru →")}`;
}
function nextM(){
  const q=M.qs[M.i],y=q.o[M.a[M.i]];
  M.rows.push({ok:y==q.r,t:q.q,n:`Senin cevabın: ${y}<br>Doğru cevap: <b>${q.r}</b><br>${q.e}`});
  if(M.i<M.qs.length-1){M.i++;R(1)}else fin(M.rows,M.rows.filter(r=>r.ok).length*2);
}

function ordH(){
  const s=O.st[O.i];
  return `<h2>Bölüm 5: Sıralama</h2>
  <p class="d">${s.t} (${O.i+1} / 3) — okları kullanarak doğru sıraya diz.</p>
  ${s.o.map((v,k)=>`<div class="row"><span>${s.it[v]}</span><span style="display:flex;gap:6px"><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button><button class="b2" ${k<2?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")}
  ${bar("",1,"okO()",O.i<2?"Sırayı Onayla →":"Quizi Bitir 🏁")}`;
}
function mv(k,d){const o=O.st[O.i].o;[o[k],o[k+d]]=[o[k+d],o[k]];R()}
function okO(){
  const s=O.st[O.i],ok=s.o.every((v,k)=>v==k);
  O.rows.push({ok,t:s.t,n:"Doğru sıra: "+s.it.map((x,k)=>`${k+1}) ${x}`).join(" → ")});
  if(ok)O.e+=8;
  if(O.i<2){O.i++;R(1)}else fin(O.rows,O.e);
}

function endH(){
  const t=score>=85?["🎖️","Altın Rozetli Zaman Yolcusu"]:score>=65?["🧭","Ortak Miras Rehberi"]:["🌱","Genç Tarih Dedektifi"];
  return `<div style="text-align:center"><div style="font-size:3.5rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${esc(me.a)} • ${esc(me.s)}</p><div class="big">${score} / 100</div></div>
  <h3 style="margin:14px 0 8px">Bölüm puanların</h3>${NM.map((n,i)=>`<div class="row"><span>${i+1}.${n}</span><b>${sc[i]} /${MAX[i]}</b></div>`).join("")}
  <h3 style="margin:14px 0 8px">Tekrar etmen gerekenler (${W.length})</h3>${W.length?W.map(r=>`<div class="rv bad">${r.t}<div class="note">${r.n}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
  <p id="msg" class="note" style="margin:12px 0;display:none;font-weight:700"></p>${bar("",1,"location.reload()","Yeniden Başla")}`;
}

async function send(){
  if(!me.k || !SCRIPT_URL) return;
  const m=$("#msg");
  if(m){
    m.style.display="block";
    m.style.color="#64748b";
    m.textContent="⏳ Sonuçların öğretmenine gönderiliyor…";
  }
  try{
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        kod:me.k,
        okulKodu:me.k,
        oyun:"3. Ünite Quizi",
        ad:me.a,
        sinif:me.s,
        no:me.n,
        puan:score,
        b:sc,
        yanlis:W.length,
        liste:W.map(r=>r.t.replace(/<[^>]+>/g,"")).join(" | ").slice(0,1500)
      })
    });
    if(m){
      m.style.color="#059669";
      m.textContent="✓ Sonucun öğretmenine gönderildi!";
    }
  }catch(e){
    if(m){
      m.style.color="#dc2626";
      m.textContent="⚠️ Sonuç gönderilemedi. İnternet bağlantını kontrol et.";
    }
  }
}

R();
