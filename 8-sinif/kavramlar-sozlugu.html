<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232b;--ink:#eef0f3;--mut:#9aa4b2;--acc:#ec8a6f;--acc2:#6fc0b8;--line:#2e3742}}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
.w{max-width:560px;margin:0 auto;padding:18px 16px 40px}h1{font-size:21px;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.sc{perspective:1200px;height:320px;cursor:pointer}.cd{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.cd.f{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.08)}

.l{font:600 12px system-ui,sans-serif;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}

.no{background:var(--acc)}.ok{background:var(--acc2)}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{sel=b.dataset.u;tabs();pick()})}
function render(){
$("bar").style.width=(deck.length?i/deck.length*100:0)+"%";$("sc2").textContent="Biliyorum: "+ok+" · Tekrar: "+again.length;
