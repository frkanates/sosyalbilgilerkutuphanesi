<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwIFLeup5869qiswpGNL44WFFP-wCgxPywhDaLyF3plEWjVlyYVYyngDHT5-whp2gIi/exec";

// URL'den kodu yakala (?tasokul veya ?kod=tasokul). Kod yoksa quiz genel modda çalışır, sonuç kaydedilmez.

const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SORT=[["Türk-Müslüman toplulukları fethedilen yerlere yerleştirmek","f"],["Gayrimüslim halkın can, mal ve inanç güvenliğini korumak","f"],["Gaza ve cihat anlayışıyla planlı fetihler yapmak","f"],["Merkezî otoriteyi güçlü tutmak","f"],["Avrupa usulüne göre Nizam-ı Cedid Ordusu kurmak","r"],["Yeniçeri Ocağı’nı kaldırmak (Vaka-i Hayriye)","r"],["Tanzimat Fermanı’nı ilan etmek","r"],["Darülfünun ve rüştiye gibi yeni okullar açmak","r"]];

const TF=[
["İskân politikası, fethedilen yerlerde kalıcı hâkimiyet kurmayı amaçlar.",true,"Türk-Müslüman topluluklar yeni topraklara yerleştirilmiştir."],
["İstimalet politikası, gayrimüslim halka baskı uygulamayı esas alır.",false,"İstimalet; halkın haklarına saygı gösterip gönlünü kazanmaktır."],
["İstanbul’un fethiyle II. Mehmed “Fatih” unvanını almıştır.",true,"Fetih 1453’te gerçekleşmiştir."],
["Osmanlı gemileri Haliç’e karadan kızaklarla yürütülerek indirilmiştir.",true,"Haliç girişindeki zincir bu yolla aşılmıştır."],
["Mısır Seferi sonucunda Baharat Yolu’nun denetimi Osmanlı’ya geçmiştir.",true,"Doğu–Batı ticaretinde Osmanlı’nın etkisi artmıştır."],
["Preveze Deniz Muharebesi’nde Haçlı donanmasının başında Barbaros Hayreddin Paşa bulunuyordu.",false,"Barbaros Osmanlı donanmasının başındaydı; Haçlılar’ı Andrea Doria yönetiyordu."],
["Büyük deniz seyahatleri Osmanlı ekonomisini olumlu etkilemiştir.",false,"İpek ve Baharat Yolları önemini kaybetmiş, gelirler azalmıştır."],
["Reform hareketleri Osmanlı topraklarında gayrimüslim halka dinî baskı getirmiştir.",false,"Osmanlı’da gayrimüslimler inançlarını özgürce yaşamıştır."],
["Lale Devri’nde ilk itfaiye teşkilatı olan Tulumbacılar Ocağı kurulmuştur.",true,"1720 yılında kurulmuştur."],
["Vakıfların hizmetlerinden yalnızca Müslümanlar yararlanabilirdi.",false,"Din, dil, ırk ayrımı yapılmamıştır."]];

["Fethedilen yerlere Türk-Müslüman toplulukların yerleştirilmesi politikasına {} politikası denir.","İskân"],
["Halkın gönlünü kazanmayı amaçlayan politikaya {} denir.","İstimalet"],
["Doğu Roma, Haliç girişine büyük bir demir {} gererek donanmanın girişini engellemek istemiştir.","Zincir"],
["Yavuz Sultan Selim 1514’te {} Savaşı’nı kazanarak doğu sınırlarını güçlendirmiştir.","Çaldıran"],
["Osmanlı Devleti’ne katılan son Anadolu beyliği {} Beyliği’dir.","Dulkadiroğulları"],
["Yeniçeri Ocağı’nın 1826’da kaldırılmasına {} denir.","Vaka-i Hayriye"],
["III. Selim’in Avrupa usulüne göre kurduğu orduya {} Ordusu adı verilmiştir.","Nizam-ı Cedid"],
["Türkçe kitap basan matbaa, Said Mehmed Efendi ve {} İbrahim Efendi tarafından kurulmuştur.","Müteferrika"],
["Kişilerin mallarını toplum yararına süresiz bağışlamasına {} denir.","Vakıf"],
["Devlet işlerinin görüşüldüğü en önemli merkez yönetim kurumu {}’dur.","Divan-ı Hümayun"]];
const BANK=["İskân","İstimalet","Zincir","Çaldıran","Dulkadiroğulları","Vaka-i Hayriye","Nizam-ı Cedid","Müteferrika","Vakıf","Divan-ı Hümayun","Mercidabık","Tanzimat","Ahilik"];
const MCQ=[
["Aşağıdakilerden hangisi iskân politikasının amaçlarından biri değildir?","Gayrimüslim halkı inançlarını değiştirmeye zorlamak",["Fethedilen bölgelerde kalıcı hâkimiyet sağlamak","Konargöçerleri yerleşik hayata geçirmek","Üretimi artırıp ekonomiyi canlandırmak"],"İskân, kalıcı düzen ve güvenlik içindir; zorlama amacı taşımaz."],
["Osmanlı gemilerinin karadan Haliç’e indirilmesinin amacı nedir?","Haliç’teki zinciri aşıp şehri denizden de kuşatmak",["Galata’yı yıkmak","Karadeniz’e açılmak","Ticaret yollarını kapatmak"],"Zincir yüzünden donanma Haliç’e giremiyordu."],
["Aşağıdakilerden hangisi Mısır Seferi’nin sonuçlarından biri değildir?","Doğu Roma İmparatorluğu’nun yıkılması",["Baharat Yolu’nun Osmanlı denetimine geçmesi","Padişahların halife unvanını taşımaya başlaması","Mekke ve Medine’nin Osmanlı topraklarına katılması"],"Doğu Roma, 1453’te İstanbul’un fethiyle yıkılmıştır."],
["Preveze Deniz Muharebesi (1538) sonucunda hangisi gerçekleşmiştir?","Osmanlı Devleti Akdeniz’de üstünlük kurmuştur",["Memlük Devleti yıkılmıştır","Doğu Roma sona ermiştir","İpek Yolu kapanmıştır"],"Barbaros komutasındaki donanma Haçlı donanmasını yenmiştir."],
["Avrupalıların yeni ticaret yolları aramasının temel nedeni nedir?","Osmanlı’nın İpek ve Baharat Yolları’nı kontrol etmesi",["Sanayi İnkılabı’nın başlaması","Matbaanın bulunması","Osmanlı donanmasının zayıflaması"],"Doğu’nun değerli ürünlerine ulaşmak istediler."],
["Sanayi İnkılabı Osmanlı Devleti’ni nasıl etkilemiştir?","Avrupa’dan gelen ucuz mallar yerli üretimi zorlamıştır",["Osmanlı mallarını Avrupa’ya büyük ölçüde satmıştır","El tezgâhlarına olan talep artmıştır","Tüm vergiler kaldırılmıştır"],"Seri üretilen ucuz mallar esnafı zor durumda bırakmıştır."],
["Fransız İhtilali’nin yaydığı hangi düşünce çok uluslu Osmanlı’da isyanlara yol açmıştır?","Milliyetçilik",["Sömürgecilik","Rönesans","İskân"],"Özellikle Balkanlar’daki gayrimüslim topluluklar etkilenmiştir."],
["Tanzimat Fermanı (1839) ile hangi güvence verilmiştir?","Herkesin can ve mal güvenliğinin korunacağı",["Padişahlığın kaldırılacağı","Yeniçeri Ocağı’nın kurulacağı","Gayrimüslimlerin vergi vermeyeceği"],"Mustafa Reşid Paşa tarafından hazırlanmıştır."],
["Osmanlı’nın “Vakıf Medeniyeti” olarak anılmasının nedeni nedir?","Eğitim, sağlık ve sosyal hizmetlerin ayrım gözetmeden vakıflarla sunulması",["Bütün toprakların vakıf olması","Vakıf mallarının serbestçe satılabilmesi","Vakıfların yalnızca saraya hizmet etmesi"],"Vakıflar devletin yükünü hafifletmiştir."],
["Ahi teşkilatının temel görevi nedir?","Esnafı ahlaki değerlerle yetiştirip dayanışmayı sağlamak",["Orduyu yönetmek","Fermanları hazırlamak","Vergi toplamak"],"Ahiler kazançlarını yoksullarla paylaşırdı."]];
const ORD=[
["Osmanlı Devleti’nin başkentleri (sırasıyla)",["Bursa","Edirne","İstanbul"]],
["İstanbul’un fethi sürecinde olaylar",["Rumeli Hisarı’nın yaptırılması","Gemilerin karadan Haliç’e indirilmesi","29 Mayıs’ta son büyük hücum"]],
["Yenileşme hareketleri",["Nizam-ı Cedid Ordusu’nun kurulması","Yeniçeri Ocağı’nın kaldırılması","Tanzimat Fermanı’nın ilanı"]]];
const MAX=[16,20,20,20,24],NM=["Politika mı, Yenilik mi?","Doğru / Yanlış","Divan Sandığı","Çoktan Seçmeli","Sıralama"];
let sec=-1,score=0,me={},sc=[],W=[],rev=null,sent=0;
const S={p:{},s:null,items:sh(SORT.map((x,i)=>({i,t:x[0],c:x[1]})))};
const T={a:{},items:sh(TF.map((x,i)=>({i,t:x[0],v:x[1],e:x[2]})))};
const F={p:{},s:null,items:sh(FILL.map((x,i)=>({i,t:x[0],r:x[1]}))),bank:sh(BANK)};
const M={i:0,a:{},rows:[],qs:MCQ.map(q=>({q:q[0],r:q[1],o:sh([q[1],...q[2]]),e:q[3]}))};
const O={i:0,rows:[],e:0,st:ORD.map(s=>{let o=sh(s[1].map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();return{t:s[0],it:s[1],o}})};
const bar=(m,on,fn,l="Bölümü Tamamla →")=>`<div class="bar"><b>${m}</b><button class="nx" ${on?"":"disabled"} onclick="${fn}">${l}</button></div>`;
const esc=s=>String(s).replace(/</g,"&lt;");

function R(top){const y=scrollY;$("#sc").textContent=score;$("#st").textContent=sec<0?"Giriş":sec<5?`Bölüm ${sec+1} / 5`:"Sonuç";$("#pf").style.width=Math.max(0,sec)*20+"%";
$("#app").innerHTML=rev?revH():[startH,sortH,tfH,fillH,mcqH,ordH,endH][sec+1]();scrollTo(0,top?0:y);if(sec==5&&!rev&&!sent){sent=1;send()}}
function fin(rows,e){score+=e;sc[sec]=e;rows.forEach(r=>{if(!r.ok)W.push(r)});rev={rows,e};R(1)}
function go(){rev=null;sec++;R(1)}
function revH(){return `<h2>Bölüm ${sec+1} sonucu: +${rev.e} / ${MAX[sec]} puan</h2><p class="d">Yanlışlarını incele, doğrusunu öğren.</p>${rev.rows.map(r=>`<div class="rv ${r.ok?"ok":"bad"}">${r.ok?"✓":"✗"} ${r.t}${r.ok?"":`<div class="note">${r.n}</div>`}</div>`).join("")}${bar("",1,"go()",sec==4?"Sonucu Gör 🏁":"Sonraki Bölüm →")}`}

function startH(){return `<h2>Ortak Mirasımız Divan Quizi</h2><p class="d">Önce Osmanlı konularını tekrar et, sonra quizi çöz. Toplam 100 puan.</p><input id="ia" placeholder="Ad Soyad"><input id="is" placeholder="Sınıf (örn. 7/A)"><input id="in" placeholder="Okul numarası (bilmiyorsan boş bırak)">${bar("",1,"st0()","Başla →")}`}
function st0(){const a=$("#ia").value.trim(),s=$("#is").value.trim();if(!a||!s){alert("Ad soyad ve sınıfı yaz.");return}me={a,s,n:$("#in").value.trim()||"-",k:URL_KOD};sec=0;R(1)}

function sortH(){const un=S.items.filter(x=>!S.p[x.i]),bk=c=>S.items.filter(x=>S.p[x.i]==c).map(x=>`<span class="chip">${x.t} <b onclick="event.stopPropagation();delete S.p[${x.i}];R()">×</b></span>`).join("")||"<small>Buraya dokun</small>";
return `<h2>Bölüm 1: Politika mı, Yenilik mi?</h2><p class="d">Bir uygulama seç, sonra doğru sepete dokun.</p><div class="pool">${un.map(x=>`<div class="pill ${S.s===x.i?"on":""}" onclick="S.s=${x.i};R()">${x.t}</div>`).join("")||"✓ Hepsi yerleşti"}</div><div class="g2">${SB.map(b=>`<div class="bk" onclick="drop('${b[0]}')"><h3>${b[1]}</h3>${bk(b[0])}</div>`).join("")}</div>${bar(`Kalan: ${un.length}`,!un.length,"doneS()")}`}
function drop(c){if(S.s==null)return;S.p[S.s]=c;S.s=null;R()}
function doneS(){const rows=S.items.map(x=>({ok:S.p[x.i]==x.c,t:x.t,n:`Doğrusu: ${SB.find(b=>b[0]==x.c)[1]}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function tfH(){const n=Object.keys(T.a).length;return `<h2>Bölüm 2: Doğru mu, Yanlış mı?</h2><p class="d">10 önermeyi işaretle.</p>${T.items.map(x=>`<div class="row"><span>${x.t}</span><span style="display:flex;gap:8px"><button class="b2 ${T.a[x.i]===true?"t":""}" onclick="T.a[${x.i}]=true;R()">✓ DOĞRU</button><button class="b2 ${T.a[x.i]===false?"f":""}" onclick="T.a[${x.i}]=false;R()">✕ YANLIŞ</button></span></div>`).join("")}${bar(`Cevaplanan: ${n} / 10`,n==10,"doneT()")}`}
function doneT(){const rows=T.items.map(x=>({ok:T.a[x.i]===x.v,t:x.t,n:`Senin cevabın: ${T.a[x.i]?"Doğru":"Yanlış"}. Doğrusu: <b>${x.v?"Doğru":"Yanlış"}</b>. ${x.e}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function fillH(){const u=Object.values(F.p),n=u.length;return `<h2>Bölüm 3: Divan Sandığı</h2><p class="d">Bir kelime seç, sonra boşluğa dokun. Dolu boşluğa dokunursan kelime geri alınır.</p>${F.items.map(x=>`<div class="row" style="display:block;line-height:2.1">${x.t.replace("{}",`<span class="slot" onclick="setSlot(${x.i})">${F.p[x.i]||"dokun"}</span>`)}</div>`).join("")}<div class="bank">${F.bank.map(w=>`<div class="w ${F.s===w?"on":""} ${u.includes(w)?"pl":""}" onclick="pickW(${F.bank.indexOf(w)})">${w}</div>`).join("")}</div>${bar(`Doldurulan: ${n} / 10`,n==10,"doneF()")}`}
function pickW(k){const w=F.bank[k];F.s=F.s===w?null:w;R()}
function setSlot(i){if(F.s){F.p[i]=F.s;F.s=null}else delete F.p[i];R()}
function doneF(){const rows=F.items.map(x=>({ok:F.p[x.i]==x.r,t:x.t.replace("{}",`<u>${F.p[x.i]}</u>`),n:`Doğrusu: <b>${x.r}</b>`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function mcqH(){const q=M.qs[M.i],a=M.a[M.i],l=M.i==M.qs.length-1;return `<h2>Bölüm 4: Çoktan Seçmeli</h2><p class="d">Soru ${M.i+1} / ${M.qs.length}</p><p style="font-weight:700;margin-bottom:12px">${q.q}</p>${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" onclick="M.a[M.i]=${i};R()">${"ABCD"[i]}) ${o}</button>`).join("")}${bar(a===undefined?"Bir seçenek işaretle":"Seçim yapıldı",a!==undefined,"nextM()",l?"Bölümü Bitir →":"Sonraki Soru →")}`}
function nextM(){const q=M.qs[M.i],y=q.o[M.a[M.i]];M.rows.push({ok:y==q.r,t:q.q,n:`Senin cevabın: ${y}<br>Doğru cevap: <b>${q.r}</b><br>${q.e}`});if(M.i<M.qs.length-1){M.i++;R(1)}else fin(M.rows,M.rows.filter(r=>r.ok).length*2)}

function ordH(){const s=O.st[O.i];return `<h2>Bölüm 5: Sıralama</h2><p class="d">${s.t} (${O.i+1} / 3) — okları kullanarak doğru sıraya diz.</p>${s.o.map((v,k)=>`<div class="row"><span>${s.it[v]}</span><span style="display:flex;gap:6px"><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button><button class="b2" ${k<2?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")}${bar("",1,"okO()",O.i<2?"Sırayı Onayla →":"Quizi Bitir 🏁")}`}
function mv(k,d){const o=O.st[O.i].o;[o[k],o[k+d]]=[o[k+d],o[k]];R()}
function okO(){const s=O.st[O.i],ok=s.o.every((v,k)=>v==k);O.rows.push({ok,t:s.t,n:"Doğru sıra: "+s.it.map((x,k)=>`${k+1}) ${x}`).join(" → ")});if(ok)O.e+=8;if(O.i<2){O.i++;R(1)}else fin(O.rows,O.e)}

function endH(){const t=score>=85?["👑","Cihan Devleti Veziriazamı"]:score>=65?["🏛️","Divan-ı Hümayun Üyesi"]:["📜","Genç Kâtip"];
return `<div style="text-align:center"><div style="font-size:3.5rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${esc(me.a)} • ${esc(me.s)}</p><div class="big">${score} / 100</div></div>
<h3 style="margin:14px 0 8px">Bölüm puanların</h3>${NM.map((n,i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${sc[i]} / ${MAX[i]}</b></div>`).join("")}
<h3 style="margin:14px 0 8px">Tekrar etmen gerekenler (${W.length})</h3>${W.length?W.map(r=>`<div class="rv bad">${r.t}<div class="note">${r.n}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
