<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaşayan Demokrasimiz | 7. Sınıf 4. Öğrenme Alanı Quizi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#e9f4f3;color:#1e293b;padding:16px;display:flex;justify-content:center}
.box{box-shadow:0 6px 0 #bcd9d5;width:100%;max-width:880px;background:#fff;border:2px solid #bcd9d5;border-radius:18px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;background:#f2faf9;border-bottom:2px solid #bcd9d5;font-weight:700}
.sc{background:#d8f0ee;color:#0a4f59;border-radius:99px;padding:4px 14px}
.rail{height:7px;background:#cbe3df}#pf{height:100%;width:0;background:#0e6b78;transition:width .3s}
#app{padding:22px 20px}h2{font-size:1.4rem;margin-bottom:4px}.d{color:#64748b;margin-bottom:14px}
.pool,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#f8fcfb;border:1.5px solid #bcd9d5;border-radius:12px;margin-bottom:14px;min-height:54px}
.pill,.w{background:#fff;border:2px solid #bcd9d5;border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.on{background:#0e6b78;color:#fff;border-color:#0e6b78}.w.pl{opacity:.35;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bk{border:2px dashed #9cc5bf;border-radius:12px;padding:14px;min-height:150px;cursor:pointer;background:#f2faf9}.bk h3{font-size:1rem;margin-bottom:10px}
.chip{display:inline-block;background:#fff;border:1px solid #b3d4cf;border-radius:99px;padding:4px 12px;margin:3px;font-weight:700;font-size:.88rem}.chip b{color:#dc2626;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f8fcfb;border:1.5px solid #bcd9d5;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.b2{border:2px solid #bcd9d5;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}
.t{background:#d1fae5;border-color:#059669;color:#059669}.f{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.slot{display:inline-block;min-width:110px;border-bottom:2.5px dashed #0e6b78;background:#e2f3f1;border-radius:6px;padding:1px 8px;margin:0 3px;text-align:center;font-weight:800;color:#0a4f59;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #bcd9d5;border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.opt.on{background:#d8f0ee;border-color:#0e6b78;color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1.5px solid #bcd9d5}
.nx{background:#0e6b78;color:#fff;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer}.nx:disabled{opacity:.4;cursor:not-allowed}
.rv{border:1.5px solid;border-radius:12px;padding:10px 14px;margin-bottom:8px}.ok{background:#d1fae5;border-color:#059669}.bad{background:#fee2e2;border-color:#dc2626}
.note{font-size:.9rem;color:#3b4a5f;margin-top:4px}
input{width:100%;padding:10px;border:2px solid #bcd9d5;border-radius:10px;font:inherit;margin-bottom:10px}
.big{font-size:2.2rem;font-weight:800;color:#0a4f59}
@media(max-width:600px){.g2{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.bar{flex-direction:column;align-items:stretch}}
</style></head><body>
<div class="box"><div class="hd"><span>🗳️ 7. Sınıf Sosyal Bilgiler • Yaşayan Demokrasimiz</span><span><span id="st">Giriş</span> &nbsp;<span class="sc">★ <span id="sc">0</span></span></span></div>
<div class="rail"><div id="pf"></div></div><div id="app"></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwIFLeup5869qiswpGNL44WFFP-wCgxPywhDaLyF3plEWjVlyYVYyngDHT5-whp2gIi/exec";

// URL'den kodu yakala (?tasokul veya ?kod=tasokul). Kod yoksa quiz genel modda çalışır, sonuç kaydedilmez.
const URL_KOD=(function(){
  const p=new URLSearchParams(location.search);
  let k=(p.get('kod')||'').trim();
  if(!k){for(const key of p.keys()){if(key!=='kod'){k=key.trim();break}}}
  return k;
})();
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SORT=[["Halk egemenliği","d"],["Çoğulculuk","d"],["Seçimler ve katılım","d"],["Sivil toplumun karar süreçlerine katılması","d"],["Kanun üstünlüğü","h"],["Yargı bağımsızlığı","h"],["Temel hakların anayasal güvence altında olması","h"],["Yargı yolunun açık olması","h"]];
const SB=[["d","🗳️ Demokratik devlet"],["h","⚖️ Hukuk devleti"]];
const TF=[
["Cumhuriyette egemenlik millete aittir ve seçilmiş temsilciler aracılığıyla kullanılır.",true,"Cumhuriyetin temel özelliği budur."],
["Anayasa’nın ilk üç maddesi değiştirilebilir.",false,"Bu maddeler değiştirilemez ve değiştirilmesi teklif dahi edilemez."],
["Laik devlet bütün inançlara eşit mesafededir.",true,"Hiçbir dine ayrıcalık tanımaz ya da baskı yapmaz."],
["Kuvvetler birliği ilkesi 1982 Anayasası’nda benimsenmiştir.",false,"1921 Anayasası kuvvetler birliğini, 1982 Anayasası kuvvetler ayrılığını benimsemiştir."],
["Cumhurbaşkanlığı Hükümet Sistemi’nde yürütme çift başlıdır.",false,"Başbakanlık kaldırılmış, yürütme tek başlıdır."],
["TBMM 600 milletvekilinden oluşur ve seçimler 5 yılda bir yapılır.",true,"Yasama yetkisi TBMM’ye aittir."],
["Anayasa Mahkemesi, kanunların Anayasa’ya uygunluğunu denetler.",true,"Ayrıca bireysel başvuruları da karara bağlar."],
["Danıştay, vatandaşlar arasındaki hukuk ve ceza davalarının son inceleme merciidir.",false,"Bu görev Yargıtay’a aittir; Danıştay idari uyuşmazlıklara bakar."],
["Türkiye’deki ilk muhalefet partisi Serbest Cumhuriyet Fırkası’dır.",false,"İlk muhalefet partisi 1924’te kurulan Terakkiperver Cumhuriyet Fırkası’dır."],
["Türk kadınına milletvekili seçme ve seçilme hakkı 1934’te verilmiştir.",true,"Bu hak birçok Avrupa ülkesinden önce tanınmıştır."]];
const FILL=[
["Egemenliğin millete ait olduğu ve seçilmiş temsilcilerle kullanıldığı yönetim biçimine {} denir.","Cumhuriyet"],
["Din ve devlet işlerinin birbirinden ayrılması ilkesine {} denir.","Laiklik"],
["Yasama, yürütme ve yargı yetkilerinin ayrı organlara verilmesine {} denir.","Kuvvetler ayrılığı"],
["Yasama yetkisi Türk milleti adına {}’ne aittir.","TBMM"],
["Cumhurbaşkanı halk tarafından {} yıllığına seçilir.","5"],
["Temel hakları ihlal edilen vatandaşların bireysel başvurusunu {} inceler.","Anayasa Mahkemesi"],
["1921 Anayasası’nda {} ilkesi benimsenmiştir.","Kuvvetler birliği"],
["Millî Mücadele’yi yönettiği için TBMM’ye {} unvanı verilmiştir.","Gazi Meclis"],
["Cumhuriyet {} 1923’te ilan edilmiştir.","29 Ekim"],
["Her seçmenin yalnızca bir oy hakkı olmasına {} oy ilkesi denir.","Eşit"]];
const BANK=["Cumhuriyet","Laiklik","Kuvvetler ayrılığı","TBMM","5","Anayasa Mahkemesi","Kuvvetler birliği","Gazi Meclis","29 Ekim","Eşit","Danıştay","Gizli","4"];
const MCQ=[
["Aşağıdakilerden hangisi demokratik devletin özelliklerinden biri değildir?","Yetkilerin tek elde toplanması",["Halk egemenliği","Çoğulculuk","Şeffaflık ve hesap verebilirlik"],"Demokraside yetkiler tek elde toplanmaz (kuvvetler ayrılığı)."],
["Atatürk milliyetçiliğinin temel özelliği hangisidir?","Irk, din, dil ayrımı gözetmeden vatandaşlık bağına dayanması",["Yalnızca belli bir etnik kökene dayanması","Diğer milletleri küçümsemesi","Vatandaşları inançlarına göre ayırması"],"Türkiye Cumhuriyeti’ni kuran halka Türk milleti denir."],
["Hatalı park eden resmî polis aracına ceza kesilmesi hangi niteliğe örnektir?","Hukuk devleti",["Sosyal devlet","Laik devlet","Kuvvetler birliği"],"Kanunlar karşısında herkes eşittir."],
["Ders kitaplarının ücretsiz dağıtılması hangi niteliğe örnektir?","Sosyal devlet",["Hukuk devleti","Laik devlet","Kuvvetler birliği"],"Sosyal devlet toplumun refahını artırmayı amaçlar."],
["Cumhurbaşkanının kanunlarla ilgili veto yetkisi ne anlama gelir?","Kanunu yeniden görüşülmek üzere TBMM’ye geri göndermesi",["Kanunu kendisinin iptal etmesi","Kanunu Anayasa Mahkemesi’ne sormadan yürürlüğe koyması","Kanunu Resmî Gazete’de zorunlu yayımlaması"],"Kanunu uygun görmezse Meclis’e geri gönderebilir."],
["TBMM’nin çıkardığı kanunların Anayasa’ya uygunluğunu hangi kurum denetler?","Anayasa Mahkemesi",["Yargıtay","Danıştay","Uyuşmazlık Mahkemesi"],"Anayasa Mahkemesi kanun ve kararnameleri denetler."],
["Aşağıdakilerden hangisi Cumhurbaşkanlığı Hükümet Sistemi’nin özelliğidir?","TBMM ve Cumhurbaşkanlığı seçimlerinin 5 yılda bir aynı gün yapılması",["Gensoru ile hükümetin düşürülebilmesi","Yürütmenin çift başlı olması","Cumhurbaşkanının TBMM tarafından seçilmesi"],"Cumhurbaşkanı doğrudan halk tarafından seçilir."],
["I. Meşrutiyet’te (1876) hangi gelişme yaşanmıştır?","İlk anayasa ilan edilmiş ve Meclis-i Mebusan açılmıştır",["Cumhuriyet ilan edilmiştir","Kadınlara milletvekili seçme hakkı verilmiştir","TBMM açılmıştır"],"Halk ilk kez kısıtlı da olsa yönetime katılmıştır."],
["Türkiye’de kalıcı çok partili hayata geçiş hangi gelişmelerle gerçekleşmiştir?","1945’te Millî Kalkınma Partisi’nin kurulması ve 1946 seçimleri",["1924’te Terakkiperver Cumhuriyet Fırkası’nın kurulması","1930’da Serbest Cumhuriyet Fırkası’nın kurulması","1923’te Cumhuriyet Halk Fırkası’nın kurulması"],"Önceki denemeler kapatılmıştı."],
["15 Temmuz 2016 ile ilgili hangisi doğrudur?","Millet demokrasiye sahip çıkmış, bu gün Demokrasi ve Millî Birlik Günü ilan edilmiştir",["Darbe başarıyla sonuçlanmıştır","Meclis feshedilip anayasa askıya alınmıştır","Bu gün Cumhuriyet Bayramı kabul edilmiştir"],"Millet sokaklara çıkarak girişimi engellemiştir."]];
const ORD=[
["Türk demokrasisinin gelişimi",["TBMM’nin açılışı (1920)","Cumhuriyetin ilanı (1923)","Kalıcı çok partili hayata geçiş (1946)"]],
["Kadınlara tanınan siyasi haklar",["Belediye seçimlerine katılma (1930)","Köy muhtarı seçme ve seçilme (1933)","Milletvekili seçme ve seçilme (1934)"]],
["Osmanlı’da demokratikleşme adımları",["Sened-i İttifak (1808)","Tanzimat Fermanı (1839)","I. Meşrutiyet (1876)"]]];
const MAX=[16,20,20,20,24],NM=["Demokratik mi, Hukuk mu?","Doğru / Yanlış","Meclis Sandığı","Çoktan Seçmeli","Sıralama"];
let sec=-1,score=0,me={},sc=[],W=[],rev=null,sent=0;
const S={p:{},s:null,items:sh(SORT.map((x,i)=>({i,t:x[0],c:x[1]})))};
const T={a:{},items:sh(TF.map((x,i)=>({i,t:x[0],v:x[1],e:x[2]})))};
const F={p:{},s:null,items:sh(FILL.map((x,i)=>({i,t:x[0],r:x[1]}))),bank:sh(BANK)};
const M={i:0,a:{},rows:[],qs:MCQ.map(q=>({q:q[0],r:q[1],o:sh([q[1],...q[2]]),e:q[3]}))};
const O={i:0,rows:[],e:0,st:ORD.map(s=>{let o=sh(s[1].map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();return{t:s[0],it:s[1],o}})};
const bar=(m,on,fn,l="Bölümü Tamamla →")=>`<div class="bar"><b>${m}</b><button class="nx" ${on?"":"disabled"} onclick="${fn}">${l}</button></div>`;
const esc=s=>String(s).replace(/</g,"&lt;");

function R(top){const y=scrollY;$("#sc").textContent=score;$("#st").textContent=sec<0?"Giriş":sec<5?`Bölüm ${sec+1} / 5`:"Sonuç";$("#pf").style.width=Math.max(0,sec)*20+"%";
$("#app").innerHTML=rev?revH():[startH,sortH,tfH,fillH,mcqH,ordH,endH][sec+1]();scrollTo(0,top?0:y);if(sec==5&&!rev&&!sent){sent=1;send()}}
function fin(rows,e){score+=e;sc[sec]=e;rows.forEach(r=>{if(!r.ok)W.push(r)});rev={rows,e};R(1)}
function go(){rev=null;sec++;R(1)}
function revH(){return `<h2>Bölüm ${sec+1} sonucu: +${rev.e} / ${MAX[sec]} puan</h2><p class="d">Yanlışlarını incele, doğrusunu öğren.</p>${rev.rows.map(r=>`<div class="rv ${r.ok?"ok":"bad"}">${r.ok?"✓":"✗"} ${r.t}${r.ok?"":`<div class="note">${r.n}</div>`}</div>`).join("")}${bar("",1,"go()",sec==4?"Sonucu Gör 🏁":"Sonraki Bölüm →")}`}

function startH(){return `<h2>Yaşayan Demokrasimiz Quizi</h2><p class="d">Önce demokrasi konularını tekrar et, sonra quizi çöz. Toplam 100 puan.</p><input id="ia" placeholder="Ad Soyad"><input id="is" placeholder="Sınıf (örn. 7/A)"><input id="in" placeholder="Okul numarası (bilmiyorsan boş bırak)">${bar("",1,"st0()","Başla →")}`}
function st0(){const a=$("#ia").value.trim(),s=$("#is").value.trim();if(!a||!s){alert("Ad soyad ve sınıfı yaz.");return}me={a,s,n:$("#in").value.trim()||"-",k:URL_KOD};sec=0;R(1)}

function sortH(){const un=S.items.filter(x=>!S.p[x.i]),bk=c=>S.items.filter(x=>S.p[x.i]==c).map(x=>`<span class="chip">${x.t} <b onclick="event.stopPropagation();delete S.p[${x.i}];R()">×</b></span>`).join("")||"<small>Buraya dokun</small>";
return `<h2>Bölüm 1: Demokratik mi, Hukuk mu?</h2><p class="d">Bir özellik seç, sonra doğru sepete dokun.</p><div class="pool">${un.map(x=>`<div class="pill ${S.s===x.i?"on":""}" onclick="S.s=${x.i};R()">${x.t}</div>`).join("")||"✓ Hepsi yerleşti"}</div><div class="g2">${SB.map(b=>`<div class="bk" onclick="drop('${b[0]}')"><h3>${b[1]}</h3>${bk(b[0])}</div>`).join("")}</div>${bar(`Kalan: ${un.length}`,!un.length,"doneS()")}`}
function drop(c){if(S.s==null)return;S.p[S.s]=c;S.s=null;R()}
function doneS(){const rows=S.items.map(x=>({ok:S.p[x.i]==x.c,t:x.t,n:`Doğrusu: ${SB.find(b=>b[0]==x.c)[1]}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function tfH(){const n=Object.keys(T.a).length;return `<h2>Bölüm 2: Doğru mu, Yanlış mı?</h2><p class="d">10 önermeyi işaretle.</p>${T.items.map(x=>`<div class="row"><span>${x.t}</span><span style="display:flex;gap:8px"><button class="b2 ${T.a[x.i]===true?"t":""}" onclick="T.a[${x.i}]=true;R()">✓ DOĞRU</button><button class="b2 ${T.a[x.i]===false?"f":""}" onclick="T.a[${x.i}]=false;R()">✕ YANLIŞ</button></span></div>`).join("")}${bar(`Cevaplanan: ${n} / 10`,n==10,"doneT()")}`}
function doneT(){const rows=T.items.map(x=>({ok:T.a[x.i]===x.v,t:x.t,n:`Senin cevabın: ${T.a[x.i]?"Doğru":"Yanlış"}. Doğrusu: <b>${x.v?"Doğru":"Yanlış"}</b>. ${x.e}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function fillH(){const u=Object.values(F.p),n=u.length;return `<h2>Bölüm 3: Meclis Sandığı</h2><p class="d">Bir kelime seç, sonra boşluğa dokun. Dolu boşluğa dokunursan kelime geri alınır.</p>${F.items.map(x=>`<div class="row" style="display:block;line-height:2.1">${x.t.replace("{}",`<span class="slot" onclick="setSlot(${x.i})">${F.p[x.i]||"dokun"}</span>`)}</div>`).join("")}<div class="bank">${F.bank.map(w=>`<div class="w ${F.s===w?"on":""} ${u.includes(w)?"pl":""}" onclick="pickW(${F.bank.indexOf(w)})">${w}</div>`).join("")}</div>${bar(`Doldurulan: ${n} / 10`,n==10,"doneF()")}`}
function pickW(k){const w=F.bank[k];F.s=F.s===w?null:w;R()}
function setSlot(i){if(F.s){F.p[i]=F.s;F.s=null}else delete F.p[i];R()}
function doneF(){const rows=F.items.map(x=>({ok:F.p[x.i]==x.r,t:x.t.replace("{}",`<u>${F.p[x.i]}</u>`),n:`Doğrusu: <b>${x.r}</b>`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function mcqH(){const q=M.qs[M.i],a=M.a[M.i],l=M.i==M.qs.length-1;return `<h2>Bölüm 4: Çoktan Seçmeli</h2><p class="d">Soru ${M.i+1} / ${M.qs.length}</p><p style="font-weight:700;margin-bottom:12px">${q.q}</p>${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" onclick="M.a[M.i]=${i};R()">${"ABCD"[i]}) ${o}</button>`).join("")}${bar(a===undefined?"Bir seçenek işaretle":"Seçim yapıldı",a!==undefined,"nextM()",l?"Bölümü Bitir →":"Sonraki Soru →")}`}
function nextM(){const q=M.qs[M.i],y=q.o[M.a[M.i]];M.rows.push({ok:y==q.r,t:q.q,n:`Senin cevabın: ${y}<br>Doğru cevap: <b>${q.r}</b><br>${q.e}`});if(M.i<M.qs.length-1){M.i++;R(1)}else fin(M.rows,M.rows.filter(r=>r.ok).length*2)}

function ordH(){const s=O.st[O.i];return `<h2>Bölüm 5: Sıralama</h2><p class="d">${s.t} (${O.i+1} / 3) — okları kullanarak doğru sıraya diz.</p>${s.o.map((v,k)=>`<div class="row"><span>${s.it[v]}</span><span style="display:flex;gap:6px"><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button><button class="b2" ${k<2?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")}${bar("",1,"okO()",O.i<2?"Sırayı Onayla →":"Quizi Bitir 🏁")}`}
function mv(k,d){const o=O.st[O.i].o;[o[k],o[k+d]]=[o[k+d],o[k]];R()}
function okO(){const s=O.st[O.i],ok=s.o.every((v,k)=>v==k);O.rows.push({ok,t:s.t,n:"Doğru sıra: "+s.it.map((x,k)=>`${k+1}) ${x}`).join(" → ")});if(ok)O.e+=8;if(O.i<2){O.i++;R(1)}else fin(O.rows,O.e)}

function endH(){const t=score>=85?["🏛️","Anayasa Mahkemesi Üyesi"]:score>=65?["🗳️","TBMM Milletvekili"]:["📜","Genç Vatandaş"];
return `<div style="text-align:center"><div style="font-size:3.5rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${esc(me.a)} • ${esc(me.s)}</p><div class="big">${score} / 100</div></div>
<h3 style="margin:14px 0 8px">Bölüm puanların</h3>${NM.map((n,i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${sc[i]} / ${MAX[i]}</b></div>`).join("")}
<h3 style="margin:14px 0 8px">Tekrar etmen gerekenler (${W.length})</h3>${W.length?W.map(r=>`<div class="rv bad">${r.t}<div class="note">${r.n}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
<p id="msg" class="note" style="margin:12px 0;display:none;font-weight:700"></p>${bar("",1,"location.reload()","Yeniden Başla")}`}
async function send(){
  if(!me.k||!SCRIPT_URL)return;
  const m=$("#msg");
  if(m){m.style.display="block";m.style.color="#64748b";m.textContent="⏳ Sonuçların öğretmenine gönderiliyor…"}
