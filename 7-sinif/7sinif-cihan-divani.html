<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cihan Divanı | 7. Sınıf Ortak Mirasımız</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0f2a5c;--ink:#12284d;--panel:#f3f8fd;--soft:#e3eef8;--line:#bcd3e6;--a:#1d4ea0;--t:#13a39b;--r:#d2483c;--g:#e3a920}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 'Nunito',system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 5px,transparent 6px),radial-gradient(circle at 0 0,rgba(19,163,155,.14) 0 9px,transparent 10px),radial-gradient(circle at 100% 100%,rgba(19,163,155,.14) 0 9px,transparent 10px);background-size:44px 44px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--g);outline-offset:2px}
h1,h2,h3,.ser{font-family:'Alegreya',Georgia,serif}
main{max-width:760px;margin:0 auto;padding:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-weight:800;padding:6px 4px}
.hud a{color:#fff;text-decoration:none}
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.era{background:rgba(255,255,255,.12);color:#cfe0f5;border-radius:12px;padding:6px 4px;text-align:center;font-size:.8rem;font-weight:800}
.era.on{background:var(--g);color:#2b1d00}.era.dn{background:var(--t);color:#fff}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.met{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 8px;color:#fff;font-size:.78rem;font-weight:800}
.met i{display:block;height:8px;margin-top:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.met b{display:block;height:100%;background:var(--t);transition:width .5s}.met.lo b{background:var(--r)}
.card{background:var(--panel);border-radius:22px;padding:18px;border:3px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.card h2{margin:0 0 4px;font-size:1.6rem;line-height:1.1}.card h1{margin:0 0 6px;font-size:2.1rem;line-height:1.05}
.tm{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 12px}.tm i{display:block;height:100%;width:100%;background:var(--g);transition:width 1s linear}
.q{font-weight:700;font-size:1.06rem;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--a);background:var(--soft)}
.opt.ok{background:var(--t);border-color:var(--t);color:#fff}.opt.md{background:var(--g);border-color:var(--g)}.opt.no{background:var(--r);border-color:var(--r);color:#fff}.opt:disabled{cursor:default}
.res{border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}.res.ok{background:#d6f3ef}.res.md{background:#fbefc9}.res.no{background:#fbdad6}
.res small{display:block;font-weight:600;margin-top:4px}
.btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:12px 24px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3);margin-top:12px}
.form{display:grid;gap:8px;margin:12px 0}.form input{padding:12px;border-radius:12px;border:2px solid var(--line);font:inherit}
.big{font-family:'Alegreya',Georgia,serif;font-size:2.4rem;font-weight:800;color:var(--a)}
.row{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:700}
.miss{background:#fbdad6;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.92rem}
@media(max-width:520px){.mets{grid-template-columns:1fr 1fr}.era{font-size:.7rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyXiHI9AyNIRxZ92vaF0_Snv8C-HHELeXgYkrvfixjLCyYsMf6ElGw8AkxmrDDhs3LY/exec";
const OYUN="7. Sınıf 3. Öğrenme Alanı Oyunu";
const LINK_KOD=(function(){const p=new URLSearchParams(location.search);let k=(p.get('kod')||'').trim();if(!k){for(const x of p.keys()){if(x!=='kod'){k=x.trim();break}}}return k})();
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const E=["Yükseliş","Dünya Değişiyor","Yenileşme","Medeniyet"],EI=["🏰","🌊","⚙️","🕌"],MT=[["⚖️","Adalet"],["💰","Hazine"],["⚔️","Ordu"],["🏘️","Halk"]],TIME=30;
// o: [karar, kalite(2 en iyi/1 kısmen/0 hatalı), [adalet,hazine,ordu,halk], geri bildirim]
const C=[
{e:0,t:"Yeni fethedilen şehir",q:"Rumeli’de fethettiğin şehirde düzen kırılgan. Kalıcı hâkimiyeti nasıl kurarsın?",i:"İskân politikası: Anadolu’dan getirilen Türk-Müslüman topluluklar yerleştirilir; cami, köprü, medrese, han ve yollar yapılır.",o:[["Anadolu’dan topluluklar yerleştirip cami, köprü ve han yaptırırım",2,[3,4,3,6],""],["Yalnızca ağır vergi koyarım",1,[-6,5,0,-6],"Vergi tek başına kalıcı düzen kurmaz."],["Orduyu çekip şehri kendi hâline bırakırım",0,[-4,-3,-8,-6],"Kalıcı hâkimiyet ve güvenlik sağlanamaz."]]},
{e:0,t:"Gönülleri kazanmak",q:"Yeni halkın çoğu gayrimüslim ve yönetimden çekiniyor. Ne yaparsın?",i:"İstimalet politikası: halkın can, mal ve inanç güvenliği korunur; derviş ve abdallar gönül kazanır. Saroz da “ağır vergi ve adaletsizlikten” kurtulmak için kaleyi teslim etmişti.",o:[["Can, mal ve inanç güvenliği verir, dervişlerle gönül kazanırım",2,[8,2,0,8],""],["Askerle sıkı gözetim kurarım",1,[-3,0,4,-5],"Düzen sağlar ama gönül kazanmaz."],["İnançlarını değiştirmeye zorlarım",0,[-10,-3,-3,-12],"İstimalet baskıyı değil hoşgörüyü esas alır."]]},
{e:0,t:"İstanbul için hazırlık",q:"II. Mehmed olarak İstanbul’u almak istiyorsun. Hazırlığın nasıl olmalı?",i:"Sınır güvenliği diplomatik antlaşmalarla sağlandı, Rumeli Hisarı yapıldı, büyük toplar döküldü; kara ve denizden eş zamanlı saldırı planlandı.",o:[["Diplomasiyle sınırları güvenceye alır, Rumeli Hisarı’nı ve büyük topları hazırlarım",2,[2,-3,8,2],""],["Hemen, hazırlıksız saldırırım",0,[-2,-4,-8,-3],"Surlar ve zincir aşılamaz; hazırlık şarttır."],["Sadece karadan kuşatırım",1,[0,-2,2,0],"Donanma olmadan şehir denizden beslenmeye devam eder."]]},
{e:0,t:"Haliç’teki zincir",q:"Kuşatma sürüyor ama Haliç girişindeki zincir donanmayı durduruyor, moral düşüyor. Kararın?",i:"Gemiler Galata surları önünden kızaklarla karadan yürütülerek Haliç’e indirildi; Doğu Roma savunması zora girdi ve 29 Mayıs’ta fetih gerçekleşti.",o:[["Gemileri karadan kızaklarla Haliç’e indiririm",2,[0,-2,10,6],""],["Kuşatmayı bırakırım",0,[-4,-4,-10,-8],"Fetih fırsatı kaçar, Doğu Roma güçlenir."],["Zinciri yine donanmayla zorlarım",1,[0,-3,-2,-3],"İlk deneme başarısız olmuştu."]]},
{e:0,t:"Ayasofya’da ilk söz",q:"İstanbul alındı. Ayasofya’da toplanan patrik ve halk korku içinde. Ne söylersin?",i:"II. Mehmed halka can ve hürriyet güvencesi verdi, askerlerin kötülük yapmaması için emir çıkardı. İstanbul başkent oldu.",o:[["“Can ve hürriyetiniz güvende” der, askere yağmayı yasaklarım",2,[10,2,0,10],""],["Sessizce girer, açıklama yapmam",1,[-2,0,0,-4],"Korku sürer; güvence vermek gerekir."],["Şehri yağmaya açarım",0,[-12,3,-4,-12],"İstanbul’un Türk-İslam kenti olması adalet ister."]]},
{e:0,t:"Güney sınırı ve Baharat Yolu",q:"Yavuz Sultan Selim olarak Çaldıran’ı kazandın. Memlükler Baharat Yolu’nu ve kutsal şehirleri elinde tutuyor. Ne yaparsın?",i:"Mercidabık ve Ridaniye zaferleriyle Suriye, Mısır, Mekke ve Medine alındı; halifelik ve kutsal emanetler İstanbul’a geçti, Baharat Yolu denetime girdi.",o:[["Memlüklere sefer açar, Mısır’ı alırım",2,[2,10,6,4],""],["Baharat Yolu’nu Avrupalılara bırakırım",0,[0,-8,-2,-3],"Doğu–Batı ticareti elden çıkar."],["Yalnızca Balkanlar’a yönelirim",1,[0,-1,0,0],"Güney sınırı tehdit altında kalır."]]},
{e:0,t:"Preveze",q:"Kanuni döneminde İspanya, Portekiz, Venedik ve Papalık büyük bir Haçlı donanması kurdu. Preveze açıklarında ne yaparsın?",i:"Barbaros Hayreddin Paşa donanmayı hilal şeklinde dizdi, kadırgaların hızını kullandı ve 1538’de Preveze’yi kazandı; Akdeniz’de üstünlük kuruldu.",o:[["Barbaros’a komuta verir, hilal düzeninde hızlı kadırgalarla saldırırım",2,[2,6,10,6],""],["Ağır gemilerle yüz yüze çarpışırım",1,[0,-2,-3,0],"Haçlı gemileri büyük ve ağırdı; Osmanlı’nın üstünlüğü hızdı."],["Donanmayı limanda bekletirim",0,[-2,-6,-8,-4],"Akdeniz hâkimiyeti kaybedilir."]]},
{e:1,t:"Hazine eriyor",q:"XVI. yüzyıl sonrasında İpek ve Baharat Yolları’ndan gelen gelirler azalıyor. Asıl neden nedir?",i:"Portekiz ve İspanya’nın yeni deniz yolları bulmasıyla Osmanlı’nın denetlediği yollar önemini kaybetti; liman şehirleri ve gelirler geriledi.",o:[["Avrupalıların yeni ticaret yolları bulması",2,[0,2,0,0],""],["Fetihlerin çok artması",0,[-2,-8,-2,-3],"Gelir kaybı yeni deniz yollarındandır."],["Halkın vergi vermemesi",0,[-2,-8,-2,-3],"Asıl neden ticaret yollarının değişmesidir."]]},
{e:1,t:"Ucuz Avrupa malları",q:"Sanayi İnkılabı sonrası Avrupa’dan ucuz mallar geliyor, esnaf atölyelerini kapatıyor. Çaren?",i:"Osmanlı sanayi mektepleri açtı; tekstil, cam, çini, kâğıt ve fişek fabrikaları kurdu. Ancak sermaye, teknoloji ve ulaşım eksikliği başarıyı sınırladı.",o:[["Sanayi mektepleri açar, fabrikalar kurdururum",2,[2,4,2,4],""],["Hiçbir önlem almadan beklerim",0,[-4,-8,-3,-8],"Yerli üretim ve işsizlik sorunu büyür."],["Sadece vergileri artırırım",0,[-8,-3,0,-10],"Esnaf daha da zorlanır."]]},
{e:1,t:"Avrupa’da mezhep savaşları",q:"Reform hareketleri Avrupa’yı böldü, mezhep savaşları çıktı. Osmanlı’da farklı inançlara nasıl davranırsın?",i:"Osmanlı’da gayrimüslimler inançlarını özgürce yaşadı, eğitimlerini kendi kurumlarında sürdürdü. Avrupa’nın bölünmesi yeni bir Haçlı birliğini bir süre engelledi.",o:[["İnançlarını özgürce yaşamalarına ve kendi okullarına izin veririm",2,[8,0,2,8],""],["Avrupa’daki gibi mezhep baskısı kurarım",0,[-10,-2,-4,-10],"Osmanlı barış içinde bir arada yaşamayı benimsemiştir."],["Herkesi aynı okula zorlarım",0,[-6,-1,0,-8],"Kendi kurumlarında eğitim hakkı korunmuştur."]]},
{e:2,t:"Lale Devri",q:"III. Ahmed ve Damat İbrahim Paşa dönemindesin. İbrahim Müteferrika matbaa kurmak istiyor. Kararın?",i:"Lale Devri’nde Avrupa örnek alındı: matbaa kuruldu, Tulumbacılar Ocağı (ilk itfaiye) oluşturuldu, imar çalışmaları hızlandı; bazı çevreler yeniliğe karşı çıktı.",o:[["Matbaaya destek verir, yeniliklere yer açarım",2,[2,-2,0,6],""],["Eğlenceye odaklanıp reformları ertelerim",1,[-2,-4,-2,2],"Yenileşme için ciddi çaba gerekir."],["Her yeniliği yasaklarım",0,[-3,-3,-4,-6],"Yeniliklerin önü kesilir."]]},
{e:2,t:"Nizam-ı Cedid",q:"III. Selim olarak Yeniçeri Ocağı’nın disiplin kaybından ve Avrupa karşısındaki gerilemeden endişelisin. Ne yaparsın?",i:"Avrupa usulü Nizam-ı Cedid Ordusu kuruldu, Mühendishane açıldı, İrad-ı Cedid Hazinesi oluşturuldu, Londra, Paris, Berlin ve Viyana’da daimî elçilikler açıldı.",o:[["Nizam-ı Cedid Ordusu, yeni okullar ve daimî elçilikler kurarım",2,[2,-4,10,3],""],["Sadece birkaç yeni gemi alırım",1,[0,-3,3,0],"Köklü reform olmadan gerileme sürer."],["Hiçbir şeyi değiştirmem",0,[-3,-4,-8,-4],"Devlet Avrupa karşısında zayıflar."]]},
{e:2,t:"Vaka-i Hayriye",q:"II. Mahmud olarak yeniçeriler sürekli isyan ediyor. En köklü çözüm hangisi?",i:"1826’da Yeniçeri Ocağı kaldırıldı (Vaka-i Hayriye); yerine Asâkir-i Mansûre-i Muhammediye kuruldu. Divan kaldırılıp nazırlıklar kuruldu.",o:[["Yeniçeri Ocağı’nı kaldırıp yeni, düzenli bir ordu kurarım",2,[3,-3,10,3],""],["Yeniçerilere daha çok maaş veririm",1,[-2,-8,-3,0],"Sorun disiplinsizliktir; maaş çözmez."],["Orduyu tamamen dağıtırım",0,[-2,-4,-10,-4],"Savunmasız kalınır."]]},
{e:2,t:"Tanzimat Fermanı",q:"Avrupa baskısı artıyor, milliyetçilik azınlıkları etkiliyor. Devleti bir arada tutmak için?",i:"1839’da Tanzimat Fermanı (Gülhane Hatt-ı Hümayunu) ile herkesin can ve mal güvenliği güvence altına alındı; 1856 Islahat Fermanı ile gayrimüslimlere yeni haklar tanındı.",o:[["Can ve mal güvenliğini herkese güvence eden ferman ilan ederim",2,[10,0,2,6],""],["İsyancıları sert cezalandırıp hak tanımam",0,[-8,-2,2,-10],"Milliyetçi isyanlar daha da büyür."],["Hiçbir adım atmam",0,[-5,-3,-4,-6],"Dağılma süreci hızlanır."]]},
{e:3,t:"Mahkemede adalet",q:"“Adalet mülkün temelidir.” Kadı olarak kararlarını nasıl verirsin?",i:"Osmanlı’da hukuk Şer’i ve Örfi hukuktan oluşurdu; kadılar Müslüman ve gayrimüslim tebaaya inançlarına göre adaletle davranırdı.",o:[["Herkese inançlarına göre adaletle davranırım",2,[10,0,0,8],""],["Zenginlere ayrıcalık tanırım",0,[-10,2,0,-8],"Adalet herkese eşit uygulanmalıdır."],["Yalnızca gelenek ve güce bakarım",0,[-6,0,0,-4],"Kanun ve şeriata uygun karar gerekir."]]},
{e:3,t:"Vakıf kurmak",q:"Varlıklı bir kişi malını topluma kazandırmak istiyor. En kalıcı yol nedir?",i:"Vakıf: mal süresiz bağışlanır; satılamaz, devredilemez, miras bırakılamaz. Eğitim, sağlık ve sosyal hizmetler din, dil, ırk ayrımı olmadan sunulur.",o:[["Vakıf kurup medrese, aşevi ve çeşme yaptırırım",2,[6,3,0,10],""],["Malı mirasçılara bırakırım",1,[0,0,0,0],"Kişisel olarak doğru ama toplum için kalıcı yarar sağlamaz."],["Satıp parayı saklarım",0,[-4,-3,0,-6],"Toplum yararı sağlanmaz."]]},
{e:3,t:"Ahi esnafı",q:"Çarşıda esnaf eğitimsiz ve dürüstlük sorunu var. Ne yaparsın?",i:"Ahi teşkilatı esnafı meslek ve ahlak eğitimiyle yetiştirdi; kazançlarını yoksullarla paylaştılar. Dürüstlük, cömertlik ve kusur görmemek temel değerlerdi.",o:[["Ahilik ahlakını ve mesleki eğitimi yaygınlaştırırım",2,[6,4,0,8],""],["Fiyatları tamamen serbest bırakırım",0,[-6,2,0,-6],"Dürüstlük ve dayanışma zedelenir."],["Sadece ceza veririm",1,[2,0,0,-4],"Eğitim ve ahlak olmadan kalıcı çözüm olmaz."]]}
];
const S={i:0,h:3,m:[50,50,50,50],pt:[0,0,0,0],mx:[0,0,0,0],miss:[],q0:0,me:null,sent:false,t:TIME,tk:null,ans:false};
C.forEach(c=>S.mx[c.e]+=2);
const N=C.length,pct=()=>Math.round(S.pt.reduce((a,b)=>a+b,0)/(2*N)*100);
function hud(){$('#hh').textContent=`❤️`.repeat(S.h)+'🖤'.repeat(3-S.h)+`  •  ★ ${pct()}`;
$('#top').innerHTML=`<div class="eras">${E.map((n,k)=>{const cur=S.i<N?C[S.i].e:9;return `<div class="era ${k==cur?'on':k<cur?'dn':''}">${EI[k]} ${n}</div>`}).join('')}</div><div class="mets">${MT.map((x,k)=>`<div class="met ${S.m[k]<25?'lo':''}">${x[0]} ${x[1]} ${S.m[k]}<i><b style="width:${S.m[k]}%"></b></i></div>`).join('')}</div>`}
function start(){hud();$('#app').innerHTML=`<div class="card"><h1>Cihan Divanı</h1><p class="q">Divan-ı Hümayun’un veziriazamısın! Osmanlı’nın kuruluşundan medeniyetine uzanan ${N} kritik karar seni bekliyor. Her karar için ${TIME} saniyen var. Hatalı karar bir canını götürür; Adalet, Hazine, Ordu ve Halk göstergelerinden biri sıfıra inerse isyan çıkar. ❤️ Üç canın var.</p>${LINK_KOD?`<div class="form"><input id="fa" placeholder="Ad Soyad" autocomplete="name"><input id="fs" placeholder="Sınıf (ör. 7-A)"><input id="fn" placeholder="Okul numarası (bilmiyorsan boş bırak)" inputmode="numeric"></div><div id="fh" style="font-weight:800;color:var(--r)"></div>`:''}<button class="btn" id="go">Divana Gir</button></div>`;
$('#go').onclick=()=>{if(LINK_KOD){const a=$('#fa').value.trim(),s=$('#fs').value.trim();if(!a||!s){$('#fh').textContent='Ad soyad ve sınıf gerekli';return}S.me={a,s,n:$('#fn').value.trim()||'-'}}play()}}
function play(){S.ans=false;S.t=TIME;hud();const c=C[S.i];c.s=c.s||sh(c.o);
$('#app').innerHTML=`<div class="card"><small style="font-weight:800">${EI[c.e]} ${E[c.e]} • Karar ${S.i+1} / ${N}</small><h2>${c.t}</h2><div class="tm"><i id="tb"></i></div><p class="q">${c.q}</p>${c.s.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}<div id="rs"></div></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
clearInterval(S.tk);S.tk=setInterval(()=>{S.t--;const tb=$('#tb');if(tb)tb.style.width=S.t/TIME*100+'%';if(S.t<=0)pick(-1)},1000)}
function pick(k){if(S.ans)return;S.ans=true;clearInterval(S.tk);const c=C[S.i],best=c.s.find(o=>o[1]==2),o=k<0?null:c.s[k],q=o?o[1]:0;
S.pt[c.e]+=q;let msg='',lost=0;
if(q==0){S.h--;lost++;S.q0++;S.miss.push(c.t)}else if(q==1)S.miss.push(c.t);
if(o)o[2].forEach((d,j)=>{S.m[j]=Math.max(0,Math.min(100,S.m[j]+d))});
S.m.forEach((v,j)=>{if(v<=0){S.m[j]=30;S.h--;lost++;msg+=`<small>⚠️ ${MT[j][1]} sıfıra indi, isyan çıktı! ❤️ kaybettin.</small>`}});
S.h=Math.max(0,S.h);hud();
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(c.s[j]===best)b.classList.add('ok');else if(j===k)b.classList.add(q==1?'md':'no')});
const cls=q==2?'ok':q==1?'md':'no',head=k<0?'⏰ Süre doldu!':q==2?'✅ Mükemmel karar!':q==1?'🟡 Kısmen doğru.':'❌ Hatalı karar.';
const fb=o&&q<2?`<small>${o[3]}</small>`:k<0?'<small>Zamanında karar vermek de bir vezirin görevidir.</small>':'';
const over=S.h<=0,last=S.i>=N-1;
$('#rs').innerHTML=`<div class="res ${cls}">${head}${fb}${q<2?`<small>En iyi karar: ${best[0]}.</small>`:''}<small>📘 ${c.i}</small>${msg}</div><button class="btn" id="nx">${over?'Sonucu gör':last?'Divanı kapat 🏁':'Sıradaki karar'}</button>`;
$('#nx').onclick=()=>{if(over||last)end(over);else{S.i++;play()}}}
function end(over){clearInterval(S.tk);S.i=N;hud();const p=pct(),t=p>=85?['👑','Cihan Devleti Veziriazamı']:p>=60?['🏛️','Divan-ı Hümayun Üyesi']:['📜','Genç Kâtip'];
$('#app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">${over?'🕯️':t[0]}</div><h2>${over?'Divan dağıldı… ama ders aldın!':t[1]}</h2>${S.me?`<p>${S.me.a} • ${S.me.s}</p>`:''}<div class="big">${p} / 100</div></div>
<div class="card" style="margin-top:12px"><h3>Dönem puanların</h3>${E.map((n,k)=>`<div class="row"><span>${EI[k]} ${n}</span><b>${S.pt[k]} / ${S.mx[k]}</b></div>`).join('')}<h3>Tekrar etmen gerekenler (${S.miss.length})</h3>${S.miss.length?S.miss.map(m=>`<div class="miss">${m}</div>`).join(''):'<p>Hepsi kusursuz, harika! 🎉</p>'}<p id="msg" style="font-weight:800"></p><button class="btn" onclick="location.reload()">Yeniden oyna</button></div>`;sendRes()}
async function sendRes(){const m=$('#msg');if(!LINK_KOD||!SCRIPT_URL||!S.me||S.sent)return;m.textContent='⏳ Sonuçların öğretmenine gönderiliyor…';
const body={kod:LINK_KOD,okulKodu:LINK_KOD,oyun:OYUN,ad:S.me.a,sinif:S.me.s,no:S.me.n,puan:pct(),b:S.pt,yanlis:S.miss.length,liste:E.map((n,k)=>n+': '+S.pt[k]+'/'+S.mx[k]).join(' | ')+(S.miss.length?' || Tekrar: '+S.miss.join(', '):'')};
try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});S.sent=true;m.textContent='✓ Sonuçların öğretmenine gönderildi.'}catch(e){m.innerHTML='⚠️ Gönderilemedi. <button class="btn" id="rt">Tekrar dene</button>';$('#rt').onclick=sendRes}}
start();
</script></body></html>
