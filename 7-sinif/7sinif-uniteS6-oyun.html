<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gelecek Laboratuvarı | 7. Sınıf 6. Öğrenme Alanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef8;--card:#fbfdff;--ink:#1b2a4a;--red:#6d3fd6;--gold:#f2a900;--teal:#0f8f86;--line:#c9d6ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.brand,.bigno{font-family:'Bricolage Grotesque',Nunito,system-ui,sans-serif}
.hz{height:12px;background:repeating-linear-gradient(-45deg,var(--gold) 0 14px,var(--ink) 14px 28px)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--ink);color:#fff}
.brand{font-weight:800;font-size:1.1rem}.hud{background:var(--gold);color:var(--ink);font-weight:800;border-radius:99px;padding:2px 14px}
main{max-width:980px;margin:0 auto;padding:16px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;margin:8px 0;color:var(--ink)}
.hero p{max-width:60ch;margin:0 0 18px}
.line{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;position:relative}
.st{position:relative;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.st:hover{transform:translateY(-3px)}
.st .n{position:absolute;top:-12px;left:-8px;background:var(--red);color:#fff;font-weight:800;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink)}
.st .e{font-size:2rem}.st small{color:#4b5563;line-height:1.3}.stars{color:var(--gold);font-size:1.3rem;letter-spacing:2px;margin-top:6px;-webkit-text-stroke:1px var(--ink)}
.st.done{background:#e2f3ee;border-color:var(--teal);box-shadow:0 6px 0 var(--teal)}
.st.next{animation:pl 1.6s infinite}.st.next .e{display:inline-block;animation:sp 4s linear infinite}
@keyframes pl{50%{box-shadow:0 6px 0 var(--ink),0 0 0 8px rgba(242,169,0,.5)}}@keyframes sp{to{transform:rotate(360deg)}}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:20px;box-shadow:0 6px 0 var(--ink)}
.panel.c{text-align:center}.ic{font-size:3rem;line-height:1.1;color:var(--gold);-webkit-text-stroke:1px var(--ink)}
.panel h2{margin:4px 0}.panel>p{margin:0 0 12px}
.cards{display:grid;gap:10px;margin:14px 0;text-align:left}
.ic2{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.back{background:none;border:0;font-weight:800;margin:0 0 10px;padding:4px 0;text-decoration:underline}
.go{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 18px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.go.big{padding:12px 26px;font-size:1.05rem;margin-top:6px}
.meta{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}.meta #ms{color:var(--red)}
.rail{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 14px}.rail i{display:block;height:100%;background:var(--teal)}
.q{font-weight:800;font-size:1.15rem;margin:0 0 12px}.hint{color:#4b5563;font-size:.9rem;margin:0 0 8px}
.tile{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;text-align:left;box-shadow:0 3px 0 var(--ink);margin:0}
.tile.on{background:#fff0bd;border-color:var(--gold)}.tile.ok{background:#c8eee3;border-color:var(--teal);box-shadow:none;opacity:.85}
.tile.no{background:#ffd9de;border-color:var(--red);box-shadow:none}.tile:disabled{cursor:default}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:flex;flex-direction:column;gap:8px}
.opts,.pool{display:flex;flex-direction:column;gap:8px}.pool{flex-direction:row;flex-wrap:wrap}
.chain{margin:0 0 12px;padding:0;list-style:none;counter-reset:k;display:grid;gap:6px}
.chain li{counter-increment:k;background:#c8eee3;border:2px solid var(--teal);border-radius:10px;padding:6px 12px;font-weight:700}
.chain li:before{content:counter(k);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;margin-right:8px;font-size:.85rem}
.bx{text-align:center}.bx .big{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:22px 14px;font-size:1.25rem;font-weight:800;margin-bottom:12px}
.bn{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.bb{text-align:center;font-size:1.05rem}
.fb{min-height:44px;margin-top:12px;font-weight:700}.fb .go{margin-left:8px}
.row{display:flex;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px;margin:6px 0;text-align:left}.row b{color:var(--gold);-webkit-text-stroke:.7px var(--ink)}
.bigno{font-size:2.4rem;font-weight:800;color:var(--red)}
input{width:100%;padding:11px;border:2.5px solid var(--ink);border-radius:10px;font:inherit;margin-bottom:10px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.foot{text-align:center;margin:18px 0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:560px){.mt{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}}

const $=s=>document.querySelector(s),H=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

 match(t,box,bad,fin){let sel=null,left=t.p.length;const w=H('div','mt');

function home(){$('#tot').textContent=tot();

 $('#app').innerHTML=`<button class="back" onclick="home()">← Haritaya dön</button><div class="panel"><div class="meta"><span>${s.e} ${s.n} • Görev ${cur.ti+1}/${s.t.length}</span><span id="ms">Hata: ${cur.m}</span></div><div class="rail"><i style="width:${cur.ti/s.t.length*100}%"></i></div><p class="q">${t.q}</p><div id="box"></div></div>`;
 TK[t.k](t,$('#box'),()=>{cur.m++;$('#ms').textContent='Hata: '+cur.m},()=>{if(++cur.ti<s.t.length)task();else result()})}
function result(){const m=cur.m,i=cur.i,st=m<=1?3:m<=3?2:1;
 if(!S.done[i]||st>S.done[i])S.done[i]=st;S.miss[i]=S.miss[i]==null?m:Math.min(S.miss[i],m);S.sent=false;save();$('#tot').textContent=tot();
 const all=ST.every((_,k)=>S.done[k]);
 $('#app').innerHTML=`<div class="panel c"><div class="ic">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${st==3?'Kusursuz deney!':st==2?'Güzel iş!':'Deney tamamlandı!'}</h2><p>${m} hata yaptın. ${st<3?'Daha az hatayla tekrar deneyip yıldızını artırabilirsin.':''}</p><button class="go big" onclick="${all?'end()':'home()'}">${all?'Sertifikamı gör 🏅':'Haritaya dön'}</button>${st<3?`<br><button class="back" onclick="station(${i})">↻ Tekrar dene</button>`:''}</div>`}
function end(){const t=tot(),r=t>=13?['🏅','Gelecek Mimarı']:t>=9?['🧪','Genç Bilim İnsanı']:['🔬','Meraklı Araştırmacı'];
 $('#app').innerHTML=`<div class="panel c"><div class="ic">${r[0]}</div><h2>${r[1]}</h2><p>${esc(S.me.a)} • ${esc(S.me.s)}</p><div class="bigno">${t} / 15 ★</div>${ST.map((s,i)=>`<div class="row"><span>${s.e} ${s.n}</span><b>${'★'.repeat(S.done[i]||0)}</b></div>`).join('')}<p id="msg" class="hint"></p><button class="go big" onclick="home()">Haritaya dön</button></div>`;sendRes()}
async function sendRes(){const m=$('#msg');if(!m)return;if(!LINK_KOD||!SCRIPT_URL)return;
 if(S.sent){m.textContent='✓ Sonuçların öğretmenine gönderildi.';return}
 m.textContent='⏳ Sonuçların öğretmenine gönderiliyor…';
 const stars=ST.map((s,i)=>S.done[i]||0),T=stars.reduce((a,b)=>a+b,0);
 const body={kod:LINK_KOD,okulKodu:LINK_KOD,oyun:OYUN,ad:S.me.a,sinif:S.me.s,no:S.me.n||'-',puan:Math.round(T/(3*ST.length)*100),b:stars,yanlis:Object.values(S.miss||{}).reduce((a,b)=>a+b,0),liste:ST.map((s,i)=>s.n+': '+stars[i]+'★').join(' | ')};
 try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});S.sent=true;save();m.textContent='✓ Sonuçların öğretmenine gönderildi.'}
 catch(e){m.innerHTML='⚠️ Sonuç gönderilemedi. <button class="go" onclick="sendRes()">Tekrar dene</button>'}}
home();
</script></body></html>
