<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumhuriyet Nöbeti | 7. Sınıf Yaşayan Demokrasimiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0e3b43;--ink:#10262b;--panel:#f4faf9;--soft:#e0efed;--line:#b5d6d2;--a:#0e6b78;--t:#1b9a73;--r:#d2483c;--g:#e3a920}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 'Nunito',system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 5px,transparent 6px),radial-gradient(circle at 0 0,rgba(227,169,32,.14) 0 9px,transparent 10px),radial-gradient(circle at 100% 100%,rgba(227,169,32,.14) 0 9px,transparent 10px);background-size:44px 44px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--g);outline-offset:2px}
h1,h2,h3,.ser{font-family:'Alegreya',Georgia,serif}
main{max-width:760px;margin:0 auto;padding:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-weight:800;padding:6px 4px}
.hud a{color:#fff;text-decoration:none}
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.era{background:rgba(255,255,255,.12);color:#cfe0f5;border-radius:12px;padding:6px 4px;text-align:center;font-size:.8rem;font-weight:800}
.era.on{background:var(--g);color:#2b1d00}.era.dn{background:var(--t);color:#fff}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.met{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 8px;color:#fff;font-size:.78rem;font-weight:800}
.met i{display:block;height:8px;margin-top:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.met b{display:block;height:100%;background:var(--t);transition:width .5s}.met.lo b{background:var(--r)}
.card{background:var(--panel);border-radius:22px;padding:18px;border:3px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.card h2{margin:0 0 4px;font-size:1.6rem;line-height:1.1}.card h1{margin:0 0 6px;font-size:2.1rem;line-height:1.05}
.tm{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 12px}.tm i{display:block;height:100%;width:100%;background:var(--g);transition:width 1s linear}
.q{font-weight:700;font-size:1.06rem;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--a);background:var(--soft)}
.opt.ok{background:var(--t);border-color:var(--t);color:#fff}.opt.md{background:var(--g);border-color:var(--g)}.opt.no{background:var(--r);border-color:var(--r);color:#fff}.opt:disabled{cursor:default}
.res{border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}.res.ok{background:#d6f3ef}.res.md{background:#fbefc9}.res.no{background:#fbdad6}
.res small{display:block;font-weight:600;margin-top:4px}
.btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:12px 24px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3);margin-top:12px}
.form{display:grid;gap:8px;margin:12px 0}.form input{padding:12px;border-radius:12px;border:2px solid var(--line);font:inherit}
.big{font-family:'Alegreya',Georgia,serif;font-size:2.4rem;font-weight:800;color:var(--a)}
.row{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:700}
.miss{background:#fbdad6;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.92rem}
@media(max-width:520px){.mets{grid-template-columns:1fr 1fr}.era{font-size:.7rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyXiHI9AyNIRxZ92vaF0_Snv8C-HHELeXgYkrvfixjLCyYsMf6ElGw8AkxmrDDhs3LY/exec";
const OYUN="7. Sınıf 4. Öğrenme Alanı Oyunu: Cumhuriyet Nöbeti";
const LINK_KOD=(function(){const p=new URLSearchParams(location.search);let k=(p.get('kod')||'').trim();if(!k){for(const x of p.keys()){if(x!=='kod'){k=x.trim();break}}}return k})();
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const E=["Nitelikler","Yönetim","Gelişim","Sorunlar"],EI=["🏛️","⚖️","📜","🛡️"],MT=[["⚖️","Hukuk"],["🕊️","Özgürlük"],["🗳️","Katılım"],["🏘️","Refah"]],TIME=30;
// o: [karar, kalite(2 en iyi/1 kısmen/0 hatalı), [adalet,hazine,ordu,halk], geri bildirim]
const C=[{"e": 0, "t": "Herkes için etkinlik", "q": "Belediyenin bayram etkinliğine farklı köken ve dillerden vatandaşlar katılmak istiyor. Ne yaparsın?", "i": "Atatürk milliyetçiliği ırk, din, dil ve köken ayrımı gözetmez; vatandaşlık bağına dayanır. Türkiye Cumhuriyeti’ni kuran halka Türk milleti denir.", "o": [["Vatandaşlık bağıyla herkesi eşit karşılar, hepsini davet ederim", 2, [8, 6, 6, 2], ""], ["Katılımı daha sonraya ertelerim", 1, [-2, -3, -3, 0], "Ayrım olmasa da sorunu çözmez."], ["Yalnızca belirli kökenden olanlara izin veririm", 0, [-10, -8, -6, -4], "Atatürk milliyetçiliği ayrımcılığı reddeder."]]}, {"e": 0, "t": "Muhtarlık seçimi", "q": "Muhtarlık seçiminden önce bazı kişiler seçmenleri baskıyla yönlendirmeye çalışıyor. Ne yaparsın?", "i": "Demokratik devlette yöneticiler halkın özgür oylarıyla, belirli süreler için seçilir; oy serbest, eşit, gizli olmalı, sayım açık yapılmalıdır.", "o": [["Oyun serbest ve gizli kullanılmasını, sayımın açık yapılmasını sağlarım", 2, [6, 6, 10, 0], ""], ["Sadece güvendiğim kişilerin oy kullanmasına izin veririm", 0, [-8, -8, -10, 0], "Genel ve eşit oy ilkesine aykırıdır."], ["Baskı yapanları görmezden gelirim", 0, [-6, -8, -8, 0], "Serbest oy ilkesi zedelenir."]]}, {"e": 0, "t": "Mahalledeki inançlar", "q": "Mahallede farklı inançlardan insanlar bir arada yaşıyor. Biri komşusunun ibadetine karışmak istiyor. Ne yaparsın?", "i": "Laik devlet bütün inançlara eşit mesafededir; Anayasa Madde 24’e göre herkes vicdan, dinî inanç ve kanaat hürriyetine sahiptir. Hatay’da cami, kilise ve havra yan yana bulunur.", "o": [["Herkesin vicdan ve inanç hürriyetini güvence altına alırım", 2, [6, 10, 2, 2], ""], ["Hiç müdahale etmem", 1, [-3, -4, 0, 0], "Hak ihlaline göz yummak laik devlete uygun değildir."], ["Çoğunluğun inancını herkes için kural yaparım", 0, [-8, -12, -2, 0], "Laik devlet hiçbir dine ayrıcalık tanımaz."]]}, {"e": 0, "t": "Deprem sonrası", "q": "Bir depremden sonra birçok aile barınaksız kaldı. Ne yaparsın?", "i": "Sosyal devlet toplumun refahını artırmayı, sosyal adaleti sağlamayı amaçlar; afet dönemlerinde acil yardım ve yeniden inşa çalışmaları yapar (Anayasa Madde 5).", "o": [["Acil yardım ulaştırır ve yeniden inşa çalışması başlatırım", 2, [4, 2, 2, 12], ""], ["Sadece bazı mahallelere yardım ederim", 1, [-6, -2, -2, 4], "Sosyal adalet herkes içindir."], ["Herkes kendi başının çaresine baksın derim", 0, [-4, -2, -2, -12], "Sosyal devletin görevi ihtiyaç sahibine destek olmaktır."]]}, {"e": 0, "t": "Resmî araç", "q": "Resmî bir polis aracı yasak yere park etmiş. Ne yaparsın?", "i": "Hukuk devletinde yöneticiler dahil herkes kanunlar önünde eşittir; hiçbir kişi, zümre veya kurum kanunların üzerinde değildir.", "o": [["Diğer araçlar gibi para cezası keserim", 2, [12, 2, 2, 0], ""], ["Sadece sözlü uyarırım", 1, [-2, 0, 0, 0], "Kanun herkese aynı uygulanmalıdır."], ["Resmî araç olduğu için ceza kesmem", 0, [-12, -2, -2, 0], "Kanun üstünlüğü ilkesine aykırıdır."]]}, {"e": 1, "t": "Kanun teklifi", "q": "TBMM bir kanun çıkardı ama Cumhurbaşkanı kanunu uygun bulmuyor. Anayasal yol nedir?", "i": "Cumhurbaşkanı kanunu onaylayıp yayımlar veya veto yetkisini kullanarak yeniden görüşülmek üzere TBMM’ye geri gönderir.", "o": [["Kanunu yeniden görüşülmek üzere TBMM’ye geri gönderirim (veto)", 2, [6, 0, 6, 0], ""], ["Kanunu kendim iptal ederim", 0, [-10, -4, -4, 0], "İptal yetkisi Anayasa Mahkemesi’ndedir."], ["Kanunu Yargıtay’a gönderirim", 0, [-6, 0, -2, 0], "Yargıtay kanunları denetlemez."]]}, {"e": 1, "t": "Kanun Anayasa’ya uygun mu?", "q": "Çıkarılan bir kanunun Anayasa’ya uygunluğu tartışılıyor. Hangi kuruma başvurulur?", "i": "Anayasa Mahkemesi kanunların ve Cumhurbaşkanlığı kararnamelerinin Anayasa’ya uygunluğunu denetler; bireysel başvuruları da inceler.", "o": [["Anayasa Mahkemesi’ne", 2, [10, 4, 2, 0], ""], ["Yargıtay’a", 0, [-4, 0, 0, 0], "Yargıtay adli kararların son inceleme merciidir."], ["Danıştay’a", 0, [-4, 0, 0, 0], "Danıştay idari uyuşmazlıklara bakar."]]}, {"e": 1, "t": "Belediye uyuşmazlığı", "q": "Bir vatandaş, belediyenin kararına karşı hakkını aramak istiyor. Hangi yargı yoluna gider?", "i": "Vatandaş ile idare arasındaki uyuşmazlıklara idari mahkemeler bakar; en üst temyiz merciî Danıştay’dır. Yargı yolunun açıklığı hukuk devletinin özelliğidir.", "o": [["İdari yargıya (Danıştay çatısı altında) başvurur", 2, [10, 4, 2, 0], ""], ["Yargıtay’a başvurur", 0, [-4, 0, 0, 0], "Yargıtay adli davaların son merciidir."], ["TBMM Genel Kurulu’na başvurur", 0, [-6, 0, 0, 0], "Yargı işi mahkemelerin görevidir."]]}, {"e": 1, "t": "Güç tek elde mi?", "q": "Bir yönetici kararları hızlandırmak için yasama, yürütme ve yargı yetkilerini tek elde toplamak istiyor. Kararın?", "i": "Kuvvetler ayrılığı gücün tek elde toplanıp keyfileşmesini önler; organlar birbirini denetler. 1921’de savaş şartlarında kuvvetler birliği benimsenmişti.", "o": [["Yetkileri ayrı organlara verip fren-denge sağlarım", 2, [10, 6, 2, 0], ""], ["Sadece olağanüstü savaş şartlarında tek elde toplarım", 1, [2, -4, 0, 0], "1921’de uygulandı ama olağan dönemde keyfileşme riski vardır."], ["Hızlı karar için hepsini tek elde toplarım", 0, [-12, -8, -4, 0], "Güç tek elde toplanırsa keyfîleşme riski artar."]]}, {"e": 2, "t": "1876", "q": "Meşrutiyet dönemindesin. Halkın yönetime katılması için ne yaparsın?", "i": "I. Meşrutiyet’le ilk anayasa (Kanun-ı Esasi) ilan edildi, Meclis-i Mebusan açıldı; halk ilk kez kısıtlı da olsa yönetime katıldı.", "o": [["Kanun-ı Esasi’yi ilan edip Meclis-i Mebusan’ı açarım", 2, [6, 6, 10, 0], ""], ["Sadece ayanlarla anlaşırım", 1, [0, -2, -2, 0], "Sened-i İttifak (1808) ayanlarla yapılmıştı ama halkı kapsamıyordu."], ["Padişahın yetkisini sınırsız bırakırım", 0, [-8, -8, -8, 0], "Halk yönetime katılamaz."]]}, {"e": 2, "t": "23 Nisan 1920", "q": "Anadolu’da Millî Mücadele sürüyor. Yeni meclisin açılışında egemenlik kimde olmalı?", "i": "TBMM 23 Nisan 1920’de açıldı; Millî Mücadele’yi yönetip zafere ulaştırdığı için Gazi Meclis unvanını aldı. 1921 Anayasası: egemenlik kayıtsız şartsız milletindir.", "o": [["Egemenlik kayıtsız şartsız milletindir derim", 2, [6, 6, 12, 0], ""], ["Egemenliği hanedana bırakırım", 0, [-8, -8, -10, 0], "Millî egemenlik ilkesine aykırıdır."], ["İşgal güçlerinin görüşünü alırım", 0, [-8, -8, -8, -4], "Bağımsızlık ilkesine aykırıdır."]]}, {"e": 2, "t": "29 Ekim 1923", "q": "Cumhuriyetin ilanı için Meclis toplandı. Ne yaparsın?", "i": "29 Ekim 1923’te yönetim şekli cumhuriyet olarak belirlendi. Abdurrahman Şeref Bey: egemenlik sınırsız ve koşulsuz ulusundur, bu cumhuriyettir.", "o": [["Yönetim şeklini cumhuriyet olarak ilan ederim", 2, [8, 8, 8, 2], ""], ["Kararı daha sonraya ertelerim", 1, [0, 0, -2, 0], "Karar süreci gecikir."], ["Saltanatı sürdürürüm", 0, [-8, -8, -10, 0], "Millî egemenlik ilkesine aykırıdır."]]}, {"e": 2, "t": "Muhalefet gerekli mi?", "q": "Hükümetin denetlenmesi ve çoğulculuk için ne yapmalı?", "i": "1924’te Terakkiperver Cumhuriyet Fırkası, 1930’da Serbest Cumhuriyet Fırkası kuruldu; kalıcı çok partili hayat 1945-1946’da başladı.", "o": [["Muhalefet partisinin kurulmasına izin veririm", 2, [6, 6, 10, 0], ""], ["Seçimleri iptal ederim", 0, [-10, -10, -12, 0], "Seçimler demokrasinin temelidir."], ["Tek parti yeterlidir derim", 0, [-6, -8, -10, 0], "Çoğulculuk için farklı partiler gerekir."]]}, {"e": 2, "t": "Kadın hakları", "q": "Türk kadınına siyasi hakların verilmesi gündemde. Karar?", "i": "Kadınlara 1930’da belediye seçimlerine katılma, 1933’te köy muhtarı seçme-seçilme, 1934’te milletvekili seçme-seçilme hakkı verildi; 1935’te 18 kadın milletvekili Meclis’e girdi.", "o": [["Milletvekili seçme ve seçilme hakkını da veririm", 2, [8, 10, 12, 2], ""], ["Sadece belediye seçimlerinde hak veririm", 1, [2, 2, 2, 0], "Doğru bir adım ama eşit temsil için yetmez."], ["Hiçbir hak vermem", 0, [-8, -10, -10, 0], "Genel oy ve eşitlik ilkesine aykırıdır."]]}, {"e": 3, "t": "Darbe girişimi", "q": "Bazı kişiler silah zoruyla yönetimi ele geçirmek istiyor. Ne yaparsın?", "i": "Askerî darbeler (27 Mayıs 1960, 12 Eylül 1980) demokratik düzeni durdurdu. 15 Temmuz 2016’da millet demokrasiye sahip çıktı; bu gün Demokrasi ve Millî Birlik Günü ilan edildi.", "o": [["Millî iradeye ve meşru yönetime sahip çıkarım", 2, [10, 8, 10, 0], ""], ["Sessiz kalırım", 0, [-8, -8, -8, 0], "Halkın iradesi gasp edilir."], ["Darbecilere destek veririm", 0, [-12, -12, -12, 0], "Demokrasiye büyük zarar verir."]]}, {"e": 3, "t": "Okul kantini", "q": "Kantinde bazı büyük öğrenciler sıraya girmeden öne geçiyor. Ne yaparsın?", "i": "Sıraya girmemek, başkalarının hakkını gasp etmek günlük hayatta karşılaşılan antidemokratik davranışlardır.", "o": [["Kuralı herkese eşit uygulatırım", 2, [8, 4, 4, 0], ""], ["Görmezden gelirim", 1, [-2, -2, -2, 0], "Hakkı çiğnenenler mağdur olur."], ["Büyük sınıflar önce geçsin derim", 0, [-8, -4, -4, 0], "Eşitlik ilkesine aykırıdır."]]}, {"e": 3, "t": "Dünyadan haber", "q": "Bir ülkede insanlar ırkları yüzünden eşit haklara sahip olamıyor (apartheid). Tavrın?", "i": "Irk ayrımcılığı (apartheid) gibi uygulamalar insan haklarına ve eşitliğe aykırıdır; demokrasiye yönelik ağır tehditler arasındadır.", "o": [["İnsan hakları ve eşitliği savunurum", 2, [8, 10, 6, 2], ""], ["Bu onların iç meselesi derim", 1, [-2, -4, -2, 0], "İnsan hakları evrenseldir."], ["Ayrımcılığı desteklerim", 0, [-12, -12, -6, -4], "Eşitlik ve insan hakları ilkesine aykırıdır."]]}];
const S={i:0,h:3,m:[50,50,50,50],pt:[0,0,0,0],mx:[0,0,0,0],miss:[],q0:0,me:null,sent:false,t:TIME,tk:null,ans:false};
C.forEach(c=>S.mx[c.e]+=2);
const N=C.length,pct=()=>Math.round(S.pt.reduce((a,b)=>a+b,0)/(2*N)*100);
function hud(){$('#hh').textContent=`❤️`.repeat(S.h)+'🖤'.repeat(3-S.h)+`  •  ★ ${pct()}`;
$('#top').innerHTML=`<div class="eras">${E.map((n,k)=>{const cur=S.i<N?C[S.i].e:9;return `<div class="era ${k==cur?'on':k<cur?'dn':''}">${EI[k]} ${n}</div>`}).join('')}</div><div class="mets">${MT.map((x,k)=>`<div class="met ${S.m[k]<25?'lo':''}">${x[0]} ${x[1]} ${S.m[k]}<i><b style="width:${S.m[k]}%"></b></i></div>`).join('')}</div>`}
function start(){hud();$('#app').innerHTML=`<div class="card"><h1>Cumhuriyet Nöbeti</h1><p class="q">Cumhuriyet Kasabası’nın demokrasi nöbetçisisin! Cumhuriyetin nitelikleri, yönetim yapısı, demokrasinin gelişimi ve sorunları üzerine ${N} karar seni bekliyor. Her karar için ${TIME} saniyen var. Hatalı karar bir canını götürür; Hukuk, Özgürlük, Katılım ve Refah göstergelerinden biri sıfıra inerse kriz çıkar. ❤️ Üç canın var.</p>${LINK_KOD?`<div class="form"><input id="fa" placeholder="Ad Soyad" autocomplete="name"><input id="fs" placeholder="Sınıf (ör. 7-A)"><input id="fn" placeholder="Okul numarası (bilmiyorsan boş bırak)" inputmode="numeric"></div><div id="fh" style="font-weight:800;color:var(--r)"></div>`:''}<button class="btn" id="go">Nöbete Başla</button></div>`;
$('#go').onclick=()=>{if(LINK_KOD){const a=$('#fa').value.trim(),s=$('#fs').value.trim();if(!a||!s){$('#fh').textContent='Ad soyad ve sınıf gerekli';return}S.me={a,s,n:$('#fn').value.trim()||'-'}}play()}}
function play(){S.ans=false;S.t=TIME;hud();const c=C[S.i];c.s=c.s||sh(c.o);
$('#app').innerHTML=`<div class="card"><small style="font-weight:800">${EI[c.e]} ${E[c.e]} • Karar ${S.i+1} / ${N}</small><h2>${c.t}</h2><div class="tm"><i id="tb"></i></div><p class="q">${c.q}</p>${c.s.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}<div id="rs"></div></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
clearInterval(S.tk);S.tk=setInterval(()=>{S.t--;const tb=$('#tb');if(tb)tb.style.width=S.t/TIME*100+'%';if(S.t<=0)pick(-1)},1000)}
function pick(k){if(S.ans)return;S.ans=true;clearInterval(S.tk);const c=C[S.i],best=c.s.find(o=>o[1]==2),o=k<0?null:c.s[k],q=o?o[1]:0;
S.pt[c.e]+=q;let msg='',lost=0;
if(q==0){S.h--;lost++;S.q0++;S.miss.push(c.t)}else if(q==1)S.miss.push(c.t);
if(o)o[2].forEach((d,j)=>{S.m[j]=Math.max(0,Math.min(100,S.m[j]+d))});
S.m.forEach((v,j)=>{if(v<=0){S.m[j]=30;S.h--;lost++;msg+=`<small>⚠️ ${MT[j][1]} sıfıra indi, kriz çıktı! ❤️ kaybettin.</small>`}});
S.h=Math.max(0,S.h);hud();
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(c.s[j]===best)b.classList.add('ok');else if(j===k)b.classList.add(q==1?'md':'no')});
const cls=q==2?'ok':q==1?'md':'no',head=k<0?'⏰ Süre doldu!':q==2?'✅ Mükemmel karar!':q==1?'🟡 Kısmen doğru.':'❌ Hatalı karar.';
const fb=o&&q<2?`<small>${o[3]}</small>`:k<0?'<small>Zamanında karar vermek de bir yöneticinin görevidir.</small>':'';
const over=S.h<=0,last=S.i>=N-1;
$('#rs').innerHTML=`<div class="res ${cls}">${head}${fb}${q<2?`<small>En iyi karar: ${best[0]}.</small>`:''}<small>📘 ${c.i}</small>${msg}</div><button class="btn" id="nx">${over?'Sonucu gör':last?'Nöbeti bitir 🏁':'Sıradaki karar'}</button>`;
$('#nx').onclick=()=>{if(over||last)end(over);else{S.i++;play()}}}
function end(over){clearInterval(S.tk);S.i=N;hud();const p=pct(),t=p>=85?['🏛️','Anayasa Mahkemesi Üyesi']:p>=60?['🗳️','TBMM Milletvekili']:['📜','Genç Vatandaş'];
$('#app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">${over?'🕯️':t[0]}</div><h2>${over?'Nöbet sona erdi… ama ders aldın!':t[1]}</h2>${S.me?`<p>${S.me.a} • ${S.me.s}</p>`:''}<div class="big">${p} / 100</div></div>
<div class="card" style="margin-top:12px"><h3>Dönem puanların</h3>${E.map((n,k)=>`<div class="row"><span>${EI[k]} ${n}</span><b>${S.pt[k]} / ${S.mx[k]}</b></div>`).join('')}<h3>Tekrar etmen gerekenler (${S.miss.length})</h3>${S.miss.length?S.miss.map(m=>`<div class="miss">${m}</div>`).join(''):'<p>Hepsi kusursuz, harika! 🎉</p>'}<p id="msg" style="font-weight:800"></p><button class="btn" onclick="location.reload()">Yeniden oyna</button></div>`;sendRes()}
async function sendRes(){const m=$('#msg');if(!LINK_KOD||!SCRIPT_URL||!S.me||S.sent)return;m.textContent='⏳ Sonuçların öğretmenine gönderiliyor…';
const body={kod:LINK_KOD,okulKodu:LINK_KOD,oyun:OYUN,ad:S.me.a,sinif:S.me.s,no:S.me.n,puan:pct(),b:S.pt,yanlis:S.miss.length,liste:E.map((n,k)=>n+': '+S.pt[k]+'/'+S.mx[k]).join(' | ')+(S.miss.length?' || Tekrar: '+S.miss.join(', '):'')};
try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});S.sent=true;m.textContent='✓ Sonuçların öğretmenine gönderildi.'}catch(e){m.innerHTML='⚠️ Gönderilemedi. <button class="btn" id="rt">Tekrar dene</button>';$('#rt').onclick=sendRes}}
start();
