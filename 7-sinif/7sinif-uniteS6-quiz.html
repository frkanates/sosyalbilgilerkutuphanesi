<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gelecek Laboratuvarı | 7. Sınıf 6. Öğrenme Alanı Quizi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#eaf0f8;color:#1e293b;padding:16px;display:flex;justify-content:center}
.box{width:100%;max-width:880px;background:#fff;border:2px solid #cdd6ea;border-radius:18px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;background:#fbfdff;border-bottom:2px solid #cdd6ea;font-weight:700}
.sc{background:#e6e1fa;color:#3e2f8f;border-radius:99px;padding:4px 14px}
.rail{height:7px;background:#e7dfd2}#pf{height:100%;width:0;background:#5b4bb7;transition:width .3s}
#app{padding:22px 20px}h2{font-size:1.4rem;margin-bottom:4px}.d{color:#64748b;margin-bottom:14px}
.pool,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fbfdff;border:1.5px solid #cdd6ea;border-radius:12px;margin-bottom:14px;min-height:54px}
.pill,.w{background:#fff;border:2px solid #cdd6ea;border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.on{background:#5b4bb7;color:#fff;border-color:#5b4bb7}.w.pl{opacity:.35;pointer-events:none}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.bk{border:2px dashed #cfc2ae;border-radius:12px;padding:14px;min-height:150px;cursor:pointer;background:#fbfdff}.bk h3{font-size:1rem;margin-bottom:10px}
.chip{display:inline-block;background:#fff;border:1px solid #d4c8b6;border-radius:99px;padding:4px 12px;margin:3px;font-weight:700;font-size:.88rem}.chip b{color:#dc2626;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fbfdff;border:1.5px solid #cdd6ea;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.b2{border:2px solid #cdd6ea;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}
.t{background:#d1fae5;border-color:#059669;color:#059669}.f{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.slot{display:inline-block;min-width:110px;border-bottom:2.5px dashed #5b4bb7;background:#efecfb;border-radius:6px;padding:1px 8px;margin:0 3px;text-align:center;font-weight:800;color:#3e2f8f;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cdd6ea;border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.opt.on{background:#e6e1fa;border-color:#5b4bb7;color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1.5px solid #cdd6ea}
.nx{background:#5b4bb7;color:#fff;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer}.nx:disabled{opacity:.4;cursor:not-allowed}
.rv{border:1.5px solid;border-radius:12px;padding:10px 14px;margin-bottom:8px}.ok{background:#d1fae5;border-color:#059669}.bad{background:#fee2e2;border-color:#dc2626}
.note{font-size:.9rem;color:#475569;margin-top:4px}
input{width:100%;padding:10px;border:2px solid #cdd6ea;border-radius:10px;font:inherit;margin-bottom:10px}
.big{font-size:2.2rem;font-weight:800;color:#3e2f8f}
@media(max-width:600px){.g2{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.bar{flex-direction:column;align-items:stretch}}
</style></head><body>
<div class="box"><div class="hd"><span>📚 7. Sınıf Sosyal Bilgiler • Teknoloji ve Sosyal Bilimler</span><span><span id="st">Giriş</span> &nbsp;<span class="sc">★ <span id="sc">0</span></span></span></div>
<div class="rail"><div id="pf"></div></div><div id="app"></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwIFLeup5869qiswpGNL44WFFP-wCgxPywhDaLyF3plEWjVlyYVYyngDHT5-whp2gIi/exec";

// URL'den kodu yakala (?tasokul veya ?kod=tasokul). Kod yoksa quiz genel modda çalışır, sonuç kaydedilmez.
const URL_KOD=(function(){
  const p=new URLSearchParams(location.search);
  let k=(p.get('kod')||'').trim();
  if(!k){for(const key of p.keys()){if(key!=='kod'){k=key.trim();break}}}
  return k;
})();
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SORT=[["Arkeoloji","s"],["Coğrafya","s"],["Sosyoloji","s"],["Hukuk","s"],["Biyoloji","n"],["Fizik","n"],["Kimya","n"],["Matematik","n"]];
const SB=[["s","🌐 Sosyal bilim"],["n","🔬 Sosyal bilim değil"]];
const TF=[
["Bilim, evreni ve olayları deney, gözlem ve araştırmayla inceleyerek düzenli bilgiler ortaya koyan bir bilgi sistemidir.",true,"Bu, bilimin tanımıdır."],
["Teknoloji, bilimsel bilgilerden yararlanarak insanların yaşamını kolaylaştıran ürünler ortaya koyar.",true,"Bilim bilgi üretir, teknoloji uygular."],
["Bilim ve teknoloji birbirini hiç etkilemeyen, bağımsız alanlardır.",false,"İki alan birbirini tamamlar."],
["Nesnelerin interneti, genel ağa bağlı cihazların oluşturduğu sistemdir.",true,"Evler, okullar ve şehirler bu sayede daha akıllı olur."],
["Akıllı sokak lambaları enerji kullanımında verimliliği azaltır.",false,"Verimliliği artırır, gereksiz enerji tüketimini azaltır."],
["Sosyal bilimler, insanın fiziksel özelliklerinden çok toplumla kurduğu ilişkileri inceler.",true,"Odak toplum ve ilişkilerdir."],
["Coğrafya, yalnızca geçmişte yaşanmış olayları belgelerle inceleyen bilim dalıdır.",false,"Bunu tarih yapar; coğrafya insan ile yeryüzü ilişkisini inceler."],
["Problem çözme sürecinin son aşaması “çözüm üretme”dir.",false,"Son aşama değerlendirmedir."],
["Başkasına ait fikri kaynak göstermeden kullanmak intihaldir.",true,"İntihal bilimsel etik ihlalidir."],
["Alzheimer ilacı, hastalığın ileri evrelerinde de aynı derecede etkilidir.",false,"İlaç erken evrede başlanırsa etkilidir."]];
const FILL=[
["Bilim yeni bilgiler üretirken {} bu bilgileri günlük hayata uygular.","Teknoloji"],
["Birbirine bağlı tüm cihazların oluşturduğu sisteme {} denir.","Nesnelerin interneti"],
["Türkiye’de yapay zekâ çalışmaları {} Yapay Zekâ Enstitüsü tarafından yürütülür.","TÜBİTAK"],
["{}, tıp alanındaki araştırmalarıyla tanınan Türk-İslam bilginidir.","İbn-i Sina"],
["Suyla çalışan makineler ve otomatik saatler tasarlayan mühendis {}’dir.","Cezerî"],
["Matematikte cebirin gelişimine katkı sunan bilgin {}’dir.","Harezmi"],
["Geçmişte yaşanmış olayları belgelerle neden-sonuç ilişkisi içinde inceleyen bilim dalı {}’tir.","Tarih"],
["İnsan ile yeryüzü arasındaki ilişkiyi inceleyen bilim dalı {}’dır.","Coğrafya"],
["Araştırmada yararlanılan tüm kaynakların listelenmesine {} denir.","Kaynakça"],
["Kaynak göstermeden başkasının eserini kullanmaya {} denir.","İntihal"]];
const BANK=["Teknoloji","Nesnelerin interneti","TÜBİTAK","İbn-i Sina","Cezerî","Harezmi","Tarih","Coğrafya","Kaynakça","İntihal","Biruni","Dipnot","Sosyoloji"];
const MCQ=[
["Bilim ve teknoloji arasındaki ilişki için hangisi doğrudur?","Birbirini tamamlarlar; bilim bilgi üretir, teknoloji bu bilgiyi uygular",["Birbirinden tamamen bağımsızdır","Teknoloji bilimi gereksiz kılar","Yalnızca bilim insan yaşamını kolaylaştırır"],"Bilim bilgi üretir, teknoloji uygular."],
["Uzaya gönderilen uydular sayesinde hangi alanda büyük kolaylık sağlanmıştır?","İletişim ve haberleşme",["Kazı çalışmaları","Madencilik","Hayvancılık"],"Uydular, dünyanın farklı bölgeleriyle hızlı bağlantıyı sağlar."],
["ANKA 3’ün kuyruksuz tasarlanmasının nedeni hangisidir?","Radarlarca fark edilmesini zorlaştırmak, daha hafif olmak ve yakıt verimliliğini artırmak",["Kuyruğun üretilememesi","Daha yavaş uçmasını sağlamak","Yolcu taşımayı kolaylaştırmak"],"Kuyruksuz tasarım gizlilik ve verimlilik sağlar."],
["Akıllı kent sistemlerinin sağladığı yarar hangisidir?","Ulaşım ve enerjide verimlilik, hava ve gürültü kirliliğinin azalması",["Enerji tüketiminin artması","Su kaynaklarının israfı","Trafik yoğunluğunun artması"],"Teknoloji ve bilişim kentin yapılarında verimlilik sağlar."],
["Sibernetik biliminin öncüleri arasında yer alan Türk-İslam bilgini kimdir?","Cezerî",["Farabi","Biruni","Ali Kuşçu"],"Cezerî mekanik sistemler ve kontrol düzenekleri tasarlamıştır."],
["Hastalıkların gözle görülmeyen canlılardan kaynaklanabileceğini savunan bilgin kimdir?","İbn-i Sina",["Harezmi","Farabi","Ali Kuşçu"],"Mikrop kavramının gelişimine zemin hazırlamıştır."],
["Kapadokya’daki peri bacaları ve yer altı şehirleri hangi bilim dalının inceleme örneğidir?","Coğrafya",["Hukuk","Felsefe","Ekonomi"],"İnsan ile doğa arasındaki etkileşimi gösterir."],
["Trafik cezalarının uygulanması ve Tüketici Hakem Heyetleri hangi bilim dalıyla ilgilidir?","Hukuk",["Sosyoloji","Tarih","Arkeoloji"],"Hukuk, insanların haklarını koruyan kuralları inceler."],
["Problem çözme sürecinde “problemi tanıma” aşaması neden çok önemlidir?","Yanlış tanımlanan problem yanlış çözümlere yol açar",["Çözüm hemen uygulanır","Veriler tabloya dönüştürülür","Çözümün etkisi ölçülür"],"Problemin sınırları netleştirilmelidir."],
["Çözümün uzun vadede çevreye ve topluma duyarlı olmasını en iyi hangi ölçüt yansıtır?","Sürdürülebilirlik",["Ekonomiklik","Verimlilik","Hız"],"Sürdürülebilir çözümler gelecek nesilleri de düşünür."]];
const ORD=[
["Problem çözme süreci",["Problemi tanıma: sorunun sınırları belirlenir","Verilerin analizi ve yorumu: veriler düzenlenir","Değerlendirme: çözümün etkili olup olmadığı kontrol edilir"]],
["Mahalledeki çevre kirliliği hikâyesi (Serap)",["Serap çöpleri fark edip çözüm yollarını düşünür","Mahalledeki çöp kutularını araştırıp veri toplar","Muhtara öneri sunar, belediye yeni çöp kutuları yerleştirir"]],
["Türk-İslam bilginleri (eskiden yeniye)",["Harezmi (8–9. yy.)","Cezerî (12–13. yy.)","Ali Kuşçu (15. yy.)"]]];
const MAX=[16,20,20,20,24],NM=["Sosyal Bilim mi, Değil mi?","Doğru / Yanlış","Kelime Sandığı","Çoktan Seçmeli","Sıralama"];
let sec=-1,score=0,me={},sc=[],W=[],rev=null,sent=0;
const S={p:{},s:null,items:sh(SORT.map((x,i)=>({i,t:x[0],c:x[1]})))};
const T={a:{},items:sh(TF.map((x,i)=>({i,t:x[0],v:x[1],e:x[2]})))};
const F={p:{},s:null,items:sh(FILL.map((x,i)=>({i,t:x[0],r:x[1]}))),bank:sh(BANK)};
const M={i:0,a:{},rows:[],qs:MCQ.map(q=>({q:q[0],r:q[1],o:sh([q[1],...q[2]]),e:q[3]}))};
const O={i:0,rows:[],e:0,st:ORD.map(s=>{let o=sh(s[1].map((_,i)=>i));if(o.every((v,k)=>v==k))o.reverse();return{t:s[0],it:s[1],o}})};
const bar=(m,on,fn,l="Bölümü Tamamla →")=>`<div class="bar"><b>${m}</b><button class="nx" ${on?"":"disabled"} onclick="${fn}">${l}</button></div>`;
const esc=s=>String(s).replace(/</g,"&lt;");

function R(top){const y=scrollY;$("#sc").textContent=score;$("#st").textContent=sec<0?"Giriş":sec<5?`Bölüm ${sec+1} / 5`:"Sonuç";$("#pf").style.width=Math.max(0,sec)*20+"%";
$("#app").innerHTML=rev?revH():[startH,sortH,tfH,fillH,mcqH,ordH,endH][sec+1]();scrollTo(0,top?0:y);if(sec==5&&!rev&&!sent){sent=1;send()}}
function fin(rows,e){score+=e;sc[sec]=e;rows.forEach(r=>{if(!r.ok)W.push(r)});rev={rows,e};R(1)}
function go(){rev=null;sec++;R(1)}
function revH(){return `<h2>Bölüm ${sec+1} sonucu: +${rev.e} / ${MAX[sec]} puan</h2><p class="d">Yanlışlarını incele, doğrusunu öğren.</p>${rev.rows.map(r=>`<div class="rv ${r.ok?"ok":"bad"}">${r.ok?"✓":"✗"} ${r.t}${r.ok?"":`<div class="note">${r.n}</div>`}</div>`).join("")}${bar("",1,"go()",sec==4?"Sonucu Gör 🏁":"Sonraki Bölüm →")}`}

function startH(){return `<h2>Gelecek Laboratuvarı Quizi</h2><p class="d">Bilim ve teknolojinin etkilerini, sosyal bilim dallarını ve problem çözme adımlarını hatırla; sonra quizi çöz. Toplam 100 puan.</p><input id="ia" placeholder="Ad Soyad"><input id="is" placeholder="Sınıf (örn. 7/A)"><input id="in" placeholder="Okul numarası (bilmiyorsan boş bırak)">${bar("",1,"st0()","Başla →")}`}
function st0(){const a=$("#ia").value.trim(),s=$("#is").value.trim();if(!a||!s){alert("Ad soyad ve sınıfı yaz.");return}me={a,s,n:$("#in").value.trim()||"-",k:URL_KOD};sec=0;R(1)}

function sortH(){const un=S.items.filter(x=>!S.p[x.i]),bk=c=>S.items.filter(x=>S.p[x.i]==c).map(x=>`<span class="chip">${x.t} <b onclick="event.stopPropagation();delete S.p[${x.i}];R()">×</b></span>`).join("")||"<small>Buraya dokun</small>";
return `<h2>Bölüm 1: Sosyal Bilim mi, Değil mi?</h2><p class="d">Bir durum seç, sonra doğru kutuya dokun.</p><div class="pool">${un.map(x=>`<div class="pill ${S.s===x.i?"on":""}" onclick="S.s=${x.i};R()">${x.t}</div>`).join("")||"✓ Hepsi yerleşti"}</div><div class="g2">${SB.map(b=>`<div class="bk" onclick="drop('${b[0]}')"><h3>${b[1]}</h3>${bk(b[0])}</div>`).join("")}</div>${bar(`Kalan: ${un.length}`,!un.length,"doneS()")}`}
function drop(c){if(S.s==null)return;S.p[S.s]=c;S.s=null;R()}
function doneS(){const rows=S.items.map(x=>({ok:S.p[x.i]==x.c,t:x.t,n:`Doğrusu: ${SB.find(b=>b[0]==x.c)[1]}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function tfH(){const n=Object.keys(T.a).length;return `<h2>Bölüm 2: Doğru mu, Yanlış mı?</h2><p class="d">10 önermeyi işaretle.</p>${T.items.map(x=>`<div class="row"><span>${x.t}</span><span style="display:flex;gap:8px"><button class="b2 ${T.a[x.i]===true?"t":""}" onclick="T.a[${x.i}]=true;R()">✓ DOĞRU</button><button class="b2 ${T.a[x.i]===false?"f":""}" onclick="T.a[${x.i}]=false;R()">✕ YANLIŞ</button></span></div>`).join("")}${bar(`Cevaplanan: ${n} / 10`,n==10,"doneT()")}`}
function doneT(){const rows=T.items.map(x=>({ok:T.a[x.i]===x.v,t:x.t,n:`Senin cevabın: ${T.a[x.i]?"Doğru":"Yanlış"}. Doğrusu: <b>${x.v?"Doğru":"Yanlış"}</b>. ${x.e}`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function fillH(){const u=Object.values(F.p),n=u.length;return `<h2>Bölüm 3: Kelime Sandığı</h2><p class="d">Bir kelime seç, sonra boşluğa dokun. Dolu boşluğa dokunursan kelime geri alınır.</p>${F.items.map(x=>`<div class="row" style="display:block;line-height:2.1">${x.t.replace("{}",`<span class="slot" onclick="setSlot(${x.i})">${F.p[x.i]||"dokun"}</span>`)}</div>`).join("")}<div class="bank">${F.bank.map(w=>`<div class="w ${F.s===w?"on":""} ${u.includes(w)?"pl":""}" onclick="pickW(${F.bank.indexOf(w)})">${w}</div>`).join("")}</div>${bar(`Doldurulan: ${n} / 10`,n==10,"doneF()")}`}
function pickW(k){const w=F.bank[k];F.s=F.s===w?null:w;R()}
function setSlot(i){if(F.s){F.p[i]=F.s;F.s=null}else delete F.p[i];R()}
function doneF(){const rows=F.items.map(x=>({ok:F.p[x.i]==x.r,t:x.t.replace("{}",`<u>${F.p[x.i]}</u>`),n:`Doğrusu: <b>${x.r}</b>`}));fin(rows,rows.filter(r=>r.ok).length*2)}

function mcqH(){const q=M.qs[M.i],a=M.a[M.i],l=M.i==M.qs.length-1;return `<h2>Bölüm 4: Çoktan Seçmeli</h2><p class="d">Soru ${M.i+1} / ${M.qs.length}</p><p style="font-weight:700;margin-bottom:12px">${q.q}</p>${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" onclick="M.a[M.i]=${i};R()">${"ABCD"[i]}) ${o}</button>`).join("")}${bar(a===undefined?"Bir seçenek işaretle":"Seçim yapıldı",a!==undefined,"nextM()",l?"Bölümü Bitir →":"Sonraki Soru →")}`}
function nextM(){const q=M.qs[M.i],y=q.o[M.a[M.i]];M.rows.push({ok:y==q.r,t:q.q,n:`Senin cevabın: ${y}<br>Doğru cevap: <b>${q.r}</b><br>${q.e}`});if(M.i<M.qs.length-1){M.i++;R(1)}else fin(M.rows,M.rows.filter(r=>r.ok).length*2)}

function ordH(){const s=O.st[O.i];return `<h2>Bölüm 5: Sıralama</h2><p class="d">${s.t} (${O.i+1} / 3) — okları kullanarak doğru sıraya diz.</p>${s.o.map((v,k)=>`<div class="row"><span>${s.it[v]}</span><span style="display:flex;gap:6px"><button class="b2" ${k?"":"disabled"} onclick="mv(${k},-1)">▲</button><button class="b2" ${k<2?"":"disabled"} onclick="mv(${k},1)">▼</button></span></div>`).join("")}${bar("",1,"okO()",O.i<2?"Sırayı Onayla →":"Quizi Bitir 🏁")}`}
function mv(k,d){const o=O.st[O.i].o;[o[k],o[k+d]]=[o[k+d],o[k]];R()}
function okO(){const s=O.st[O.i],ok=s.o.every((v,k)=>v==k);O.rows.push({ok,t:s.t,n:"Doğru sıra: "+s.it.map((x,k)=>`${k+1}) ${x}`).join(" → ")});if(ok)O.e+=8;if(O.i<2){O.i++;R(1)}else fin(O.rows,O.e)}

function endH(){const t=score>=85?["🔭","Gelecek Mimarı"]:score>=65?["🧪","Genç Bilim İnsanı"]:["🔬","Meraklı Araştırmacı"];
return `<div style="text-align:center"><div style="font-size:3.5rem">${t[0]}</div><h2>${t[1]}</h2><p class="d">${esc(me.a)} • ${esc(me.s)}</p><div class="big">${score} / 100</div></div>
<h3 style="margin:14px 0 8px">Bölüm puanların</h3>${NM.map((n,i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${sc[i]} / ${MAX[i]}</b></div>`).join("")}
<h3 style="margin:14px 0 8px">Tekrar etmen gerekenler (${W.length})</h3>${W.length?W.map(r=>`<div class="rv bad">${r.t}<div class="note">${r.n}</div></div>`).join(""):"<p>Hepsi doğru, harika! 🎉</p>"}
<p id="msg" class="note" style="margin:12px 0;display:none;font-weight:700"></p>${bar("",1,"location.reload()","Yeniden Başla")}`}
async function send(){
  if(!me.k||!SCRIPT_URL)return;
  const m=$("#msg");
  if(m){m.style.display="block";m.style.color="#64748b";m.textContent="⏳ Sonuçların öğretmenine gönderiliyor…"}
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({kod:me.k,okulKodu:me.k,oyun:"7. Sınıf 6. Öğrenme Alanı Quizi",ad:me.a,sinif:me.s,no:me.n,puan:score,b:sc,yanlis:W.length,liste:W.map(r=>r.t.replace(/<[^>]+>/g,"")).join(" | ").slice(0,1500)})});
    if(m){m.style.color="#059669";m.textContent="✓ Sonucun öğretmenine gönderildi!"}
  }catch(e){
    if(m){m.style.color="#dc2626";m.textContent="⚠️ Sonuç gönderilemedi. İnternet bağlantını kontrol et."}
  }
}
R();
</script></body></html>
