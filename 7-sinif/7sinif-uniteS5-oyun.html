function reset(){if(confirm('Tüm ilerleme silinsin mi?')){S={done:{},miss:{},me:S.me,sent:false};save();home()}}
function station(i){cur={i,ti:0,m:0};const s=ST[i];
 $('#app').innerHTML=`<button class="back" onclick="home()">← Hatta dön</button><div class="panel"><div class="ic">${s.e}</div><h2>${i+1}. İstasyon: ${s.n}</h2><p>${s.sub}</p><div class="cards">${s.info.map(c=>`<div class="ic2"><b>${c[0]} ${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div><button class="go big" onclick="task()">Göreve başla →</button></div>`}
function task(){const s=ST[cur.i],t=s.t[cur.ti];
 $('#app').innerHTML=`<button class="back" onclick="home()">← Hatta dön</button><div class="panel"><div class="meta"><span>${s.e} ${s.n} • Görev ${cur.ti+1}/${s.t.length}</span><span id="ms">Hata: ${cur.m}</span></div><div class="rail"><i style="width:${cur.ti/s.t.length*100}%"></i></div><p class="q">${t.q}</p><div id="box"></div></div>`;
 TK[t.k](t,$('#box'),()=>{cur.m++;$('#ms').textContent='Hata: '+cur.m},()=>{if(++cur.ti<s.t.length)task();else result()})}
function result(){const m=cur.m,i=cur.i,st=m<=1?3:m<=3?2:1;
 if(!S.done[i]||st>S.done[i])S.done[i]=st;S.miss[i]=S.miss[i]==null?m:Math.min(S.miss[i],m);S.sent=false;save();$('#tot').textContent=tot();
 const all=ST.every((_,k)=>S.done[k]);
 $('#app').innerHTML=`<div class="panel c"><div class="ic">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${st==3?'Kusursuz üretim!':st==2?'Güzel iş!':'Hat çalıştı!'}</h2><p>${m} hata yaptın. ${st<3?'Daha az hatayla tekrar deneyip yıldızını artırabilirsin.':''}</p><button class="go big" onclick="${all?'end()':'home()'}">${all?'Sertifikamı gör 🏅':'Hatta dön'}</button>${st<3?`<br><button class="back" onclick="station(${i})">↻ Tekrar dene</button>`:''}</div>`}
function end(){const t=tot(),r=t>=13?['🏅','Baş Mühendis']:t>=9?['⚙️','Usta Üretici']:['🔧','Çırak Üretici'];
 $('#app').innerHTML=`<div class="panel c"><div class="ic">${r[0]}</div><h2>${r[1]}</h2>${S.me?`<p>${esc(S.me.a)} • ${esc(S.me.s)}</p>`:''}<div class="bigno">${t} / 15 ★</div>${ST.map((s,i)=>`<div class="row"><span>${s.e} ${s.n}</span><b>${'★'.repeat(S.done[i]||0)}</b></div>`).join('')}<p id="msg" class="hint"></p><button class="go big" onclick="home()">Hatta dön</button></div>`;sendRes()}
async function sendRes(){const m=$('#msg');if(!m)return;if(!LINK_KOD||!SCRIPT_URL||!S.me)return;
 if(S.sent){m.textContent='✓ Sonuçların öğretmenine gönderildi.';return}
 m.textContent='⏳ Sonuçların öğretmenine gönderiliyor…';
 const stars=ST.map((s,i)=>S.done[i]||0),T=stars.reduce((a,b)=>a+b,0);
 const body={kod:LINK_KOD,okulKodu:LINK_KOD,oyun:OYUN,ad:S.me.a,sinif:S.me.s,no:S.me.n||'-',puan:Math.round(T/(3*ST.length)*100),b:stars,yanlis:Object.values(S.miss||{}).reduce((a,b)=>a+b,0),liste:ST.map((s,i)=>s.n+': '+stars[i]+'★').join(' | ')};
 try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});S.sent=true;save();m.textContent='✓ Sonuçların öğretmenine gönderildi.'}
 catch(e){m.innerHTML='⚠️ Sonuç gönderilemedi. <button class="go" onclick="sendRes()">Tekrar dene</button>'}}
home();
</script></body></html>
